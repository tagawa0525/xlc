# xlc の実行ファイルを作るステージ（ADR-0159）。examples/*/dvc.yaml の Rust のステージは、ここで作った bin/ の実行ファイルを
# deps にして呼ぶ。deps は実行ファイルを作りうるもの（コード、依存、ツールチェーン、コンパイルの設定、devShell）の
# すべてで、どれかが変わると build だけが走る。作った実行ファイルのバイトが変わらなければ、計算のステージは走らない。
# 例のステージが deps にする Python のファイルの正規形も、ここの python-ast が書く（ADR-0210）。
stages:
  build:
    cmd: scripts/build-binaries.sh
    deps:
      - scripts/build-binaries.sh
      - crates
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - flake.nix
      - flake.lock
    outs:
      - bin/xs
      - bin/lattice
      - bin/core
      - bin/chain
  # 計算のステージが deps にする Python のファイルの正規形（ADR-0210）。docstring とコメントを除いた形を python-ast/ に書き、
  # git で追跡する。計算のステージの cmd は元の .py を呼び、deps にはその正規形を書く。docstring とコメントだけの変更では
  # このステージだけが走り、正規形のバイトが変わらなければ計算のステージは走らない。並びは、どれかの例の deps にある .py の
  # すべて（scripts/test_normalize_python.py が、例の deps との食い違いを止める）
  python-ast:
    foreach:
      - examples/c5g7/compare.py
      - examples/c5g7/openmc_model.py
      - examples/colorset/compare.py
      - examples/colorset/diffusion.py
      - examples/colorset/without_df.py
      - examples/core/compare_rods.py
      - examples/core/rod_table.py
      - examples/core/rods_cases.py
      - examples/depletion/compare_depletion.py
      - examples/depletion/compare_depletion_assembly.py
      - examples/depletion/openmc_chain.py
      - examples/depletion/openmc_depletion.py
      - examples/depletion/openmc_depletion_mox.py
      - examples/mox/compare_capture.py
      - examples/mox/openmc_model.py
      - examples/openmc_common.py
      - examples/openmc_input.py
      - examples/openmc_resume.py
      - examples/openmc_run.py
      - examples/reflector/compare_axial.py
      - examples/reflector/compare_edge.py
      - examples/reflector/compare_radial.py
      - examples/vera/compare_k.py
      - examples/vera/compare_keno.py
      - examples/vera/compare_keno_lattice.py
      - examples/vera/compare_openmc_keno.py
      - examples/vera/compare_p3.py
      - examples/vera/compare_p5.py
      - examples/vera/openmc_core_2d.py
      - examples/vera/openmc_library.py
      - examples/vera/openmc_model.py
      - examples/vera/openmc_tallies.py
      - examples/vera/p5/compare_hzp.py
    do:
      cmd: python3 scripts/normalize_python.py ${item} python-ast/${item}.ast
      deps:
        - scripts/normalize_python.py
        - ${item}
      outs:
        - python-ast/${item}.ast:
            cache: false
