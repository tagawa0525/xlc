# xlc の実行ファイルを作るステージ（ADR-0159）。examples/*/dvc.yaml の Rust のステージは、ここで作った bin/ の実行ファイルを
# 呼び、deps にはその正規形（binary-forms。ADR-0255）を書く。build の deps は実行ファイルを作りうるもの（コード、依存、
# ツールチェーン、コンパイルの設定、devShell）のすべてで、どれかが変わると build だけが走る。作った実行ファイルの正規形が
# 変わらなければ、計算のステージは走らない。
# 例のステージと binary-forms が deps にする Python のファイルと入力の TOML の正規形も、ここの python-ast と toml-values が書く（ADR-0210、ADR-0254）。
stages:
  build:
    cmd: scripts/build-binaries.sh
    deps:
      - scripts/build-binaries.sh
      - crates
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - flake.nix
      - flake.lock
    outs:
      - bin/xs
      - bin/lattice
      - bin/core
      - bin/chain
  # 計算のステージが deps にする実行ファイルの正規形（ADR-0255）。bin/ の実行ファイルの、ソースの行と列の番号を 0 にしたコピーの
  # md5 を binary-forms/ に書き、git で追跡する。計算のステージの cmd は bin/ の実行ファイルを呼び、deps にはその正規形を書く。
  # 注釈の行や関数の並べ替えだけで bin/ が変わっても、正規形が変わらなければ計算のステージは走らない
  binary-forms:
    foreach:
      - xs
      - lattice
      - core
      - chain
    do:
      cmd: python3 scripts/normalize_binary.py bin/${item} binary-forms/${item}.md5
      deps:
        - python-ast/scripts/normalize_binary.py.ast
        - bin/${item}
      outs:
        - binary-forms/${item}.md5:
            cache: false
  # 計算のステージが deps にする Python のファイルの正規形（ADR-0210）。docstring とコメントを除いた形を python-ast/ に書き、
  # git で追跡する。計算のステージの cmd は元の .py を呼び、deps にはその正規形を書く。docstring とコメントだけの変更では
  # このステージだけが走り、正規形のバイトが変わらなければ計算のステージは走らない。並びは、binary-forms とどれかの例の deps に
  # ある .py のすべて（scripts/test_normalize_python.py が、deps との食い違いを止める）
  python-ast:
    foreach:
      - examples/c5g7/compare.py
      - examples/c5g7/openmc_model.py
      - examples/colorset/compare.py
      - examples/colorset/diffusion.py
      - examples/colorset/without_df.py
      - examples/core/compare_rods.py
      - examples/core/rods_cases.py
      - examples/depletion/check_natural_isotopes.py
      - examples/depletion/compare_branch_cross_terms.py
      - examples/depletion/compare_burnup_interpolation.py
      - examples/depletion/compare_chain_versions.py
      - examples/depletion/compare_depletion.py
      - examples/depletion/compare_depletion_assembly.py
      - examples/depletion/compare_depletion_versions.py
      - examples/depletion/compare_grid_interpolation.py
      - examples/depletion/openmc_chain.py
      - examples/depletion/openmc_depletion.py
      - examples/depletion/openmc_depletion_mox.py
      - examples/depletion/p9-timing/p9_timing.py
      - examples/depletion/process_survey.py
      - examples/depletion/read_survey.py
      - examples/mox/compare_capture.py
      - examples/mox/openmc_model.py
      - examples/openmc_common.py
      - examples/openmc_input.py
      - examples/openmc_resume.py
      - examples/openmc_run.py
      - examples/reflector/compare_axial.py
      - examples/reflector/compare_edge.py
      - examples/reflector/compare_radial.py
      - examples/vera/compare_k.py
      - examples/vera/compare_keno.py
      - examples/vera/compare_keno_lattice.py
      - examples/vera/compare_openmc_keno.py
      - examples/vera/compare_p3.py
      - examples/vera/compare_p5.py
      - examples/vera/compare_p6.py
      - examples/vera/openmc_core_2d.py
      - examples/vera/openmc_library.py
      - examples/vera/openmc_model.py
      - examples/vera/openmc_tallies.py
      - examples/vera/p5/compare_hzp.py
      - examples/vera/p5/compare_rodless.py
      - scripts/normalize_binary.py
      - scripts/normalize_toml.py
    do:
      cmd: python3 scripts/normalize_python.py ${item} python-ast/${item}.ast
      deps:
        # 正規形を書くスクリプト自身は、その正規形を自分で書けない（書くには先に自分が要る）ので、ファイルそのものを deps にする
        - scripts/normalize_python.py
        - ${item}
      outs:
        - python-ast/${item}.ast:
            cache: false
  # 計算のステージが deps にする入力の TOML の正規形（ADR-0254）。tomllib で読んだ値をキーの順のまま JSON にして toml-values/ に
  # 書き、git で追跡する。計算のステージの cmd は元の TOML を読み、deps にはその正規形を書く。コメント、空白、引用符の書き方
  # だけの変更ではこのステージだけが走り、正規形のバイトが変わらなければ計算のステージは走らない。並びは、どれかの例の deps に
  # ある TOML のうちステージの出力でないもののすべて（scripts/test_normalize_toml.py が、例の deps との食い違いを止める）
  toml-values:
    foreach:
