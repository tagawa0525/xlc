[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
# 燃焼の CRAM の疎な複素 LU（ADR-0007、ADR-0161）。faer の並列（rayon）は切る。材料ごとの並列は呼ぶ側が持つ
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
num-complex = "0.4.6"
num_cpus = "1.17.0"
rayon = "1.12.0"
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# チェックポイントの指紋（ADR-0196）
sha2 = "0.10.9"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# テストは数値計算が中心で、最適化なしだと遅い。opt-level 1 で足りる。dev を使う cargo build と clippy も同じ設定になる（ADR-0180）
[profile.dev]
opt-level = 1

# 本番のコードでは panic させない（エラーとして返す）。テストでは clippy.toml と各クレートの
# 入口の cfg_attr(test, ...) で許す
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# assert! 系は clippy.toml の disallowed-macros で禁止する（lint の対象にする macro の一覧）
disallowed_macros = "deny"
