repos:
  - repo: local
    hooks:
      - id: design-records
        name: design-records
        entry: design-records check --changed
        language: system
        always_run: true # ADR を消すだけのコミット（渡すファイルが無い）でも検査する
        require_serial: true # ADR どうしの検査を 1 回で（分けて呼ぶと同じ指摘が重なる）
        types: [text]
        verbose: true # 通ったときも warning を見せる
      - id: dvc-lock
        name: dvc.lock is readable by dvc
        entry: scripts/check-dvc-lock.sh
        language: system
        files: ^(examples/.*)?dvc\.lock$
        verbose: true
      - id: no-inline-tests
        name: no test code in the production sources
        entry: scripts/check-no-inline-tests.sh
        language: system
        files: ^crates/.*\.rs$
        pass_filenames: false # 渡されたファイルでなく、crates/*/src 全体を見る
        verbose: true
      - id: verification-tables
        name: record tables match the compare outputs
        entry: python3 examples/verification_tables.py --check
        language: system
        files: ^examples/(verification_tables\.py|.*/(verification(-[a-z0-9]+)?\.md|dvc\.lock|compare-[^/]*\.json))$
        pass_filenames: false # 渡されたファイルでなく、すべての記録を見る（JSON は追跡しない DVC の出力）
        verbose: true
      - id: python-ast
        name: example stages depend on the current Python forms
        # run-checks.sh は .py の差分があるときだけ Python のテストを実行するので、dvc.yaml だけの変更でも検査する（ADR-0210）
        entry: python3 scripts/test_normalize_python.py RepositoryDepsTest
        language: system
        files: ^(.*dvc\.yaml|python-ast/.*|.*\.py)$
        pass_filenames: false # 渡されたファイルでなく、すべての例の dvc.yaml と正規形を見る
        verbose: true
      - id: references-shell
        name: references-shell.txt matches the references devShell
        # references-shell のステージは always_changed で dvc repro まで書き直されないので、flake の変更で食い違っても
        # dvc status に出ない（ADR-0212、#0183）。devShell は flake.nix と flake.lock のほかに flake.nix が読むファイル
        # （docs/patches/ の NJOY のパッチなど）でも変わるので、並びをコピーせずにすべてのコミットで比べる（評価は 1 秒ほど）
        entry: scripts/check-references-shell.sh
        language: system
        always_run: true
        pass_filenames: false # 渡されたファイルでなく、追跡しているすべての references-shell.txt を見る
        verbose: true
