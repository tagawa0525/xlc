repos:
  - repo: local
    hooks:
      - id: design-records
        name: design-records
        entry: design-records check --changed
        language: system
        always_run: true # ADR を消すだけのコミット（渡すファイルが無い）でも検査する
        require_serial: true # ADR どうしの検査を 1 回で（分けて呼ぶと同じ指摘が重なる）
        types: [text]
        verbose: true # 通ったときも warning を見せる
      - id: dvc-lock
        name: dvc.lock is readable by dvc
        entry: scripts/check-dvc-lock.sh
        language: system
        files: ^(examples/.*)?dvc\.lock$
        verbose: true
      - id: no-inline-tests
        name: no test code in the production sources
        entry: scripts/check-no-inline-tests.sh
        language: system
        files: ^crates/.*\.rs$
        pass_filenames: false # 渡されたファイルでなく、crates/*/src 全体を見る
        verbose: true
      - id: verification-tables
        name: record tables match the compare outputs
        entry: python3 examples/verification_tables.py --check
        language: system
        files: ^examples/(verification_tables\.py|.*/(verification(-[a-z0-9]+)?\.md|dvc\.lock|compare-[^/]*\.json))$
        pass_filenames: false # 渡されたファイルでなく、すべての記録を見る（JSON は追跡しない DVC の出力）
        verbose: true
      - id: python-ast
        name: example stages depend on the current Python forms
        # run-checks.sh は .py の差分があるときだけ Python のテストを実行するので、dvc.yaml だけの変更でも検査する（ADR-0210）
        entry: python3 scripts/test_normalize_python.py RepositoryDepsTest
        language: system
        files: ^(.*dvc\.yaml|python-ast/.*|.*\.py)$
        pass_filenames: false # 渡されたファイルでなく、すべての例の dvc.yaml と正規形を見る
        verbose: true
      - id: toml-values
        name: example stages depend on the current TOML forms
        # TOML、正規形、dvc.yaml、dvc.lock、比較の JSON だけの変更は .py の差分が無く、run-checks.sh が Python のテストを実行しない
        # ので、ここで検査する（ADR-0254）。JSON の `inputs` と dvc.lock の照合（#0295）も同じテストが行う。比較のスクリプトの
        # md5 の書き方を変えたコミットも、その場で止める（.py）
        entry: python3 scripts/test_normalize_toml.py RepositoryDepsTest JsonInputsTest
        language: system
        files: ^(.*dvc\.(yaml|lock)|toml-values/.*|.*\.(toml|json|py))$
        pass_filenames: false # 渡されたファイルでなく、すべての例の dvc.yaml、正規形、追跡している JSON を見る
        verbose: true
      - id: binary-forms
        name: example stages depend on the binary forms
        # dvc.yaml、dvc.lock、正規形だけの変更は .py の差分が無く、run-checks.sh が Python のテストを実行しないので、ここで
        # 検査する（ADR-0255）
        entry: python3 scripts/test_normalize_binary.py RepositoryDepsTest
        language: system
        files: ^(.*dvc\.(yaml|lock)|binary-forms/.*|.*\.py|examples/.*\.(toml|yaml))$
        pass_filenames: false # 渡されたファイルでなく、すべての例の dvc.yaml（vars で読む TOML と YAML を含む）と、直下の dvc.lock と正規形を見る
        verbose: true
      - id: references-shell
        name: references-shell.txt matches the references devShell
        # references-shell のステージは always_changed で dvc repro まで書き直されないので、flake の変更で食い違っても
        # dvc status に出ない（ADR-0212、#0183）。devShell は flake.nix と flake.lock のほかに、flake.nix が references の
        # devShell に読み込む docs/patches/（NJOY のパッチ）でも変わる。すべてのコミットでは実行しない: 汚れた git の flake の
        # 評価は追跡している木を毎回 nix store にコピーする（約 19 MB）。並びから漏れたものはマージの前の検査で拾う（#0185）
        entry: scripts/check-references-shell.sh
        language: system
        files: ^(flake\.(nix|lock)|docs/patches/.*|(.*/)?references-shell\.txt)$
        pass_filenames: false # 渡されたファイルでなく、追跡しているすべての references-shell.txt を見る
        verbose: true
      - id: exclusions
        name: exclusions and provisional premises cite an open issue
        # 閉じた issue を指す除外は、issue を閉じるコミット（docs/issues の変更だけ）で生まれるので、すべてのコミットで
        # 実行する（#0294）
        entry: scripts/check-exclusions.py
        language: system
        always_run: true
        pass_filenames: false # 渡されたファイルでなく、追跡しているすべての印と issue の状態を見る
        verbose: true
      - id: docs-consistency
        name: documents are consistent (issue and ADR numbers, links, both directions)
        # 検査は追跡しているすべてのファイルのパスを読む（リンク先のパスの有無、消した issue への参照）ので、消すだけ
        # のコミットや .md 以外のコミットでも実行する（ADR-0233）
        entry: scripts/check-docs-consistency.sh
        language: system
        always_run: true
        pass_filenames: false # 渡されたファイルでなく、追跡しているすべてのファイルを見る
        require_serial: true
        verbose: true
