# xlc の語の辞書（claude-harness の ADR-0096 のリポジトリの辞書）。ja-terms がこの規則を先に、共通の辞書の規則のうち
# 同じ expected の規則がここに無いものを後に当てる。共通の辞書と同じ expected の規則を足すと共通の規則が当たらなく
# なるので、足す前に expected が共通の辞書に無いことを確かめる。
#
# 前半は、共通の辞書から移した xlc でしか使わない語の規則（claude-harness の #316。共通の辞書から消すまで両方にある）。
# 後半は、燃焼のテーブルの nominal と branch の訳語（#0291）。業界で通じる「基準条件」「ブランチ条件」「ベース計算」
# 「ブランチ計算」「履歴ブランチ」「瞬時ブランチ」に揃える。前か後ろに続く語で専門用語と決まる形だけを止め、一般の意味の
# 語（プログラムの条件分岐、git の分岐点、崩壊の分岐比、寸法や出力の公称値）と、文脈で直す語が変わる形（「公称の点」
# 「公称の組成」「履歴からの分岐」、単独の「分岐」など）は止めない。
version: 1
rules:
  - expected: ポイントワイズの断面積
    pattern: 点断面積
  # ADR で見つけた語。英語の直訳
  - expected: 正味の中性子流
    pattern: 正味の流れ
    specs:
      - from: 正味の流れを求める
        to: 正味の中性子流を求める
  # run の名詞と動詞。「再実行」の規則は、「走らせる」の規則に「走らせ直す」を取られないよう、語の形が重ならない
  # 書き方にしてある
  - expected: 乱数のシード
    # 「花の種」のような別の語は通す
    pattern: /乱数の種(?!類)/
    specs:
      - from: 乱数の種を固定する
        to: 乱数のシードを固定する
      - from: 花の種をまく
        to: 花の種をまく
      - from: 乱数の種類を選ぶ
        to: 乱数の種類を選ぶ
  - expected: 確率テーブル
    pattern: /確率表(?![現示])/
    specs:
      - from: 確率表を読む
        to: 確率テーブルを読む
      - from: 確率表現を確認する
        to: 確率表現を確認する
  - expected: 燃焼させる
    pattern: 燃やす
    specs:
      - from: 燃料を燃やす
        to: 燃料を燃焼させる
  - expected: 燃焼させた
    pattern: 燃やした
    specs:
      - from: 燃料を燃やした
        to: 燃料を燃焼させた
  - expected: 燃焼させて
    pattern: 燃やして
    specs:
      - from: 燃料を燃やして測る
        to: 燃料を燃焼させて測る
  - expected: 燃焼させない
    pattern: 燃やさない
    specs:
      - from: 燃料を燃やさない
        to: 燃料を燃焼させない
  - expected: 燃焼させられる
    pattern: 燃やせる
    specs:
      - from: 燃料を燃やせる
        to: 燃料を燃焼させられる
  - expected: 燃焼させられない
    pattern: 燃やせない
    specs:
      - from: 燃料を燃やせない
        to: 燃料を燃焼させられない
  - expected: 燃焼させられ
    pattern: 燃やされ
    specs:
      - from: 燃料が燃やされる
        to: 燃料が燃焼させられる
  - expected: 燃焼させ
    # 連用形（燃やし、測る）。「燃やした」「燃やして」は別の規則、「燃やし尽くす」「燃やしきる」は連用形でない
    pattern: /燃やし(?!た|て|尽|き)/
    specs:
      - from: 燃やし、測る
        to: 燃焼させ、測る
      - from: 燃やし尽くす
        to: 燃やし尽くす
  # OpenMC の inactive / active batches
  - expected: 非アクティブバッチ
    pattern: 捨てる世代
    specs:
      - from: 捨てる世代を決める
        to: 非アクティブバッチを決める
  - expected: アクティブバッチ
    pattern: 数える世代
    specs:
      - from: 数える世代を決める
        to: アクティブバッチを決める
  - expected: 中性子収支
    pattern: 中性子の釣り合い
    specs:
      - from: 中性子の釣り合いを取る
        to: 中性子収支を取る
  - expected: 支持格子あり
    pattern: /(?<![一-龥])枠あり/
    specs:
      - from: 枠ありの配置
        to: 支持格子ありの配置
  - expected: 支持格子なし
    pattern: /(?<![一-龥])枠なし/
    specs:
      - from: 格子の枠なしを使う
        to: 格子の支持格子なしを使う
  - expected: 支持格子のリング
    pattern: /(?<![一-龥])枠のリング/
    specs:
      - from: 枠のリングを足す
        to: 支持格子のリングを足す
  - expected: 支持格子の物質
    pattern: /(?<![一-龥])枠の物質/
    specs:
      - from: 枠の物質を指定する
        to: 支持格子の物質を指定する
  - expected: 支持格子を入れ
    pattern: /(?<![一-龥]|Copilot の|量の|予算の|上限の)枠を入れ/
    specs:
      - from: 枠を入れる
        to: 支持格子を入れる
  - expected: 支持格子による
    pattern: /(?<![一-龥]|Copilot の|量の|予算の|上限の)枠による/
    specs:
      - from: 枠による差を見る
        to: 支持格子による差を見る
      - from: 使用量の枠による制限
        to: 使用量の枠による制限
  - expected: 支持格子のある
    pattern: /(?<![一-龥])枠のある/
    specs:
      - from: 枠のある配置
        to: 支持格子のある配置
  - expected: 支持格子を足す
    pattern: /(?<![一-龥]|Copilot の|量の|予算の|上限の)枠を足す/
    specs:
      - from: 枠を足す
        to: 支持格子を足す
      - from: Copilot の枠を足す
        to: Copilot の枠を足す
  # 燃焼のテーブルの nominal と branch（#0291）。一致が同じ位置から始まれば長い方の規則が勝つ（prh）。「分岐」の規則は、
  # 前が漢字の形（条件分岐、全分岐）を一般の語として通す
  - expected: 基準条件
    pattern: 公称の状態
    specs:
      - from: 公称の状態との差
        to: 基準条件との差
      - from: 公称の状態の燃焼点
        to: 基準条件の燃焼点
      - from: 寸法の公称値
        to: 寸法の公称値
  - expected: ブランチ条件
    pattern: 公称でない状態
    specs:
      - from: 公称でない状態を解く燃焼点
        to: ブランチ条件を解く燃焼点
      - from: 公称でない点
        to: 公称でない点
  - expected: ベース計算
    # 基準条件で燃焼させた計算（履歴）。燃焼点と燃焼度が続けば基準条件の点の意味なので通す（燃焼点は下の規則）
    pattern: /公称の(?:状態の)?燃焼(?![点度])/
    specs:
      - from: 公称の燃焼の履歴の組成
        to: ベース計算の履歴の組成
      - from: 公称の状態の燃焼で得た組成
        to: ベース計算で得た組成
      - from: 公称の燃焼度
        to: 公称の燃焼度
  - expected: 基準条件の燃焼点
    pattern: 公称の燃焼点
    specs:
      - from: 公称の燃焼点で解く
        to: 基準条件の燃焼点で解く
  - expected: 基準ホウ素濃度
    pattern: /公称のホウ素(?:濃度)?/
    specs:
      - from: 公称のホウ素の自己遮蔽
        to: 基準ホウ素濃度の自己遮蔽
      - from: 公称のホウ素濃度で
        to: 基準ホウ素濃度で
  - expected: ベース計算のテーブル
    pattern: 公称のテーブル
    specs:
      - from: 公称のテーブルの条件
        to: ベース計算のテーブルの条件
  - expected: ブランチのテーブル
    pattern: /(?:状態の)?(?<![一-龥])分岐の?テーブル/
    specs:
      - from: 分岐のテーブルを作る
        to: ブランチのテーブルを作る
      - from: 状態の分岐のテーブル
        to: ブランチのテーブル
      - from: M4 の分岐テーブル
        to: M4 のブランチのテーブル
  - expected: ブランチ条件
    pattern: /(?<![一-龥])分岐の状態/
    specs:
      - from: 分岐の状態ごとの媒質
        to: ブランチ条件ごとの媒質
      - from: 条件分岐の状態
        to: 条件分岐の状態
  - expected: ブランチ条件の自己遮蔽
    pattern: /(?<![一-龥])分岐の自己遮蔽/
    specs:
      - from: 分岐の自己遮蔽の既定
        to: ブランチ条件の自己遮蔽の既定
  - expected: ブランチ条件を解く
    pattern: /(?<![一-龥])分岐を解く/
    specs:
      - from: 分岐を解く燃焼点
        to: ブランチ条件を解く燃焼点
  - expected: ブランチ計算
    # 「状態の分岐」は、数（1 状態の分岐）と動詞（燃焼した状態の分岐）の後では状態を修飾する語が前にあるので通す
    pattern: /(?<![一-龥])分岐の(?:格子)?計算|(?<![0-9])(?<![0-9] )(?<!た)状態の分岐(?![点比]|の?テーブル)/
    specs:
      - from: M3 の状態の分岐は
        to: M3 のブランチ計算は
      - from: 2A の 1 状態の分岐
        to: 2A の 1 状態の分岐
      - from: 燃焼した状態の分岐
        to: 燃焼した状態の分岐
      - from: 分岐の格子計算の k∞
        to: ブランチ計算の k∞
      - from: 分岐の計算ではテーブル
        to: ブランチ計算ではテーブル
  - expected: 瞬時ブランチ
    # 履歴ブランチと対にする（履歴効果と瞬時効果の対）
    pattern: /瞬時の分岐(?![点比])/
    specs:
      - from: 瞬時の分岐では組成が変わらない
        to: 瞬時ブランチでは組成が変わらない
  - expected: 履歴ブランチ
    # 条件を変えて燃焼させた履歴（history branch）
    pattern: /履歴の分岐(?![点比])/
    specs:
      - from: 履歴の分岐の数密度
        to: 履歴ブランチの数密度
      - from: 履歴の分岐点
        to: 履歴の分岐点
  - expected: $1のブランチ
    # 状態の軸の分岐。「分岐点」（git）と「分岐比」（崩壊）は通す
    pattern: /(制御棒|温度|密度|ホウ素)の分岐(?![点比])/
    specs:
      - from: 制御棒の分岐を解く格子
        to: 制御棒のブランチを解く格子
      - from: 燃料の温度の分岐だけを解く
        to: 燃料の温度のブランチだけを解く
      - from: 温度の分岐点
        to: 温度の分岐点
  - expected: ブランチなし
    pattern: /(?<![一-龥])分岐なし/
    specs:
      - from: 分岐なしの 1 つの状態で
        to: ブランチなしの 1 つの状態で
