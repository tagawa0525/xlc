# 分岐のテーブル（ADR-0097）の確認に使う VERA の核種の多群ライブラリ（ENDF/B-VIII.0、WIMS 69群）。
# 温度の格子点 550、565、580 K と、格子点の間で直接の格子計算をする 560、570 K。S(α,β) を持つ H-1 は、両側の
# 550、573.6、600 K の表から格子計算が内挿する（ADR-0080）。
output = "branches.msgpack"
endf-directory = "../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]

[nuclide.U-234]
endf = "n-092_U_234.endf"
temperatures = [550, 560, 565, 570, 580]

