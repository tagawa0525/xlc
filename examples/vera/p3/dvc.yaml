      - lattice-3B-plug-igrid.out
  lattice-3B-poison-igrid:
    cmd: mkdir -p lattice-3B && ../../../bin/lattice lattice-3B-poison-igrid.toml > lattice-3B-poison-igrid.out
    deps:
