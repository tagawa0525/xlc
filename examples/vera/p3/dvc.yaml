# このファイルは p3_inputs.py が書く。手で直さない。
# VERA Problem 3A、3B を xlc で解く段階: 多群ライブラリ（../dvc.yaml の xs）→ 燃料の高さの 2D の格子（層ごとの
# 少数群定数と、平板の燃料の媒質）→ 軸方向の反射体の平板（axial-<問題>）→ 炉心（平板の定数だけの等価性
# core-<問題>-slab と、f* の方法 core-<問題>）→ 比較（平板の MOC との等価性、KENO-VI）。実行するのは `dvc repro`
# （ADR-0159）。deps の書き方は examples/m0/dvc.yaml と同じ（段階の入力と、段階が呼ぶ実行ファイル）
stages:
  lattice-3A-fuel:
    cmd: mkdir -p lattice-3A && ../../../bin/lattice lattice-3A-fuel.toml > lattice-3A-fuel.out
    deps:
      - lattice-3A-fuel.toml
      - ../vera.msgpack
      - ../../../bin/lattice
    outs:
      - lattice-3A/fuel.msgpack
      - lattice-3A-fuel.out
      - medium-3A-fuel.msgpack
  lattice-3A-zgrid:
    cmd: mkdir -p lattice-3A && ../../../bin/lattice lattice-3A-zgrid.toml > lattice-3A-zgrid.out
    deps:
      - lattice-3A-zgrid.toml
      - ../vera.msgpack
      - ../../../bin/lattice
    outs:
      - lattice-3A/zgrid.msgpack
      - lattice-3A-zgrid.out
  lattice-3A-igrid:
    cmd: mkdir -p lattice-3A && ../../../bin/lattice lattice-3A-igrid.toml > lattice-3A-igrid.out
    deps:
      - lattice-3A-igrid.toml
      - ../vera.msgpack
      - ../../../bin/lattice
    outs:
      - lattice-3A/igrid.msgpack
      - lattice-3A-igrid.out
  axial-3A:
    cmd: mkdir -p axial-3A && RUST_LOG=debug ../../../bin/lattice axial-3A.toml > axial-3A.out 2> axial-3A.log
    deps:
      - axial-3A.toml
      - ../vera.msgpack
      - medium-3A-fuel.msgpack
      - ../../../bin/lattice
    outs:
      - axial-3A
      - axial-3A.out
      - axial-3A.log
  core-3A-slab:
    cmd: RUST_LOG=debug ../../../bin/core core-3A-slab.toml > core-3A-slab.out 2> core-3A-slab.log
    deps:
      - core-3A-slab.toml
      - core-3A-slab-cycle.toml
      - core-3A-slab-plant.toml
      - core-3A-slab-assemblies.toml
      - axial-3A
      - ../../../bin/core
    outs:
      - core-3A-slab.out
      - core-3A-slab.log
  core-3A:
    cmd: RUST_LOG=debug ../../../bin/core core-3A.toml > core-3A.out 2> core-3A.log
    deps:
      - core-3A.toml
      - core-3A-cycle.toml
      - core-3A-plant.toml
      - core-3A-assemblies.toml
      - axial-3A
      - lattice-3A/fuel.msgpack
      - lattice-3A/zgrid.msgpack
      - lattice-3A/igrid.msgpack
      - ../../../bin/core
    outs:
      - core-3A.out
      - core-3A.log
      - core-3A-pins.msgpack
      - core-3A-layers.msgpack
  compare-3A-slab:
    cmd: python3 ../../reflector/compare_axial.py axial-3A.log core-3A-slab.log > compare-3A-slab.out
    deps:
      - ../../reflector/compare_axial.py
      - axial-3A.log
      - core-3A-slab.log
    outs:
      - compare-3A-slab.out
  compare-3A:
    cmd: python3 ../compare_p3.py 3A ../../../references/vera/spec.txt core-3A.out core-3A-pins.msgpack core-3A-layers.msgpack > compare-3A.out
    deps:
      - ../compare_p3.py
      - ../compare_keno.py
      - ../../../references/vera/spec.txt
      - core-3A.out
      - core-3A-pins.msgpack
      - core-3A-layers.msgpack
    outs:
      - compare-3A.out
  lattice-3B-poison:
    cmd: mkdir -p lattice-3B && ../../../bin/lattice lattice-3B-poison.toml > lattice-3B-poison.out
    deps:
      - lattice-3B-poison.toml
      - ../vera.msgpack
