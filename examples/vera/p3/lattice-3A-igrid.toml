# このファイルは p3_inputs.py が書く。手で直さない。
# VERA Problem 3A（濃縮度 3.10%、ホウ素 1300 ppm、600 K。表 P3-1、P3-3）の、下の端の支持格子（Inconel-718）の高さの燃料の単一集合体の格子
# （外周は鏡面反射）。セルの分け方とトラックは examples/vera/p2 の集合体と同じ（ADR-0111）。Hf とギャップの He は除き
# （ADR-0054）、Pyrex の棒の中の He も真空（ADR-0120）。
# 支持格子は 1017 g / 8.19 g/cm³ / 1933/500 cm を 289 のセルに等しく分け、セルの外周の厚さ 0.022452 cm の枠にする（表 3。2Q と同じ置き方）
library = "../vera.msgpack"
few-group = { output = "lattice-3A/igrid.msgpack", bounds = [1e7, 0.625, 1e-5], pins = true }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

