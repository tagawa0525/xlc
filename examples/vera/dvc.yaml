# VERA の段階: ENDF → OpenMC のライブラリ（核種ごと）→ OpenMC → statepoint からの抽出、ENDF → xlc の多群ライブラリ
# （範囲 xs-range → 核種ごと xs-nuclide → 組み立て xs。ADR-0138）→ 格子計算（lattice）、両者の k の比較。走らせるのは default の devShell の `dvc repro`（ADR-0159）。NJOY と OpenMC を
# 使う段階は cmd を references の devShell で包み、その devShell の store のパス（references-shell.txt）を道具の deps に
# する（ADR-0130）。Rust の段階の deps は、段階の入力と、段階が呼ぶ実行ファイル（ADR-0159。examples/m0/dvc.yaml と同じ並び）。
vars:
  - openmc-library.toml
  - xs.toml
  - keno-pincells:
      - 1B
      - 1C
      - 1D
  - keno-assemblies:
      - 2A
      - 2B
      - 2C
      - 2D
      - 2E
      - 2F
      - 2G
      - 2H
      - 2I
      - 2J
      - 2K
      - 2Q
stages:
  references-shell:
    # 道具（NJOY、OpenMC、その Python API）の版、パッチ、依存のどれが変わっても store のパスが変わる。評価だけでビルドしない
    cmd: nix eval --raw ../..#devShells.x86_64-linux.references.outPath > references-shell.txt
    always_changed: true
    outs:
      - references-shell.txt:
          cache: false
  openmc-neutron:
    # 核種ごとの段階は、入力のうちその核種の項目だけを params で deps にする（ほかの核種の変更で走らせない。ADR-0130）
    foreach: ${neutron}
    do:
      cmd: nix develop ../..#references -c python3 openmc_library.py neutron openmc-library.toml ${key} openmc-library/neutron/${key}.h5
      deps:
        - openmc_library.py
        - ../openmc_input.py
        - references-shell.txt
        - ${item.endf}
      params:
        - openmc-library.toml:
            - neutron.${key}
      outs:
        - openmc-library/neutron/${key}.h5
  openmc-thermal:
    foreach: ${thermal}
    do:
      cmd: nix develop ../..#references -c python3 openmc_library.py thermal openmc-library.toml ${key} openmc-library/thermal/${key}.h5
      deps:
        - openmc_library.py
        - ../openmc_input.py
        - references-shell.txt
        - ${item.neutron}
        - ${item.thermal}
      params:
        - openmc-library.toml:
            - thermal.${key}
      outs:
        - openmc-library/thermal/${key}.h5
  openmc-index:
    cmd: nix develop ../..#references -c python3 openmc_library.py index openmc-library.toml openmc-library
    deps:
      - openmc_library.py
      - ../openmc_input.py
      - references-shell.txt
      - openmc-library.toml
      - openmc-library/neutron
      - openmc-library/thermal
    outs:
      - openmc-library/cross_sections.xml
  openmc-1B-model:
    # 問題の物質、形状、設定を model.xml に書く。model.xml はライブラリのパスもスレッド数も含まないので、スクリプトを
    # 直してもモデルが同じなら変わらず、下の openmc-1B は走り直さない（ADR-0136）
    cmd: nix develop ../..#references -c python3 openmc_model.py model p1/openmc-1B.toml p1/openmc-1B-model
    deps:
      - openmc_model.py
      - openmc_tallies.py
      - ../openmc_common.py
      - ../openmc_run.py
      - ../openmc_input.py
      - references-shell.txt
      - p1/openmc-1B.toml
    outs:
      - p1/openmc-1B-model
  openmc-1B:
    # ライブラリはディレクトリ全体を deps にする（どの核種が変わっても走るが、組成を写した並びの漏れがない。ADR-0130）。
    # スクリプトを deps にしない（モデルを変えない直しで走り直さないため。ADR-0136）。入力は、このスクリプトが読む
    # ライブラリのパスとスレッド数だけを params にする
    cmd: nix develop ../..#references -c python3 openmc_model.py run p1/openmc-1B.toml p1/openmc-1B-model p1/openmc-1B
    deps:
      - references-shell.txt
      - p1/openmc-1B-model/model.xml
      - openmc-library
    params:
      - p1/openmc-1B.toml:
          - cross-sections
          - threads
    outs:
      - p1/openmc-1B
  openmc-1B-extract:
    cmd: nix develop ../..#references -c python3 openmc_model.py extract p1/openmc-1B.toml p1/openmc-1B p1/openmc-1B-results
    deps:
      - openmc_model.py
      - openmc_tallies.py
      - ../openmc_common.py
      - ../openmc_run.py
      - ../openmc_input.py
      - references-shell.txt
      - p1/openmc-1B.toml
      - p1/openmc-1B
    outs:
      - p1/openmc-1B-results
  openmc-5A-2D-extract:
    # run は段階にしない（本番は手で Slurm に流した。verification.md の「Problem 5-2D の参照解」）。その statepoint を deps にして結果を抜く
    cmd: nix develop ../..#references -c python3 openmc_core_2d.py extract p5/openmc-5A-2D.toml ../../references/openmc/vera-5A-2D p5/openmc-5A-2D-results
    deps:
      - openmc_core_2d.py
      - openmc_model.py
      - openmc_tallies.py
      - ../openmc_common.py
      - ../openmc_input.py
      - ../openmc_resume.py
      - ../openmc_run.py
      - references-shell.txt
      - p5/openmc-5A-2D.toml
      - ../../references/openmc/vera-5A-2D
    outs:
      - p5/openmc-5A-2D-results
  xs-range:
    # ポイントワイズの範囲は、すべての核種の分離共鳴の上端で決まる。核種ごとの段階の入力にするため、先に求める
    # （ADR-0138）。ENDF はディレクトリごと deps にする。sha256 で固定した（ADR-0124）ので変わらない
    cmd: ../../bin/xs range xs.toml xs-range.toml
    deps:
      - xs.toml
      - ../../references/endf/ENDF-B-VIII.0_neutrons
      - ../../bin/xs
    outs:
      - xs-range.toml:
          cache: false
  xs-nuclide:
    # 核種ごとの段階は、入力のうちその核種の項目と、全核種に共通の項目だけを params で deps にする（ほかの核種の変更で
    # 走らせない。ADR-0138）。熱中性子散乱の ENDF は、固定した（ADR-0124）ディレクトリごと deps にする
    foreach: ${nuclide}
    do:
      cmd: ../../bin/xs nuclide xs.toml xs-range.toml ${key} xs-nuclides/${key}.msgpack
      deps:
        - xs-range.toml
        - ${endf-directory}/${item.endf}
        - ${thermal-directory}
        - ../../bin/xs
      params:
        - xs.toml:
            - sigma0
            - scattering-order
            - nuclide.${key}
      outs:
        - xs-nuclides/${key}.msgpack
  xs:
    cmd: ../../bin/xs assemble xs.toml xs-range.toml xs-nuclides
    deps:
      - xs.toml
      - xs-range.toml
      - xs-nuclides
      - ../../bin/xs
    outs:
      - vera.msgpack
  lattice-1B:
    # 結果の k∞ は標準出力に出るので、ファイルに受ける
    cmd: ../../bin/lattice p1/pincell-1B.toml > p1/lattice-1B.out
    deps:
      - p1/pincell-1B.toml
      - vera.msgpack
      - ../../bin/lattice
    outs:
      - p1/lattice-1B.out
  compare-1B:
    cmd: python3 compare_k.py p1/lattice-1B.out p1/openmc-1B-results/k.json > p1/compare-1B.out
    deps:
      - compare_k.py
      - p1/lattice-1B.out
      - p1/openmc-1B-results/k.json
    outs:
      - p1/compare-1B.out
  keno-pincell:
    # 仕様書の KENO-VI（ENDF/B-VII.0）との比較（本番のライブラリ）。ENDF/B-VII.0 のライブラリで同じ比較をする endfb70/dvc.yaml
    # の段階と対にして読む（ADR-0175）。要約 compare-keno-<問題>.json は git で追跡する（ADR-0176）
    foreach: ${keno-pincells}
    do:
      cmd: ../../bin/lattice p1/pincell-${item}.toml > p1/keno-lattice-${item}.out && python3 compare_keno_lattice.py --json compare-keno-${item}.json ../../references/vera/spec.txt ${item} p1/keno-lattice-${item}.out
      deps:
        - p1/pincell-${item}.toml
        - vera.msgpack
        - compare_keno_lattice.py
        - compare_keno.py
        - compare_k.py
        - compare_p3.py
        - ../../references/vera/spec.txt
        - ../../bin/lattice
      outs:
        - p1/keno-lattice-${item}.out
        - compare-keno-${item}.json:
            cache: false
  keno-assembly:
    foreach: ${keno-assemblies}
    do:
      cmd: ../../bin/lattice p2/assembly-${item}.toml > p2/keno-lattice-${item}.out && python3 compare_keno_lattice.py --json compare-keno-${item}.json ../../references/vera/spec.txt ${item} p2/keno-lattice-${item}.out p2/pins-${item}.msgpack
      deps:
        - p2/assembly-${item}.toml
        - vera.msgpack
        - compare_keno_lattice.py
        - compare_keno.py
        - compare_k.py
        - compare_p3.py
        - ../../references/vera/spec.txt
        - ../../bin/lattice
      outs:
        - p2/keno-lattice-${item}.out
        - p2/pins-${item}.msgpack
        - compare-keno-${item}.json:
            cache: false
