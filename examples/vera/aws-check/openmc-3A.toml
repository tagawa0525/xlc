# 自己完結な実行（aws_run.sh。ADR-0155）の確認用の小さい入力。examples/vera/p3/openmc-3A.toml のコピーで、粒子 1 万・200 世代・
# 捨てる 50・statepoint の間隔 20。世代を多くするのは、走っている途中で終了して再開を確かめる時間を取るため
# （docs/environment.md の「自己完結な実行」の「確認」）。k は参照解に使わない
problem = "3A"
cross-sections = "../openmc-library/cross_sections.xml"
particles = 10000
batches = 200
inactive = 50
seed = 1
threads = 2
statepoint-interval = 20
