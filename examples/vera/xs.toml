# VERA Problem 1B〜1D, 2A〜2K, 2Q, 3A, 3B, 5-2D, 5 の多群ライブラリ（ENDF/B-VIII.0、WIMS 69群）。OpenMC の参照解と同じ核種と温度:
# 燃料の核種と O は 565, 600, 900, 1200 K、
# 冷却材の H は S(α,β) の温度の 550, 573.6 K と 600 K（565 K は lattice が内挿する。ADR-0080。参照解の OpenMC は
# 565 K で処理した H-1 も作って使う）、ほかの核種（被覆管の Zircaloy-4 の Zr, Sn, Fe, Cr、冷却材の B、Pyrex の B, O, Si、
# SS304 の C, Si, P, Cr, Mn, Fe, Ni（天然の C は C-12 と C-13 に分ける。ADR-0079）、Inconel-718 の Si, Ti, Cr, Fe, Ni、
# AIC の Ag, In, Cd）は 565, 600 K（565 K は 3B と 5-2D）。B4C は B と C だけなので、足す核種はない。
# H-1 を除く全核種に、Problem 5 の分岐のテーブルの温度 560 K と 570 K を足す（ADR-0154。参照解の OpenMC にはない）。
output = "vera.msgpack"
endf-directory = "../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
# 省略すると 3（ADR-0076）。核種ごとの段階の params にするため、書いておく（ADR-0138）
scattering-order = 3

[nuclide.U-234]
endf = "n-092_U_234.endf"
temperatures = [560, 565, 570, 600, 900, 1200]

[nuclide.U-235]
endf = "n-092_U_235.endf"
temperatures = [560, 565, 570, 600, 900, 1200]

[nuclide.U-236]
endf = "n-092_U_236.endf"
temperatures = [560, 565, 570, 600, 900, 1200]

[nuclide.U-238]
endf = "n-092_U_238.endf"
