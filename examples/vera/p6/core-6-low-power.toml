# このファイルは p6_inputs.py が書く。手で直さない。VERA Problem 6 の炉心: core-6 の出力だけを 1e-6 倍にした熱水力の解（ノードの温度はほぼ入口の温度。core-6-isothermal と k を比べる）。
# 燃料は 2D の格子のテーブル、軸方向の反射体は平板のテーブル（f* の方法。ADR-0128）。径方向は鏡面反射（集合体 1 体）、
# z の両端は真空。z は下の水の外端から（仕様書の高さ + 55 cm）
cycle = "core-6-cycle.toml"
axial-mesh = [0.0, 50.0, 55.0, 61.053, 66.951, 70.817, 79.0281, 87.2393, 95.4504, 103.6616, 111.8727, 120.0839, 128.295, 132.105, 140.17, 148.235, 156.3, 164.365, 172.43, 180.495, 184.305, 192.37, 200.435, 208.5, 216.565, 224.63, 232.695, 236.505, 244.57, 252.635, 260.7, 268.765, 276.83, 284.895, 288.705, 296.77, 304.835, 312.9, 320.965, 329.03, 337.095, 340.905, 348.97, 357.035, 365.1, 373.165, 381.23, 389.295, 393.105, 401.0262, 408.9474, 416.8686, 424.7898, 432.711, 448.711, 452.51, 461.337, 468.937, 518.937]
radial-nodes = 1
boundary = { x = ["reflective", "reflective"], y = ["reflective", "reflective"], z = ["vacuum", "vacuum"] }

[thermal-hydraulics]
# 出力 (MW) は表 P6-1 の定格の 1e-6 倍。表 P6-1 の流量 0.6823 Mlbs/hr (kg/s)、圧力 2250 psia (MPa)。燃料の発熱の割合は表 18
power = 1.767e-05
flow = 85.9684
pressure = 15.513204
fuel-heat-fraction = 0.974
# 体積平均（ADR-0229 の案 E1。Kelly ら（2017）の MC21/CTF、MPACT/CTF の比較と同じ）
effective-temperature = "volume-average"
tolerance = 1.0e-05
# 燃料棒の寸法（表 1）、ペレットの密度（表 P6-1）。ギャップのコンダクタンスは NEA/NSC/DOC(2006)20 の式 (8) の値（ADR-0229 の
# 案 H1、H3。物理から導いた値ではない）
rod = { pellet-radius = 0.4096, clad-inner-radius = 0.418, clad-outer-radius = 0.475, pellet-density = 10.257, gap-conductance = 1.0e+04, rods = 264 }
# 集合体の断面 21.50 cm 角から燃料棒 264 本、案内管 24 本、計装管 1 本の外径の円を除いた面積 (cm²) と、その円周の和 (cm)
channel = { flow-area = 246.6465, wetted-perimeter = 882.4922 }

[state.hfp]
boron = 1300
b10 = 0.199
inlet = 565
