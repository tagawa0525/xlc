# VERA Problem 2Q: 2A に Zircaloy-4 の支持格子を入れた 17×17 型の燃料集合体（燃料、被覆管、減速材 565 K、減速材
# 0.743 g/cc、ホウ素 1300 ppm）。仕様書の表 P2-1、P2-4、表 3。支持格子は、各セルに 1/289 ずつ、セルの外周の箱にする
# （集合体の間のギャップには置かない）。H-1 は S(α,β) の温度の 550 K と 573.6 K の表を lattice が内挿する（ADR-0080）。
# 枠の厚さ t は、中間の支持格子 1 つの Zircaloy-4 875 g（表 3、密度 6.56 g/cc、高さ 3.810 cm）を 289 のセルに等しく
# 分けた面積 0.121138 cm² を、ピッチ p の正方形の外周の帯 4pt − 4t² で表すもの。組成は被覆管と同じ（表 P2-4 の
# Cladding and Grid）。ほかは assembly-2A.toml と同じ。
library = "../vera.msgpack"
pin-powers = "pins-2Q.msgpack"
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

[material.fuel]
temperature = 565
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.zircaloy]
temperature = 565

[material.zircaloy.nuclides]
