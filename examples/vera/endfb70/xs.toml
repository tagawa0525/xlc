# 検証用の多群ライブラリ（ENDF/B-VII.0、WIMS 69群。ADR-0175）。仕様書の KENO-VI（ENDF/B-VII.0）と核データの版を揃えて比べる。
# ../xs.toml（ENDF/B-VIII.0）と同じ核種、温度、群で、ENDF のディレクトリと次の 2 点だけが違う。
# - H-1 の S(α,β) の温度は 550 K と 600 K（ENDF/B-VII.0 の tsl-HinH2O.endf に 573.6 K はない。565 K は lattice が内挿する。
#   ADR-0080。KENO-VI の 3B も 550 K と 600 K の 2 つの計算から内挿している）
# - ENDF/B-VII.0 に C-12 と C-13 のファイルはなく、天然の C（n-006_C_000.endf）だけがある。ADR-0079 の C-12 と C-13 の
#   両方にその天然の C を指す（天然の C の個数密度を分けた先の 2 つが同じ断面積を持つ）
# 本番のライブラリではない。
output = "vera.msgpack"
endf-directory = "../../../references/endf/ENDF-B-VII.0_neutrons"
thermal-directory = "../../../references/endf/ENDF-B-VII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
# 省略すると 3（ADR-0076）。核種ごとのステージの params にするため、書いておく（ADR-0138）
scattering-order = 3

[nuclide.U-234]
endf = "n-092_U_234.endf"
temperatures = [560, 565, 570, 600, 900, 1200]

[nuclide.U-235]
endf = "n-092_U_235.endf"
temperatures = [560, 565, 570, 600, 900, 1200]

[nuclide.U-236]
endf = "n-092_U_236.endf"
