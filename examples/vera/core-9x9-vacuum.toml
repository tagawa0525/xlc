# lattice-9x9-vacuum.toml と同じ体系（右の辺が真空）を、その2群定数で1ノードの NEM で解くケース。
# z は反射で、高さは結果に効かない。+x の vacuum は、格子計算が少数群定数の右の辺に書いた比 J/φ を使う（ADR-0101）。
cycle = "core-9x9-vacuum-cycle.toml"
axial-mesh = [0.0, 11.42]
radial-nodes = 1
boundary = { x = ["reflective", "vacuum"], y = ["reflective", "reflective"], z = ["reflective", "reflective"] }
