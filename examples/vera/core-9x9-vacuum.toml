# lattice-9x9-vacuum.toml と同じ体系（右の辺が真空）を、その2群定数で1ノードの NEM で解く。
# 幅は 9 × 1.26 + 2 × 0.04 = 11.42 cm。z は反射で、高さは結果に効かない。
# +x の vacuum は、格子計算が少数群定数の右の辺に書いた比 J/φ を使う（ADR-0101）。
few-group = "fg-9x9-vacuum.msgpack"
size = [11.42, 11.42, 11.42]
nodes = [1, 1, 1]
boundary = { x = ["reflective", "vacuum"], y = ["reflective", "reflective"], z = ["reflective", "reflective"] }
