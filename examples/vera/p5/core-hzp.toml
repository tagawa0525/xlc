# VERA Problem 5（WBN1 の初装荷の零出力試験）の 3D の全炉心のケース。状態の名前は仕様書の表 P5-2 の場合の番号。
# `case-<n>-boron` は k = 1 になるホウ素濃度を探す（ADR-0145）。状態どうしの k の差（価値、係数）は比較の道具が取る
# （ADR-0146）。
# 比べるのは compare_hzp.py（実測値と KENO-VI の値）。
#
# まだ解けない（#0092）: サイクル、炉心の形、台帳（5-2D の装荷図と Problem 3 の軸方向の層）と、軸方向のメッシュと
# 境界はそれらが入ってから書く。バンクを挿入する場合（1、3〜10、12〜19、22〜31）は、状態の `banks`（ADR-0127）で
# 書くが、燃料の上の層の制御棒の軸（#0030）と格子計算の制御棒の分岐（#0093）が入ってから足す。
#
# cycle = "core-hzp-cycle.toml"
# axial-mesh = [...]
# radial-nodes = 1
# boundary = { x = ["vacuum", "vacuum"], y = ["vacuum", "vacuum"], z = ["vacuum", "vacuum"], outline = "vacuum" }

# ARO の臨界ホウ素濃度（実測 1291 ppm）。範囲はホウ素の軸の格子点（#0038）の中に置く（ADR-0145）
[state.case-2-boron]
b10 = 0.199
moderator = 565
fuel = 565
search = { boron = [1100.0, 1400.0], k = 1.0, tolerance = 1.0e-6, max-solves = 20 }

# 微分ホウ素価値（場合 2 と 11）
[state.case-2]
boron = 1291
b10 = 0.199
moderator = 565
fuel = 565

# バンクの価値の基準の ARO
[state.case-11]
boron = 1170
b10 = 0.199
moderator = 565
fuel = 565

# 等温温度係数（場合 20 と 21）
[state.case-20]
boron = 1291
b10 = 0.199
moderator = 560
fuel = 560

[state.case-21]
boron = 1291
b10 = 0.199
moderator = 570
fuel = 570

# D バンクの積分価値の全引き抜き（場合 32）
[state.case-32]
boron = 1230
b10 = 0.199
moderator = 565
fuel = 565
