# このファイルは p5_inputs.py が書く。手で直さない。
# VERA Problem 5-2D の全炉心の形（ADR-0105、ADR-0132）: 集合体 193 体（*）、燃料に面か角の点で接する反射体の輪、
# その外は `-`。反射体の位置は燃料との接し方で、I 型、L 型（I 型の定数。#0068 まで）、角型に分ける。
# L 型の位置の f* の辺は北東と南西の象限で x の向き、角型の位置に隣る I 型の位置は角型の格子の右と上の反射体。
pitch = 21.5
height = 21.5
map = [
  "-     -     -     -     C@90  E@90  I@90  I@90  I@90  I@90  I@90  N     C     -     -     -     -",
  "-     -     C@90  E@90  I@90  *     *     *     *     *     *     *     I     N     C     -     -",
  "-     C@90  I@90  *     *     *     *     *     *     *     *     *     *     *     I     C     -",
  "-     N@90  *     *     *     *     *     *     *     *     *     *     *     *     *     E     -",
  "C@90  I@90  *     *     *     *     *     *     *     *     *     *     *     *     *     I     C",
  "N@90  *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     E",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "E@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     N@270",
  "C@180 I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     I@270 C@270",
  "-     E@180 *     *     *     *     *     *     *     *     *     *     *     *     *     N@270 -",
  "-     C@180 I@180 *     *     *     *     *     *     *     *     *     *     *     I@270 C@270 -",
  "-     -     C@180 N@180 I@180 *     *     *     *     *     *     *     I@270 E@270 C@270 -     -",
  "-     -     -     -     C@180 N@180 I@270 I@270 I@270 I@270 I@270 E@270 C@270 -     -     -     -",
]

# 角型の格子の右上の反射体（燃料が −x −y の対角）
[reflector.C]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-corner.msgpack"]

# 角型の格子の右の反射体（燃料が −x、角型が +y）
[reflector.E]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-corner-right.msgpack"]

# I 型の格子の反射体（燃料が −x）
[reflector.I]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-I.msgpack"]

# 角型の格子の上の反射体（燃料が −y、角型が +x）
[reflector.N]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-corner-top.msgpack"]
