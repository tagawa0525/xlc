# VERA Problem 5A-2D（2D の 1/4 炉心）を OpenMC の連続エネルギーモードで解く入力（openmc_core_2d.py）。1 世代 100 万粒子・2300 世代、
# 最初の 300 世代を捨て、乱数のシード 1。粒子数と世代数の決め方は examples/vera/verification.md の「Problem 5-2D の参照解」。
# スレッド数 24 は Slurm の -c 24（共有モード。先に実行した 1 本で、ほかは 16。verification.md）。ライブラリには 565 K の構造材と吸収体の核種が要る（#0073）
problem = "5A-2D"
cross-sections = "../openmc-library/cross_sections.xml"
particles = 1000000
batches = 2300
inactive = 300
seed = 1
threads = 24
# references/openmc/vera-5A-2D/ の statepoint は、標準のタリーの組（ADR-0152）を足す前のモデルで流した（2026-10-12）。
# extract はその model.xml と入力のモデルを比べるので、入力は流したモデルのとおり組を入れない
standard-tallies = false
