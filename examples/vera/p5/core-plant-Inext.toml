# このファイルは p5_inputs.py が書く。手で直さない。
# VERA Problem 5-2D の全炉心の形（ADR-0105、ADR-0132）: 集合体 193 体（*）、燃料に面か角の点で接する反射体の輪、
# その外は `-`。反射体の位置は燃料との接し方で、I 型、L 型（I 型の定数。#0068 まで）、角型に分ける。
# L 型の位置は core-plant.toml と同じ、角型の位置に隣る I 型の位置も I 型の格子の反射体（5A-Inext）。
pitch = 21.5
height = 21.5
map = [
  "-     -     -     -     C@90  I@90  I@90  I@90  I@90  I@90  I@90  I@90  C     -     -     -     -",
  "-     -     C@90  I@90  I@90  *     *     *     *     *     *     *     I     I@90  C     -     -",
  "-     C@90  I@90  *     *     *     *     *     *     *     *     *     *     *     I     C     -",
  "-     I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     I     -",
  "C@90  I@90  *     *     *     *     *     *     *     *     *     *     *     *     *     I     C",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     *     *     I",
  "C@180 I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     I@270 C@270",
  "-     I@180 *     *     *     *     *     *     *     *     *     *     *     *     *     I     -",
  "-     C@180 I@180 *     *     *     *     *     *     *     *     *     *     *     I@270 C@270 -",
  "-     -     C@180 I@270 I@180 *     *     *     *     *     *     *     I@270 I@270 C@270 -     -",
  "-     -     -     -     C@180 I@270 I@270 I@270 I@270 I@270 I@270 I@270 C@270 -     -     -     -",
]

# 角型の格子の右上の反射体（燃料が −x −y の対角）
[reflector.C]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-corner.msgpack"]

# I 型の格子の反射体（燃料が −x）
[reflector.I]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-I.msgpack"]
