# このファイルは p5_inputs.py が書く。手で直さない。
# 正方形の炉心（small-moc.toml の体系）の炉心の形。角型の位置に隣る I 型の位置は、I 型の格子の反射体。
pitch = 21.5
height = 21.5
map = [
  "C@90  I@90  I@90  I@90  C",
  "I@180 *     *     *     I",
  "I@180 *     *     *     I",
  "I@180 *     *     *     I",
  "C@180 I@270 I@270 I@270 C@270",
]

# 角型の格子の右上の反射体（燃料が −x −y の対角）
[reflector.C]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-corner.msgpack"]

# I 型の格子の反射体（燃料が −x）
[reflector.I]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-I.msgpack"]
