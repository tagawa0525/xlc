# このファイルは p5_inputs.py が書く。手で直さない。
# VERA Problem 5-2D の集合体（濃縮度 3.10%、Pyrex の棒 24 本（図 5 の配置））の単一集合体の格子（外周は鏡面反射）。燃料、被覆管、減速材は 565 K、
# 減速材 0.743 g/cc、ホウ素 1300 ppm（表 M3-1、M3-4）。ほかは examples/vera/p2 の 2A、2E、2G、2H と同じ形。少数群定数は
# 形状関数と角の不連続因子つき（ADR-0096）で、炉心の反射体に面しない位置の燃料のノードの定数にする（ADR-0153）。
library = "../vera.msgpack"
few-group = { output = "lattice/31-p24.msgpack", bounds = [1e7, 0.625, 1e-5], pins = true }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 py    pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 py    pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 py    pin31 pin31 py    pin31 pin31 it    pin31 pin31 py    pin31 pin31 py    pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 py    pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 py    pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 py    pin31 pin31 py    pin31 pin31 py    pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
  "pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31",
]

