# 集合体の台帳。ID は全炉心の位置（列の名前と行の番号）。設計は、反射体に面しない位置は集合体の種類の単一集合体の
# 格子の定数、反射体に 1 面で面する位置（<種類>-I）と 2 面で面する位置（<種類>-corner）は、その種類の燃料の I 型と角型の
# 反射体の格子の燃料のノードの定数（ADR-0153。燃料の向きは装荷で回す）

[design.31]
bounds = [0.0, 21.5]
layers = ["lattice/31.msgpack"]

[design.31-I]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-I-fuel.msgpack"]

[design.31-corner]
bounds = [0.0, 21.5]
layers = ["lattice/reflector-corner-fuel.msgpack"]

[assembly.J07]
design = "31-corner"

[assembly.H07]
design = "31-I"

[assembly.G07]
design = "31-corner"

[assembly.J08]
