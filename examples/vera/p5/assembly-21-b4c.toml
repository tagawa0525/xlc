# このファイルは p5_inputs.py が書く。手で直さない。
# VERA Problem 5-2D の集合体（濃縮度 2.11%、24 本の案内管に B4C の制御棒（D バンク））の単一集合体の格子（外周は鏡面反射）。燃料、被覆管、減速材は 565 K、
# 減速材 0.743 g/cc、ホウ素 1300 ppm（表 M3-1、M3-4）。ほかは examples/vera/p2 の 2A、2E、2G、2H と同じ形。少数群定数は
# 形状関数と角の不連続因子つき（ADR-0096）で、炉心の燃料のノードの定数（f* の方法）にする。
library = "../vera.msgpack"
few-group = { output = "lattice/21-b4c.msgpack", bounds = [1e7, 0.625, 1e-5], pins = true }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 cr    pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 cr    pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 it    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 cr    pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 cr    pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 cr    pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
  "pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21 pin21",
]

