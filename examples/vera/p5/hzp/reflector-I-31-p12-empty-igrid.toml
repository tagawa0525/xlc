spacing = 0.03
boundary = { right = "vacuum" }
few-group = { bounds = [1e7, 0.625, 1e-5], nodes = [
  { output = "lattice/reflector-I-31-p12-empty-igrid-fuel.msgpack", columns = [1, 19], rows = [1, 19] },
  { output = "lattice/reflector-I-31-p12-empty-igrid.msgpack", columns = [20, 47], rows = [1, 19], reflector = true },
], pins = true }
widths = [
  { size = 0.04 },
  { size = 1.26, count = 17 },
  { size = 0.04 },
  { size = 0.19 },
  { size = 2.85 },
  { size = 0.71, count = 26 },
]
