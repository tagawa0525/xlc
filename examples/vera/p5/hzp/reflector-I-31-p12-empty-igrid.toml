# このファイルは p5_inputs.py が書く。手で直さない。
# VERA Problem 5 の径方向の反射体の I 型の格子（ADR-0095）: 燃料の集合体の右に反射体。左、上、下は鏡面反射、右は真空。燃料は濃縮度 3.10%、Pyrex の棒 12 本（図 5 の配置）、下の端の支持格子の高さの Pyrex の棒の下の端栓より下（案内管は空）。支持格子は 1017 g / 8.19 g/cm³ / 3.866 cm を 289 のセルに等しく分けた、セルの外周の厚さ 0.022452 cm の枠（表 3。Problem 3 と同じ置き方。ADR-0140）。
# 反射体は燃料側から、隙間の水 0.19 cm、SS304 のバッフル 2.85 cm、水 18.46 cm（1.13 節の表 16。5-2D と同じ形）。
# 分岐のテーブル（ADR-0097）で、ノードごとの形状関数と角の不連続因子を付ける（ADR-0131）。
