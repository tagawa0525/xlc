# VERA Problem 5 の集合体（濃縮度 3.10%、Pyrex の棒 12 本（図 5 の配置）、下の端の支持格子の高さの Pyrex の棒の毒物。支持格子は 1017 g / 8.19 g/cm³ / 3.866 cm を 289 のセルに等しく分けた、セルの外周の厚さ 0.022452 cm の枠（表 3。Problem 3 と同じ置き方。ADR-0140））の単一集合体の格子（外周は鏡面反射）の分岐のテーブル（ADR-0097）。少数群定数は形状関数と
# 角の不連続因子つき（ADR-0096）。組成は 5-2D と同じ（表 M3-4、Problem 3 の表 P3-3）で、冷却材はホウ酸水（ADR-0106）。
