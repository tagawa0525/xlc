# このファイルは p5_inputs.py が書く。手で直さない。
# VERA Problem 5 の集合体（濃縮度 2.619%）の単一集合体の格子（外周は鏡面反射）の分岐のテーブル（ADR-0097）。少数群定数は形状関数と
# 角の不連続因子つき（ADR-0096）。組成は 5-2D と同じ（表 M3-4、Problem 3 の表 P3-3）で、冷却材はホウ酸水（ADR-0106）。
library = "../../vera.msgpack"
few-group = { output = "lattice/26-fuel.msgpack", bounds = [1e7, 0.625, 1e-5], pins = true }
medium = "media/26-fuel.msgpack"
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 gt    pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 gt    pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 it    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 gt    pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 gt    pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 gt    pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
  "pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26 pin26",
]

[material.fuel26]
temperature = 565
nuclides = { U-234 = 5.09503e-06, U-235 = 6.06709e-04, U-236 = 2.76809e-06, U-238 = 2.22663e-02, O-16 = 4.57617e-02 }

[material.zircaloy]
temperature = 565

[material.zircaloy.nuclides]
Cr-50 = 3.30121e-06
Cr-52 = 6.36606e-05
Cr-53 = 7.21860e-06
Cr-54 = 1.79686e-06
Fe-54 = 8.68307e-06
Fe-56 = 1.36306e-04
Fe-57 = 3.14789e-06
Fe-58 = 4.18926e-07
Zr-90 = 2.18865e-02
Zr-91 = 4.77292e-03
Zr-92 = 7.29551e-03
Zr-94 = 7.39335e-03
Zr-96 = 1.19110e-03
Sn-112 = 4.68066e-06
