[material.water]
temperature = 565
water = { density = 0.743, boron = 1100, b10 = 0.199 }

[branches]
boron = { ppm = [1100, 1400], materials = ["water"] }
moderator = { temperature = [565], density = [0.743], materials = ["zircaloy", "water"] }
fuel = { temperature = [565], materials = ["fuel26"] }

[cell.pin26]
zones = [
  { material = "fuel26", radius = 0.4096, rings = 5 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8
# 案内管（中は減速材）
[cell.gt]
zones = [
  { material = "water", radius = 0.561, rings = 3 },
  { material = "zircaloy", radius = 0.602, rings = 1 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
