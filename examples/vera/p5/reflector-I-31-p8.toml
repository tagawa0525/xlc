# このファイルは p5_inputs.py が書く。手で直さない。
# 径方向の反射体の I 型の格子（ADR-0095）: VERA Problem 5-2D の燃料の集合体の右に反射体を置く。左、上、下は鏡面
# 反射、右は真空（examples/reflector/reflector-I.toml と同じ形）。
# 燃料は濃縮度 3.10%、Pyrex の棒 8 本（図 5 の配置）。燃料のノードの定数を、外周のこの種類の位置に置く（ADR-0153）。
# 反射体は燃料側から、集合体の外周からの隙間の水 0.19 cm、SS304 のバッフル 2.85 cm、水 18.46 cm（仕様書の 1.13 節の
# 表 16。集合体のピッチ 21.50 cm の幅）。ノードごとの形状関数と角の不連続因子を付ける（ADR-0131）。
library = "../vera.msgpack"
pitch = 1.26
azimuthal = 30
spacing = 0.03
boundary = { right = "vacuum" }
few-group = { bounds = [1e7, 0.625, 1e-5], nodes = [
  { output = "lattice/reflector-I-31-p8-fuel.msgpack", columns = [1, 19], rows = [1, 19] },
  { output = "lattice/reflector-I-31-p8.msgpack", columns = [20, 47], rows = [1, 19], reflector = true },
], pins = true }
widths = [
  { size = 0.04 },
  { size = 1.26, count = 17 },
  { size = 0.04 },
  { size = 0.19 },
  { size = 2.85 },
  { size = 0.71, count = 26 },
]
heights = [
  { size = 0.04 },
  { size = 1.26, count = 17 },
  { size = 0.04 },
]
rows = [
  "w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     ss    w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w",
  "w     pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 pin31 w     w     ss    w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w",
