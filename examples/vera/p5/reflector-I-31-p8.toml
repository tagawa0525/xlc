  "w     pin31 pin31 pin31 pin31 pin31 gt    pin31 pin31 gt    pin31 pin31 gt    pin31 pin31 pin31 pin31 pin31 w     w     ss    w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w     w",
