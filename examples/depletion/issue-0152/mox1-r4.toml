# #0152 の切り分け: mox1-r1.toml の燃料を、1C の 4 リング（../lattice-1C-rings4.toml）と同じく等しい面積の 4 つの物質
# （各 2 つの MOC のリング）に分けたもの。燃料の MOC のリングは 5 から 8 になり、飛程の表を使わない（track-table = false）。
# 組成、温度、ほかの領域の形状は mox1-r1.toml と同じ（1C の 1 リングと 4 リングの入力の違いと同じ）
library = "../depletion.msgpack"
# 燃料のリングの物質が 4 つあると、飛程の表（ADR-0156）は物質ごとの軸の直積で格子点より大きくなるので、格子点ごとに求める
track-table = false
pitch = 1.26
azimuthal = 64
spacing = 0.02
rows = ["pin"]

[material.fuel-0]
temperature = 900
nuclides = { U-235 = 5.1050e-05, U-238 = 2.0370e-02, Pu-238 = 4.6690e-05, Pu-239 = 1.4650e-03, Pu-240 = 5.6910e-04, Pu-241 = 2.7130e-04, Pu-242 = 1.4130e-04, Am-241 = 3.0280e-05, O-16 = 4.5880e-02 }

