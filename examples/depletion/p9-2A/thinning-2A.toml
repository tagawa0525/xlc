# 本番の形の 2A のテーブル（table-2A-all-burnups.msgpack。ADR-0200 の 2 軸の組の部分格子の 114 状態を、ADR-0199 の 27 燃焼点のすべてで
# 解いたもの。#0278）から、ブランチ条件を解く燃焼点を間引く誤差を、状態の種類ごとに測る（compare_branch_cross_terms.py の入力。#0176）。
# 比べる真値はすべての燃焼点で解いた状態なので、`off-nominal-burnup` を書いた後の `branch-2A` の出力（table-2A.msgpack）ではなく、
# 書く前の出力を `dvc add` で残したコピーを読む（dvc.yaml の `thinning-2A`）
# 誤差は、除いた燃焼点で、基準条件との差を選んだ燃焼点から内挿した値を、解いた値と比べたもの。

[[thinning]]
name = "2A（本番の形）"
file = "table-2A-all-burnups.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }
# 10 点は ADR-0200 の「ブランチ計算を行う燃焼点」の表の点（見積もりの仮定）。8 点も同じ表の点。ほかは点の数による誤差の変わり方を見る
# 候補で、どれも Xe と Sm の平衡の前後（0.1、0.5 MWd/kg）を含む（ADR-0200）。15 点は本番の入力（branch-2A.toml の
# `off-nominal-burnup`）の点で、14 点に 0.25 を足したもの（14 点は Pu-240 の数密度の微分が 0.25 で約 18% ずれる。#0176）
selections = [
  { name = "6 点", burnup = [0, 0.1, 0.5, 6, 20, 60] },
  { name = "8 点", burnup = [0, 0.1, 0.5, 2, 10, 20, 40, 60] },
  { name = "10 点", burnup = [0, 0.1, 0.5, 2, 6, 10, 20, 32, 48, 60] },
  { name = "12 点", burnup = [0, 0.1, 0.5, 1, 2, 4, 8, 14, 24, 36, 48, 60] },
  { name = "14 点", burnup = [0, 0.1, 0.5, 1, 2, 4, 6, 10, 16, 24, 32, 40, 48, 60] },
  { name = "15 点", burnup = [0, 0.1, 0.25, 0.5, 1, 2, 4, 6, 10, 16, 24, 32, 40, 48, 60] },
  { name = "20 点", burnup = [0, 0.1, 0.25, 0.5, 1, 2, 4, 6, 8, 10, 12, 16, 20, 24, 28, 32, 36, 40, 48, 60] },
]

# 時間の見込みの、本番の形の 1 燃焼点（2A の 60 MWd/kg、今の既定の求積 6 点、Slurm 874、timed。#0285 の「本番の形の 1 燃焼点の
# テーブルの時間（2A の 60 MWd/kg）」）の値。燃焼点ごとの違いは測っていない（燃焼度 0 は Pu-240 の微分を解かないので短い）
[thinning.timing]
total = 2349.0      # 全体（ログの `branches` の `total_seconds`）
solve = 36.1        # 自己遮蔽を解く 1 状態: UFG の自己遮蔽 27.6 秒と、その外の 8.4〜8.6 秒の中ほど
reuse = 8.7         # ホウ素を変えて自己遮蔽を再利用する 1 状態（ADR-0201）
reuse-axis = "boron"

# 状態の種類ごとに、Hermite（core の内挿）の誤差が目安（|Δρ| ≤ 5 pcm。ADR-0200）に入るいちばん少ない候補を選んだ組
[[thinning.plans]]
name = "種類ごと"
kinds = { boron = "8 点", moderator = "14 点", fuel = "10 点", "boron+moderator" = "14 点", "boron+fuel" = "10 点", "moderator+fuel" = "14 点" }
