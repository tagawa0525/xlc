# Gd 燃料の集合体 2O の直積のテーブル（branch-2O.toml。ADR-0239 の格子点の各軸の両端と公称の点の 3 × 3 × 3 を、27 燃焼点のすべてで
# 解いたもの）で、3 つ同時の項を落とす誤差（ADR-0200 の案 H）と、公称でない状態を解く燃焼点を間引く誤差（ADR-0200 の案 B2）を測る
# （compare_branch_cross_terms.py の入力。#0176）。公称の状態は ADR-0239 の案 N2。比べ方は ../p9-product/compare-2A.toml と
# ../p9-2A/thinning-2A.toml と同じ。

[[table]]
name = "2O（各軸の両端）"
file = "table-2O.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }

[[model]]
name = "1 軸ずつ"
keep = []

[[model]]
name = "B×M、B×F"
keep = [["boron", "moderator"], ["boron", "fuel"]]

[[model]]
name = "B×M、M×F"
keep = [["boron", "moderator"], ["moderator", "fuel"]]

[[model]]
name = "B×F、M×F"
keep = [["boron", "fuel"], ["moderator", "fuel"]]

# ADR-0200 の既定。直積との差は 3 つ同時の項だけ
[[model]]
name = "2 軸の組すべて"
keep = [["boron", "moderator"], ["boron", "fuel"], ["moderator", "fuel"]]

# 誤差は、除いた燃焼点で、公称の状態との差を選んだ燃焼点から内挿した値を、解いた値と比べたもの。選び方の最初の 7 つは
# ../p9-2A/thinning-2A.toml と同じ点（2A の本番の入力は 15 点）。残りの 3 つは、15 点に Gd の燃え尽きの付近（公称の状態の k∞ の山は
# 8.5 MWd/kg。lattice-2O.out）の点を足した候補で、19 点は手元で足す点を変えて試した中で目安に入るいちばん少ない点（#0176）
[[thinning]]
name = "2O（各軸の両端）"
file = "table-2O.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }
selections = [
  { name = "6 点", burnup = [0, 0.1, 0.5, 6, 20, 60] },
  { name = "8 点", burnup = [0, 0.1, 0.5, 2, 10, 20, 40, 60] },
  { name = "10 点", burnup = [0, 0.1, 0.5, 2, 6, 10, 20, 32, 48, 60] },
  { name = "12 点", burnup = [0, 0.1, 0.5, 1, 2, 4, 8, 14, 24, 36, 48, 60] },
  { name = "14 点", burnup = [0, 0.1, 0.5, 1, 2, 4, 6, 10, 16, 24, 32, 40, 48, 60] },
  { name = "15 点", burnup = [0, 0.1, 0.25, 0.5, 1, 2, 4, 6, 10, 16, 24, 32, 40, 48, 60] },
  { name = "20 点", burnup = [0, 0.1, 0.25, 0.5, 1, 2, 4, 6, 8, 10, 12, 16, 20, 24, 28, 32, 36, 40, 48, 60] },
  { name = "17 点（15 点 + 8、12）", burnup = [0, 0.1, 0.25, 0.5, 1, 2, 4, 6, 8, 10, 12, 16, 24, 32, 40, 48, 60] },
  { name = "19 点（15 点 + 7、8、9、12）", burnup = [0, 0.1, 0.25, 0.5, 1, 2, 4, 6, 7, 8, 9, 10, 12, 16, 24, 32, 40, 48, 60] },
  { name = "21 点（15 点 + 5、7、8、9、11、12）", burnup = [0, 0.1, 0.25, 0.5, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12, 16, 24, 32, 40, 48, 60] },
]

# 時間の見込みは、本番の形の 2O のテーブル（../p9-2A/branch-2A.toml と同じ 2 軸の組の部分格子の 114 状態。状態の種類ごとの数は
# `states`、3 つの軸を変えた状態は解かないので 0）を、公称の状態は 27 燃焼点のすべてで、公称でない状態は選び方の燃焼点で解く
# 見込み。1 状態の秒は fuel-2O.toml の 60 MWd/kg の状態の平均（Slurm 930、timed。fuel-2O.log の状態ごとの `seconds`）: 自己遮蔽を
# 解く 7 状態の 36.6 秒、ホウ素を変えて自己遮蔽を再利用する 14 状態の 8.0 秒（ADR-0201）。状態によらない秒は、同じログの全体
# （`branches` の `total_seconds`）から状態の秒の和を引いて燃焼点の数で割った 3.1 秒
[thinning.timing]
other = 3.1
solve = 36.6
reuse = 8.0
reuse-axis = "boron"
states = { boron = 5, moderator = 6, fuel = 6, "boron+moderator" = 30, "boron+fuel" = 30, "moderator+fuel" = 36 }
