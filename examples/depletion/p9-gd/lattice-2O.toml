# Problem 9 のブランチのテーブルの解く状態と燃焼点を減らす案（ADR-0200 の案 B2 と案 H、ADR-0242 の案 F3）を Gd 燃料の集合体で確かめる、
# 2O の燃焼の履歴（#0176）。VERA Problem 2 の 2O（3.1% の燃料に、1.8% 濃縮で 5% Gd2O3 の Gd 燃料 12 本。../p2/lattice-2O.toml と同じ
# 形状、Gd の組成と Gd のピンの 8 リング、出力密度）を、ADR-0239 の基準条件（案 N2。ホウ素 650 ppm、減速材 580 K、燃料 900 K）で
# 燃焼させる。減速材、被覆管、燃料のピンの 5 つの物質 fuel-0〜fuel-4（ADR-0245）は ../p9-product/lattice-2A.toml と同じ（手でコピーした）。
# Gd のピンは p2 と同じくリングごとに別の物質 gd0〜gd7 で、燃料の温度は 900 K（Gd 燃料に ADR-0245 の分け方を当てるかは #0277 で決める）。
# 燃焼度の点は ../p2/lattice-2O.toml の 70 点（Gd の燃え尽きの 4〜16 MWd/kg を 0.5 刻み）に、ブランチのテーブルの ADR-0199 の 27 点にある
# 0.25 と 0.75 を足したもの。分岐は branch-2O.toml と fuel-2O.toml。
library = "../p2/depletion.msgpack"
ufg-tolerance = 1e-4
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
