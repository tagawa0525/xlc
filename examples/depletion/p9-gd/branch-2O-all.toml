# Gd 燃料の集合体 2O のブランチのテーブルの燃焼点を決める真値のテーブル（#0176）。燃焼の履歴（lattice-2O.msgpack）の 72 点と燃焼度 0 の
# 73 点のすべてで、基準条件（ADR-0239 の案 N2）と、各軸の公称の点と片側の端の点（ホウ素 650、1625 ppm × 減速材 580、615 K ×
# 燃料 900、1350 K）の直積の 8 状態を解く。片側の端は、2O の 27 燃焼点の直積のテーブル（branch-2O.toml）の間引きで、Hermite の
# 状態の種類ごとの最大がどの選び方でもそこにあった側（examples/depletion/verification.md の「Problem 9 のブランチ条件と燃焼点を減らす案の
# Gd 燃料の集合体（2O）での確認」の `--report`）。直積なので、状態の種類（B、M、F、B、M、B、F、M、F、B、M、F）ごとに 1 状態を持つ。
# 基準条件の燃焼度の内挿の誤差（ADR-0199 の 27 点から）と、ブランチ条件を解く燃焼点の間引きの誤差を、この 73 点を真値にして
# 測る（compare-2O-all.toml）。格子、離散化、組成、物質の状態、微視的断面積と数密度の微分の核種は branch-2O.toml と同じ。
library = "../p2/depletion.msgpack"
ufg-tolerance = 1e-4
few-group = { output = "table-2O-all.msgpack", bounds = [1e7, 0.625, 1e-5] }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

