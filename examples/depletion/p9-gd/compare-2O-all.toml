  { name = "35 点（33 点 + 0.2、50）", burnup = [0, 0.1, 0.2, 0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 50, 56, 60] },
