# 時間の見込みは、本番の形の 2O のテーブル（../p9-2A/branch-2A.toml と同じ 2 軸の組の部分格子の 78 状態。燃料の温度は 4 点
# （ADR-0239）。状態の種類ごとの数は `states`、3 つの軸を変えた状態は解かないので 0）を、公称の状態は 27 燃焼点のすべてで、公称でない状態は選び方の燃焼点で解く
# 見込み。1 状態の秒は fuel-2O.toml の 60 MWd/kg の状態の平均（Slurm 930、timed。fuel-2O.log の状態ごとの `seconds`）: 自己遮蔽を
# 解く 7 状態の 36.6 秒、ホウ素を変えて自己遮蔽を再利用する 14 状態の 8.0 秒（ADR-0201）。2A の見込み（../p9-2A/thinning-2A.toml）と
# 同じく、いちばん遅い 60 MWd/kg の秒をすべての燃焼点に当てるので、見込みは長い側（自己遮蔽を解く状態は 0 MWd/kg で 19.9 秒、
# 4〜16 MWd/kg で 31.6〜33.5 秒）。状態によらない秒は、同じログの全体
# （`branches` の `total_seconds`）から状態の秒の和を引いて燃焼点の数で割った 3.1 秒
[thinning.timing]
# 本番の形のテーブルの公称の状態は ADR-0199 の 27 燃焼点で解く（このテーブルの 73 点でなく）
nominal-burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60]
other = 3.1
solve = 36.6
reuse = 8.0
reuse-axis = "boron"
states = { boron = 5, moderator = 6, fuel = 3, "boron+moderator" = 30, "boron+fuel" = 15, "moderator+fuel" = 18, "boron+moderator+fuel" = 0 }

# 公称の状態と公称でない状態の燃焼点の組（`[[combined]]`）: 本番のテーブルは公称の状態も内挿するので、公称の状態を組の公称の点から、
# 公称でない状態の公称の状態との差を組の公称でない点から内挿して足し（core の組み立て。ADR-0200）、公称でない点から除いた点で、
# 73 点のテーブルのすべての状態と比べる。27、30、33、19、15 点は上の `[[nominal]]` と `[[thinning]]` の同じ点の選び方。34 点と 35 点は、
# 33 点 / 19 点が 2O か 2P で 5 pcm（ADR-0200 の目安）を超えたので、33 点 / 19 点に、2O と 2P の大きい方の最大を下げるように 73 点の
# 点を 1 点ずつ公称の点に足した候補。時間の見込みは上の `[thinning.timing]` と同じ本番の形の 78 状態で、公称の状態と状態によらない分は
# 組の公称の点で、公称でない状態は組の公称でない点で数える
[[combined]]
name = "2O（73 点）"
file = "table-2O-all.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }
selections = [
  { name = "27 点", burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60] },
