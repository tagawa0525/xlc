# Gd 燃料の集合体 2O の、履歴の 72 点と燃焼度 0 の 73 点のすべてで解いたテーブル（branch-2O-all.toml。公称の状態と、各軸の
# 公称の点と片側の端の点の直積の 8 状態）を真値にして、分岐のテーブルの燃焼点を決める誤差を測る（compare_branch_cross_terms.py の
# 入力。#0176）。公称の状態は ADR-0239 の案 N2。

# 3 つ同時の項を落とす誤差（`[[table]]` と `[[model]]`）: 8 状態の直積なので、3 つの軸を変えた状態は 1 つ（2O の 27 燃焼点の直積で、
# どの燃焼点でも最大だった格子の角。compare-2O.toml）。その状態の 73 点の誤差
[[table]]
name = "2O（73 点、片側の端）"
file = "table-2O-all.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }

[[model]]
name = "1 軸ずつ"
keep = []

[[model]]
name = "B×M、B×F"
keep = [["boron", "moderator"], ["boron", "fuel"]]

[[model]]
name = "B×M、M×F"
keep = [["boron", "moderator"], ["moderator", "fuel"]]

[[model]]
name = "B×F、M×F"
keep = [["boron", "fuel"], ["moderator", "fuel"]]

# ADR-0200 の既定。直積との差は 3 つ同時の項だけ
[[model]]
name = "2 軸の組すべて"
keep = [["boron", "moderator"], ["boron", "fuel"], ["moderator", "fuel"]]


# 公称の状態の燃焼点（`[[nominal]]`）: 選んだ点の公称の状態を燃焼度について内挿し、除いた点で比べる。最初が ADR-0199 の 27 点で、
# 残りは Gd の燃え尽きの付近（公称の状態の k∞ の山の付近）と、2A と 2F の 27 点の最大の 1.5 MWd/kg（ADR-0199）に点を足した候補。
# 30 点、32 点、33 点は、27 点に 73 点の点を足して 2O と 2P の大きい方の最大を下げるように選んだ組。30 点は 2O と 2P の
# 両方で燃焼度の内挿の目標（±10 pcm。ADR-0192）に入り、33 点は分岐の組み立ての目安（|Δρ| ≤ 5 pcm。ADR-0200）にも入る。
# 32 点は 33 点から 5.5 を除いた組
[[nominal]]
name = "2O（73 点）"
file = "table-2O-all.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }
selections = [
  { name = "27 点（ADR-0199）", burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60] },
  { name = "28 点（27 点 + 8.5）", burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 2, 4, 5, 6, 7, 8, 8.5, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60] },
