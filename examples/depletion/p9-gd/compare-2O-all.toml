# 時間の見込みは、本番の形の 2O のテーブル（../p9-2A/branch-2A.toml と同じ 2 軸の組の部分格子の 114 状態。状態の種類ごとの数は
# `states`、3 つの軸を変えた状態は解かないので 0）を、公称の状態は 27 燃焼点のすべてで、公称でない状態は選び方の燃焼点で解く
# 見込み。1 状態の秒は fuel-2O.toml の 60 MWd/kg の状態の平均（Slurm 930、timed。fuel-2O.log の状態ごとの `seconds`）: 自己遮蔽を
# 解く 7 状態の 36.6 秒、ホウ素を変えて自己遮蔽を再利用する 14 状態の 8.0 秒（ADR-0201）。2A の見込み（../p9-2A/thinning-2A.toml）と
# 同じく、いちばん遅い 60 MWd/kg の秒をすべての燃焼点に当てるので、見込みは長い側（自己遮蔽を解く状態は 0 MWd/kg で 19.9 秒、
# 4〜16 MWd/kg で 31.6〜33.5 秒）。状態によらない秒は、同じログの全体
# （`branches` の `total_seconds`）から状態の秒の和を引いて燃焼点の数で割った 3.1 秒
[thinning.timing]
# 本番の形のテーブルの公称の状態は ADR-0199 の 27 燃焼点で解く（このテーブルの 73 点でなく）
nominal-burnups = 27
other = 3.1
solve = 36.6
reuse = 8.0
reuse-axis = "boron"
states = { boron = 5, moderator = 6, fuel = 6, "boron+moderator" = 30, "boron+fuel" = 30, "moderator+fuel" = 36, "boron+moderator+fuel" = 0 }
