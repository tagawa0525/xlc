# 公称でない状態を解く燃焼点の間引き（`[[thinning]]`。公称の状態は 73 点のすべての値を使う）: 選び方は compare-2O.toml と同じ点に、
# ADR-0199 の 27 点を足したもの。誤差は、除いた燃焼点で、公称の状態との差を選んだ燃焼点から内挿した値を、解いた値と比べたもの
