  { name = "31 点（27 点 + 1.5、6.5、7.5、8.5）", burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 1.5, 2, 4, 5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60] },
  { name = "35 点（27 点 + 4.5〜11.5 の 1 おき）", burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 2, 4, 4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60] },
  { name = "36 点（35 点 + 1.5）", burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 1.5, 2, 4, 4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60] },
  { name = "30 点（27 点 + 1.5、6.5、8.5）", burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 1.5, 2, 4, 5, 6, 6.5, 7, 8, 8.5, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60] },
