# Gd 燃料の集合体 2P の、履歴の 72 点と燃焼度 0 の 73 点のすべてで解いたテーブル（branch-2P-all.toml。公称の状態と、各軸の
# 公称の点と片側の端の点の直積の 8 状態）を真値にして、分岐のテーブルの燃焼点を決める誤差を測る（compare_branch_cross_terms.py の
# 入力。#0176）。公称の状態は ADR-0239 の案 N2。

# 3 つ同時の項を落とす誤差（`[[table]]` と `[[model]]`。ADR-0200 の案 H）: branch-2P.toml（各軸の両端と公称の点の直積の 27 状態を
# 4 燃焼点で解いたもの）と、73 点のテーブルの格子の角（2O の 27 燃焼点の直積で、どの燃焼点でも最大だった状態）
[[table]]
name = "2P（各軸の両端）"
file = "table-2P.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }

[[table]]
name = "2P（73 点、片側の端）"
file = "table-2P-all.msgpack"
nominal = { boron = 650, moderator = 580, fuel = 900 }

[[model]]
name = "1 軸ずつ"
keep = []

[[model]]
name = "B×M、B×F"
keep = [["boron", "moderator"], ["boron", "fuel"]]

[[model]]
name = "B×M、M×F"
keep = [["boron", "moderator"], ["moderator", "fuel"]]

[[model]]
name = "B×F、M×F"
keep = [["boron", "fuel"], ["moderator", "fuel"]]

# ADR-0200 の既定。直積との差は 3 つ同時の項だけ
[[model]]
name = "2 軸の組すべて"
keep = [["boron", "moderator"], ["boron", "fuel"], ["moderator", "fuel"]]


