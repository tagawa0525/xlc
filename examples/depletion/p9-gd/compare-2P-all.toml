# 時間の見込みは、本番の形の 2P のテーブル（../p9-2A/branch-2A.toml と同じ 2 軸の組の部分格子の 78 状態。燃料の温度は 4 点
# （ADR-0239）。状態の種類ごとの数は `states`、3 つの軸を変えた状態は解かないので 0）を、公称の状態は `nominal-burnup` の燃焼点の
# すべてで、公称でない状態は選び方の燃焼点で解く見込み。1 状態の秒は fuel-2P.toml の 60 MWd/kg の状態の平均（Slurm 937、timed。
# fuel-2P.log の状態ごとの `seconds`）: 自己遮蔽を解く 7 状態の 37.4 秒、ホウ素を変えて自己遮蔽を再利用する 14 状態の 7.8 秒
# （ADR-0201）。compare-2O-all.toml と同じく、いちばん遅い 60 MWd/kg の秒をすべての燃焼点に当てるので、見込みは長い側（自己遮蔽を
# 解く状態は 0 MWd/kg で 19.8 秒、4〜16 MWd/kg で 33.1〜34.2 秒）。状態によらない秒は、同じログの全体（`branches` の
# `total_seconds`）から状態の秒の和を引いて燃焼点の数で割った 3.2 秒
[thinning.timing]
# 本番の形のテーブルの公称の状態は ADR-0199 の 27 燃焼点で解く（このテーブルの 73 点でなく）
nominal-burnup = [0, 0.1, 0.25, 0.5, 0.75, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12, 14, 16, 20, 24, 28, 32, 36, 40, 48, 56, 60]
other = 3.2
solve = 37.4
reuse = 7.8
reuse-axis = "boron"
states = { boron = 5, moderator = 6, fuel = 3, "boron+moderator" = 30, "boron+fuel" = 15, "moderator+fuel" = 18, "boron+moderator+fuel" = 0 }
