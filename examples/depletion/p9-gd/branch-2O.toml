# 燃料のピン（3.1%）。燃料の 5 つのゾーンは半径 0.4096 √(k/5) で、元の 1 つのゾーンの 5 リングと同じ MOC の領域（ADR-0245）
[cell.pin]
zones = [
  { material = "fuel-0", radius = 0.18317868871678278, rings = 1 },
  { material = "fuel-1", radius = 0.25905378592099365, rings = 1 },
  { material = "fuel-2", radius = 0.3172747957213116, rings = 1 },
  { material = "fuel-3", radius = 0.36635737743356556, rings = 1 },
  { material = "fuel-4", radius = 0.4096, rings = 1 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

# Gd 燃料のピン（リングごとに別の物質。ギャップは真空）
[cell.gd]
zones = [
  { material = "gd0", radius = 0.1448154688, rings = 1 },
  { material = "gd1", radius = 0.2048, rings = 1 },
  { material = "gd2", radius = 0.2508277497, rings = 1 },
  { material = "gd3", radius = 0.2896309376, rings = 1 },
  { material = "gd4", radius = 0.3238172324, rings = 1 },
  { material = "gd5", radius = 0.3547240054, rings = 1 },
  { material = "gd6", radius = 0.3831457164, rings = 1 },
  { material = "gd7", radius = 0.4096, rings = 1 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

# 案内管（中は減速材）
[cell.gt]
zones = [
  { material = "water", radius = 0.561, rings = 3 },
  { material = "zircaloy", radius = 0.602, rings = 1 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

# 計装管（中は減速材）
[cell.it]
zones = [
  { material = "water", radius = 0.559, rings = 3 },
  { material = "zircaloy", radius = 0.605, rings = 1 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

[branches]
boron = { ppm = [0, 650, 1625], materials = ["water"] }
# 密度は IF97 の 15.5132 MPa の値を小数 6 桁に丸めたもの（ADR-0239）。../p9-2A/branch-2A.toml の 7 点のうち両端と基準点
moderator = { temperature = [560, 580, 615], density = [0.752074, 0.711901, 0.608215], materials = ["water", "zircaloy"] }
# 燃料の温度は、燃料のピンの 5 つの物質（ADR-0245）と Gd のピンの 8 つの物質のすべてに当てる
fuel = { temperature = [560, 900, 1350], materials = ["fuel-0", "fuel-1", "fuel-2", "fuel-3", "fuel-4", "gd0", "gd1", "gd2", "gd3", "gd4", "gd5", "gd6", "gd7"] }
# 3 つ同時の項を落とす誤差を測る真値なので、直積で解く（燃焼度の軸を持つブランチ計算の既定は 2 軸の組の部分格子。ADR-0200）
subgrids = [["boron", "moderator", "fuel"]]

[history]
file = "lattice-2O.msgpack"
chain = "../chain.msgpack"
# ADR-0199 の 27 点（../p9-2A/branch-2A.toml の `burnup`）。間引きの真値なので、ブランチ条件もすべての点で解く
burnup = [
  0, 0.1, 0.25, 0.5, 0.75, 1, 2, 4, 5, 6,
  7, 8, 9, 10, 11, 12, 14, 16, 20, 24,
  28, 32, 36, 40, 48, 56, 60,
]
# ADR-0035 の元素の輸送する核種 26 と、その輸送する先行核 5（ADR-0216）。../p9-2A/branch-2A.toml と同じ
micro = [
  "U-234", "U-235", "U-236", "U-238", "Np-237", "Np-239", "Pu-238", "Pu-239", "Pu-240", "Pu-241", "Pu-242",
  "Am-241", "Am-243", "Xe-135", "Sm-147", "Sm-149", "Sm-150", "Sm-151", "Sm-152",
  "Gd-152", "Gd-154", "Gd-155", "Gd-156", "Gd-157", "Gd-158", "Gd-160",
  "Cm-242", "Cm-244", "Eu-153", "I-135", "Pm-148m",
]
# 線形の補正の係数を σᵢ から数密度の微分にする核種（ADR-0221）
derivative = ["Pu-240"]
