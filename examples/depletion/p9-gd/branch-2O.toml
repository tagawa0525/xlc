# Gd 燃料の集合体 2O の、ブランチ条件を解く燃焼点の間引き（ADR-0200 の案 B2）と、3 つ同時の項を落とす誤差（ADR-0200 の案 H。
# 2 軸の組の部分格子）を測る直積のテーブル（#0176）。ADR-0239 の格子点の各軸の両端と基準点（ホウ素 0、650、1625 ppm × 減速材 560、
# 580、615 K × 燃料 560、900、1350 K）の直積の 27 状態を、ADR-0199 の 27 燃焼点のすべてで解く。2A の本番の形のテーブル
# （../p9-2A/branch-2A.toml）の間引きで最大だった状態は、どの種類も軸の端の格子点にある（examples/depletion/verification.md の「Problem 9 の
# 本番の形の 2A のテーブルの燃焼点の間引き」）。燃焼の履歴は lattice-2O.msgpack（基準条件での 2O の燃焼）。格子、離散化、組成、物質の
# 状態は lattice-2O.toml と同じで、入力の物質の状態が基準条件。軸の格子点の値、微視的断面積と数密度の微分の核種は
# ../p9-2A/branch-2A.toml と同じ。比べ方は compare-2O.toml。
library = "../p2/depletion.msgpack"
ufg-tolerance = 1e-4
few-group = { output = "table-2O.msgpack", bounds = [1e7, 0.625, 1e-5] }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

