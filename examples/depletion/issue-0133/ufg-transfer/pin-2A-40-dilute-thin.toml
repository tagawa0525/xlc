# ADR-0208 の測定: ../ufg-sab/pin-2A-40-sab-fast3.toml（S(α,β) の速い方法、無限希釈の移行）の UFG の格子を、許容差 1e-4 で間引いたもの（ADR-0185。集合体の燃焼の入力の値）。
# #0133 の試行: VERA 1C のピンセル（../../../vera/p1/pincell-1C.toml と同じ形状、温度、離散化。燃料は 1 リング）に、OpenMC の 2A の燃焼の 40 MWd/kg（39 の組の体積の平均。1C で輸送する核種のうち 2A の結果にあるもの）
