# 格子計算の燃焼の検証（ADR-0178）: VERA Problem 2 の 履歴を変えた燃焼 2: 2A の案内管 24 本すべてに AIC の制御棒を入れたまま燃焼させる（2G と同じ配置。制御棒は燃焼しない）を、分岐なしの 1 つの状態で、
# 40 点（最後は 60 MWd/kg）まで燃焼させる。OpenMC の参照解は openmc-2A-rods.toml。
# 出力密度 38.41 W/g は VERA Problem 9 のサイクル 1 の平均（16.939 GWd/MT / 441 EFPD）。形状、組成と燃焼度の点は
# OpenMC の入力と同じ表（openmc_depletion_assembly.py）から p2_inputs.py が書く。手で直さない。集合体の周りに水のギャップ 0.04 cm。
# 燃焼させる物質は fuel（対称操作の組ごとに 1 つの領域。ADR-0173）。
library = "depletion.msgpack"
ufg-tolerance = 1e-4
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin cr  pin pin cr  pin pin cr  pin pin pin pin pin",
  "pin pin pin cr  pin pin pin pin pin pin pin pin pin cr  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin cr  pin pin cr  pin pin it  pin pin cr  pin pin cr  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin cr  pin pin pin pin pin pin pin pin pin cr  pin pin pin",
  "pin pin pin pin pin cr  pin pin cr  pin pin cr  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

[material.fuel]
temperature = 565
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

