# 放射化の核種（activation = true。ADR-0238）: チェーン（../chain.msgpack）が中性子の反応か核分裂を持つ核種のうち、上の輸送する核種
# でない 465 核種（チェーンの順）のうち、xs が処理できない 10 核種を除いた 455 核種。冷却計算の 1 群の微視的断面積のために、チェーンの反応と核分裂の無限希釈の断面積だけを作り、輸送しない。
# 温度は燃料の核種と同じ 565, 600 K。上で外した Pm-147、Pm-148、Pm-149、Am-242m、Eu-151（#0127）は自己遮蔽の表を作らないので、ここに入る。
# 核種ごとの表の見出し（[nuclide.X]）でなく、[nuclide] のインラインの表で書く: DVC（tomlkit 0.15）は見出しの数の 2 乗で読む時間が
# 延び、555 の見出しで 1 回 9 秒、DVC の 1 つの操作で 11 回読む（#0268）
# 除いた 10 核種（#0264）: Cl-35 と Ca-40 は分離共鳴（R 行列の制限形）の荷電粒子の対を xs が扱わない。Tm-169、W-182〜186、Pt-193、
# Pb-207 は、MF8 が挙げた生成物の状態の経路の和が、チェーンの反応（MT16、103、107）の断面積を xs の許容より超える群がある（2026-11-07 に
# 手元で 465 核種を処理して出たエラー）
[nuclide]
