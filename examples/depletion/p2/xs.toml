# 格子計算の燃焼の検証（VERA Problem 2 の集合体。docs/plans/m4-depletion.md の「進め方」5、ADR-0178）の多群ライブラリ
# （ENDF/B-VIII.0、WIMS 69群。ADR-0169）。ピンセルの検証のライブラリ（../xs.toml）と別にするのは、核種を足すと
# ピンセルの輸送する核種（鎖の核種のうちライブラリにあるもの。ADR-0173）が変わり、ピンセルの比較が古くなるため。
# 核種と評価は ../xs.toml と同じで、次を足し、温度を変えた: 燃料の核種、鎖の核種、O-16、Zr、Sn は 565, 600 K（集合体の問題の温度。
# 900, 1200 K は ピンセルだけ）。足した核種は、Pyrex と SS304 の Si, P, Mn, Ni, C（天然の C は C-12 と C-13 に分ける。ADR-0079）、
# WABA の C と Al、Gd 燃料の Gd（Gd-155 は鎖の核種として既にある）、AIC の Ag-107, Cd, In。評価と温度は examples/vera/xs.toml
# と同じ（560, 570 K は足さない。分岐のテーブルを作らない）。冷却材の H は S(α,β) の 550, 573.6, 600 K（565 K は lattice が内挿する。ADR-0080）。
# Pm-147、Pm-148、Pm-149、Am-242m、Eu-151 は非分離共鳴の自己遮蔽が小さい σ0 で NaN になるので外す（#0127。../xs.toml と同じ）
output = "depletion.msgpack"
endf-directory = "../../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
# 省略すると 3（ADR-0076）。核種ごとの段階の params にするため、書いておく（ADR-0138）
scattering-order = 3

[nuclide.U-234]
endf = "n-092_U_234.endf"
temperatures = [565, 600]

[nuclide.U-235]
endf = "n-092_U_235.endf"
temperatures = [565, 600]

[nuclide.U-236]
endf = "n-092_U_236.endf"
temperatures = [565, 600]

[nuclide.U-238]
endf = "n-092_U_238.endf"
temperatures = [565, 600]

[nuclide.O-16]
endf = "n-008_O_016.endf"
temperatures = [565, 600]

[nuclide.H-1]
endf = "n-001_H_001.endf"
temperatures = [550, 573.6, 600]
thermal = "tsl-HinH2O.endf"
# S(α,β) は評価済みデータの上限まで、表の外は THERMR と同じ短時間衝突近似、その上 9118 eV まで自由ガス（ADR-0133）
sab-upper = "evaluated"
sab-outside = "sct"
free-gas-upper = 9118

