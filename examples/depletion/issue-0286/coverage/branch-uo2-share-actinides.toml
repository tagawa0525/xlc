# このファイルは coverage.py が書く（手で直さない）。#0286 の自由ガスの核種の絞り込みの差（ADR-0251）: ケース branch-uo2、変種 share-actinides。燃焼（full）の履歴からの 4 状態の分岐
library = "../../p2/depletion.msgpack"
ufg-free-gas = { share = { threshold = 1e-4, measure = "lethargy", keep-actinides = true } }
ufg-cp-points = 16
few-group = { output = "table-branch-uo2-share-actinides.msgpack", bounds = [1e7, 0.625, 1e-5] }
