# このファイルは coverage.py が書く（手で直さない）。#0286 の自由ガスの核種の絞り込みの差（ADR-0251）: ケース assembly-2M、変種 full。p2/lattice-2M.toml の [40] MWd/kg からの公称の 1 状態の分岐
library = "../../p2/depletion.msgpack"
ufg-free-gas = { share = false }
ufg-cp-points = 16
few-group = { output = "table-assembly-2M-full.msgpack", bounds = [1e7, 0.625, 1e-5] }
ufg-tolerance = 1e-4
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "ib  pin pin pin ib  pin pin ib  pin ib  pin pin ib  pin pin pin ib ",
  "pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin",
  "pin ib  pin ib  ib  gt  ib  ib  gt  ib  ib  gt  ib  ib  pin ib  pin",
  "pin pin ib  gt  ib  ib  pin pin ib  pin pin ib  ib  gt  ib  pin pin",
  "ib  pin ib  ib  pin ib  pin pin ib  pin pin ib  pin ib  ib  pin ib ",
  "pin ib  gt  ib  ib  gt  ib  ib  gt  ib  ib  gt  ib  ib  gt  ib  pin",
  "pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin",
  "ib  pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin ib ",
  "pin ib  gt  ib  ib  gt  ib  ib  it  ib  ib  gt  ib  ib  gt  ib  pin",
  "ib  pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin ib ",
  "pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin",
  "pin ib  gt  ib  ib  gt  ib  ib  gt  ib  ib  gt  ib  ib  gt  ib  pin",
  "ib  pin ib  ib  pin ib  pin pin ib  pin pin ib  pin ib  ib  pin ib ",
  "pin pin ib  gt  ib  ib  pin pin ib  pin pin ib  ib  gt  ib  pin pin",
  "pin ib  pin ib  ib  gt  ib  ib  gt  ib  ib  gt  ib  ib  pin ib  pin",
  "pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin ib  pin pin",
  "ib  pin pin pin ib  pin pin ib  pin ib  pin pin ib  pin pin pin ib ",
]

[material.fuel]
temperature = 600
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

