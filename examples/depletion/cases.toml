# xlc の CRAM（crates/depletion）と OpenMC の CRAM（openmc.deplete.cram）に同じ燃焼行列を与えて比べる入力（ADR-0161）。
# compare_openmc.py が読む。entries は [生まれる核種, 親, 割合 1/s]。同じ位置は足す。数密度は 1/(barn cm)。
#
# pwr-fuel の断面積（1 群、barn）と中性子束は、行列の形と大きさを PWR の燃料に似せた例示の値で、評価済みデータ
# から作ったものではない。半減期は ENDF/B-VIII.0 の decay の丸めた値。

[[case]]
name = "pwr-fuel"
t = 2.592e6 # 30 日
flux = 3e14 # 1/(cm2 s)。sigma の項（barn）に掛ける
nuclides = ["U-235", "U-236", "U-238", "U-239", "Np-239", "Pu-239", "Pu-240", "U-237",
            "I-135", "Xe-135", "Cs-135", "Pm-149", "Sm-149", "other"]
n0 = { "U-235" = 7e-4, "U-238" = 2.2e-2 }
# [親, 生まれる核種, 半減期 s]
decay = [
  ["U-239", "Np-239", 1407.0],
  ["Np-239", "Pu-239", 2.0356e5],
  ["Pu-239", "U-235", 7.6085e11], # α 崩壊で U-235 に戻る（チェーンが環になる）
  ["U-237", "other", 5.832e5],
  ["I-135", "Xe-135", 2.3652e4],
  ["Xe-135", "Cs-135", 3.2904e4],
  ["Cs-135", "other", 7.258e13],
  ["Pm-149", "Sm-149", 1.9109e5],
]
# [親, 生まれる核種, 断面積 barn]
reaction = [
  ["U-235", "U-236", 10.0],
  ["U-236", "other", 6.0],
  ["U-238", "U-239", 0.9],
  ["U-238", "U-237", 0.005], # (n,2n)
  ["Pu-239", "Pu-240", 55.0],
  ["Pu-240", "other", 100.0],
  ["Xe-135", "other", 2.6e6],
  ["Sm-149", "other", 4.0e4],
]
# [核分裂する核種, 断面積 barn, { 生成物 = 収率 }]。収率の和の残り（2 − 和）は other に入れる
fission = [
  ["U-235", 40.0, { "I-135" = 0.0628, "Xe-135" = 0.0026, "Cs-135" = 0.0011, "Pm-149" = 0.0108 }],
  ["U-238", 0.1, { "I-135" = 0.0693, "Xe-135" = 0.0003, "Cs-135" = 0.0001, "Pm-149" = 0.0163 }],
  ["Pu-239", 100.0, { "I-135" = 0.0645, "Xe-135" = 0.0110, "Cs-135" = 0.0067, "Pm-149" = 0.0122 }],
]

# 0 → 1 → 2 → 0 の環。固有値が複素（負の実軸から 30°）になり、次数 16 の誤差が大きい
[[case]]
name = "cycle"
t = 10.0
nuclides = ["a", "b", "c"]
n0 = { "a" = 1.0 }
decay = [["a", "b", 0.6931471805599453], ["b", "c", 0.6931471805599453], ["c", "a", 0.6931471805599453]]

# ‖A t‖ が 1e9 の硬いチェーン
[[case]]
name = "stiff"
t = 1e6
nuclides = ["a", "b", "c"]
n0 = { "a" = 1.0 }
decay = [["a", "b", 6.931471805599453e-4], ["b", "c", 6.931471805599453e5]]

# 乱数で作る 300 核種の行列。列ごとに 1〜3 個の娘（環を含む）、割合は 10^[-12, 2] 1/s で対数一様、
# 5 個の列は 100 個の娘を持つ（核分裂の収率の形）。30 核種に 10^[-6, 0] の初期値
[[case]]
name = "random-300"
t = 1e6
random = { seed = 20261014, n = 300, fissile = 5, yields = 100, initial = 30 }
