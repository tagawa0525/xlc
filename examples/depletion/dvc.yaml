# 燃焼チェーンのステージ: ENDF/B-VIII.0 の decay、nfy、neutrons → xlc の全核種のチェーン（ADR-0164。bin/chain、ADR-0166）と、比べる
# OpenMC のチェーン（Chain.from_endf）。実行するのは default の devShell の `dvc repro`（ADR-0159）。OpenMC を使うステージは cmd を
# references の devShell でラッパー、その devShell の store のパス（references-shell.txt）をツールの deps にする（ADR-0130）。
# チェーンと範囲のステージは ENDF をディレクトリごと deps にする（sha256 で固定した。ADR-0124）。燃焼の検証の多群ライブラリ（ADR-0169）は、
# examples/vera と同じ核種ごとのステージ（範囲 xs-range → 核種ごと xs-nuclide → 組み立て xs。ADR-0138）で作る
# 格子計算の燃焼の検証（ADR-0173）の OpenMC のライブラリ（openmc-library.toml、核種ごとのステージは examples/vera と同じ
# ../vera/openmc_library.py）と、OpenMC と xlc の燃焼、その比較のステージを持つ。MOX のピンセル MOX-1 の燃焼（ADR-0206）も、同じ
# ライブラリとチェーンを使うのでここに置く
vars:
  - xs.toml
  - openmc-library.toml
stages:
  references-shell:
    # ツール（OpenMC とその Python API）の版、パッチ、依存のどれが変わっても store のパスが変わる。評価だけでビルドしない
    cmd: nix eval --raw ../..#devShells.x86_64-linux.references.outPath > references-shell.txt
    always_changed: true
    outs:
      - references-shell.txt:
          cache: false
  chain:
    cmd: ../../bin/chain chain.toml
    deps:
      - ../../toml-values/examples/depletion/chain.toml.json
      - ../../references/endf/ENDF-B-VIII.0_decay
      - ../../references/endf/ENDF-B-VIII.0_nfy
      - ../../references/endf/ENDF-B-VIII.0_neutrons
      - ../../binary-forms/chain.md5
    outs:
      - chain.msgpack
  chain-version:
    # 版ごとの燃焼チェーン（ADR-0262、ADR-0263。本番の版を決める比較、#0303）。VIII.0 は上の chain。入力の endf-* のディレクトリが
    # ENDF の版の decay、nfy、neutrons を指す
    foreach:
      endfb70: ENDF-B-VII.0
      endfb71: ENDF-B-VII.1
      endfb81: ENDF-B-VIII.1
    do:
      cmd: ../../bin/chain ${key}/chain.toml
      deps:
        - ../../toml-values/examples/depletion/${key}/chain.toml.json
        - ../../references/endf/${item}_decay
        - ../../references/endf/${item}_nfy
        - ../../references/endf/${item}_neutrons
        - ../../binary-forms/chain.md5
      outs:
        - ${key}/chain.msgpack
  compare-chain-versions:
    # 隣り合う版のチェーンを値で比べた要約（JSON）と、その文章（#0303）
    foreach:
      70-71:
        a: endfb70/chain.msgpack
        b: endfb71/chain.msgpack
      71-80:
        a: endfb71/chain.msgpack
        b: chain.msgpack
      80-81:
        a: chain.msgpack
        b: endfb81/chain.msgpack
    do:
      cmd: python3 compare_chain_versions.py --json compare-chain-versions-${key}.json ${item.a} ${item.b} > compare-chain-versions-${key}.txt
      deps:
        - ../../python-ast/examples/depletion/compare_chain_versions.py.ast
        - ${item.a}
        - ${item.b}
      outs:
        - compare-chain-versions-${key}.json:
            cache: false
        - compare-chain-versions-${key}.txt:
            cache: false
  read-survey:
    # 版ごとの中性子のファイルの全部を、xs nuclide の読み込みと形式の検査だけ（xs check。ADR-0266）に通した報告。全核種を
    # 輸送する案（#0292）の費用の材料
    foreach:
      endfb70: ENDF-B-VII.0
      endfb71: ENDF-B-VII.1
      endfb80: ENDF-B-VIII.0
      endfb81: ENDF-B-VIII.1
    do:
      cmd: ../../bin/xs check read-survey-${key}.toml ../../references/endf/${item}_neutrons/*.endf
      deps:
        - ../../references/endf/${item}_neutrons
        - ../../binary-forms/xs.md5
      outs:
        - read-survey-${key}.toml:
            cache: false
  read-survey-summary:
    # 版ごとの報告を、チェーンの核種とその外、止まった理由ごとに数えた要約（JSON）と、その文章
    cmd: python3 read_survey.py --json read-survey.json VII.0=read-survey-endfb70.toml,endfb70/chain.msgpack
      VII.1=read-survey-endfb71.toml,endfb71/chain.msgpack VIII.0=read-survey-endfb80.toml,chain.msgpack
      VIII.1=read-survey-endfb81.toml,endfb81/chain.msgpack > read-survey.txt
    deps:
      - ../../python-ast/examples/depletion/read_survey.py.ast
      - read-survey-endfb70.toml
      - read-survey-endfb71.toml
      - read-survey-endfb80.toml
      - read-survey-endfb81.toml
      - endfb70/chain.msgpack
      - endfb71/chain.msgpack
      - chain.msgpack
      - endfb81/chain.msgpack
    outs:
      - read-survey.json:
          cache: false
      - read-survey.txt:
          cache: false
  natural-isotopes:
    # 版ごとのチェーンとライブラリ（VIII.0 は本番の chain.toml と xs.toml、ほかは版のディレクトリの xs.toml。ADR-0138 の形のステージは
    # 版のディレクトリの dvc.yaml）が、天然の元素の評価を当てる核種で揃っていること（ADR-0262 の帰結）。版の比較の deps にする
    foreach:
      endfb70:
        chain: endfb70/chain
        xs: endfb70/xs.toml
        neutrons: ENDF-B-VII.0
      endfb71:
        chain: endfb71/chain
        xs: endfb71/xs.toml
        neutrons: ENDF-B-VII.1
      endfb80:
        chain: chain
        xs: xs.toml
        neutrons: ENDF-B-VIII.0
      endfb81:
        chain: endfb81/chain
        xs: endfb81/xs.toml
        neutrons: ENDF-B-VIII.1
    do:
      cmd: python3 check_natural_isotopes.py ${item.chain}.toml ${item.chain}.msgpack ${item.xs} > ${key}/natural-isotopes.txt
      deps:
        - ../../python-ast/examples/depletion/check_natural_isotopes.py.ast
        - ../../toml-values/examples/depletion/${item.chain}.toml.json
        - ../../toml-values/examples/depletion/${item.xs}.json
        - ${item.chain}.msgpack
        - ../../references/endf/${item.neutrons}_neutrons
      outs:
        - ${key}/natural-isotopes.txt:
            cache: false
  natural-isotopes-vera:
    # VII.0 の VERA の検証用ライブラリ（ADR-0175。天然の C を C-12 と C-13 に当てる）と VII.0 のチェーン（ADR-0262 の帰結）
    cmd: python3 check_natural_isotopes.py endfb70/chain.toml endfb70/chain.msgpack ../vera/endfb70/xs.toml > endfb70/natural-isotopes-vera.txt
    deps:
      - ../../python-ast/examples/depletion/check_natural_isotopes.py.ast
      - ../../toml-values/examples/depletion/endfb70/chain.toml.json
      - ../../toml-values/examples/vera/endfb70/xs.toml.json
      - endfb70/chain.msgpack
      - ../../references/endf/ENDF-B-VII.0_neutrons
    outs:
      - endfb70/natural-isotopes-vera.txt:
          cache: false
  lattice-1C-version:
    # 版ごとのピンセルの燃焼（60 MWd/kg まで。入力は版のディレクトリの lattice-1C-60.toml）。VIII.0 は本番のライブラリとチェーン。
    # 燃焼点ごとの k∞ は標準出力に出るので、ファイルに受ける。燃焼の時間の内訳はログ（標準エラー）
    foreach:
      endfb70:
        library: endfb70/depletion.msgpack
        chain: endfb70/chain.msgpack
      endfb71:
        library: endfb71/depletion.msgpack
        chain: endfb71/chain.msgpack
      endfb80:
        library: depletion.msgpack
        chain: chain.msgpack
      endfb81:
        library: endfb81/depletion.msgpack
        chain: endfb81/chain.msgpack
    do:
      cmd: ../../bin/lattice ${key}/lattice-1C-60.toml > ${key}/lattice-1C-60.out 2> ${key}/lattice-1C-60.log
      deps:
        - ../../toml-values/examples/depletion/${key}/lattice-1C-60.toml.json
        - ${item.library}
        - ${item.chain}
        - ../../binary-forms/lattice.md5
      outs:
        - ${key}/lattice-1C-60.out
        - ${key}/lattice-1C-60.msgpack
        - ${key}/lattice-1C-60.log
  compare-depletion-versions:
    # 4 つの版の核データで解いたピンセルの燃焼（lattice-1C-version）を、VII.1 を基準に比べた要約（ADR-0264 の「確認」、#0303。
    # 記録の表は verification_tables.py がここから描く。ADR-0176）。天然の元素の評価の検査（natural-isotopes）を通った版だけを比べる
    cmd: python3 compare_depletion_versions.py --json compare-depletion-versions.json --base VII.1 VII.0=endfb70/lattice-1C-60.msgpack VII.1=endfb71/lattice-1C-60.msgpack VIII.0=endfb80/lattice-1C-60.msgpack VIII.1=endfb81/lattice-1C-60.msgpack > compare-depletion-versions.txt
    deps:
      - ../../python-ast/examples/depletion/compare_depletion_versions.py.ast
      - endfb70/lattice-1C-60.msgpack
      - endfb71/lattice-1C-60.msgpack
      - endfb80/lattice-1C-60.msgpack
      - endfb81/lattice-1C-60.msgpack
      - endfb70/natural-isotopes.txt
      - endfb71/natural-isotopes.txt
      - endfb80/natural-isotopes.txt
      - endfb81/natural-isotopes.txt
    outs:
      - compare-depletion-versions.json:
          cache: false
      - compare-depletion-versions.txt:
          cache: false
  openmc-chain:
    cmd: nix develop ../..#references -c python3 openmc_chain.py ../../references/endf openmc-chain.xml
    deps:
      - ../../python-ast/examples/depletion/openmc_chain.py.ast
      - references-shell.txt
      - ../../references/endf/ENDF-B-VIII.0_decay
      - ../../references/endf/ENDF-B-VIII.0_nfy
      - ../../references/endf/ENDF-B-VIII.0_neutrons
    outs:
      - openmc-chain.xml
  xs-range:
    # ポイントワイズの範囲は、すべての核種の分離共鳴の上端で決まる。核種ごとのステージの入力にするため、先に求める（ADR-0138）
    cmd: ../../bin/xs range xs.toml xs-range.toml
    deps:
      - ../../toml-values/examples/depletion/xs.toml.json
      - ../../references/endf/ENDF-B-VIII.0_neutrons
      - ../../binary-forms/xs.md5
    outs:
      - xs-range.toml:
          cache: false
  xs-nuclide:
    # 入力のうちその核種の項目と、全核種に共通の項目だけを params で deps にする（ADR-0138）
    foreach: ${nuclide}
    do:
      cmd: ../../bin/xs nuclide xs.toml xs-range.toml ${key} xs-nuclides/${key}.msgpack
      deps:
        - xs-range.toml
        - ${endf-directory}/${item.endf}
        - ${thermal-directory}
        - ../../binary-forms/xs.md5
      params:
        - xs.toml:
            - sigma0
            - scattering-order
            - nuclide.${key}
      outs:
        - xs-nuclides/${key}.msgpack
  xs:
    cmd: ../../bin/xs assemble xs.toml xs-range.toml xs-nuclides
    deps:
      - ../../toml-values/examples/depletion/xs.toml.json
      - xs-range.toml
      - xs-nuclides
      - ../../binary-forms/xs.md5
    outs:
      - depletion.msgpack
  openmc-neutron:
    # 核種ごとのステージは、入力のうちその核種の項目だけを params で deps にする（ADR-0130）
    foreach: ${neutron}
    do:
      cmd: nix develop ../..#references -c python3 ../vera/openmc_library.py neutron openmc-library.toml ${key} openmc-library/neutron/${key}.h5
      deps:
        - ../../python-ast/examples/vera/openmc_library.py.ast
        - ../../python-ast/examples/openmc_input.py.ast
        - references-shell.txt
        - ${item.endf}
      params:
        - openmc-library.toml:
            - neutron.${key}
      outs:
        - openmc-library/neutron/${key}.h5
  openmc-thermal:
    foreach: ${thermal}
    do:
      cmd: nix develop ../..#references -c python3 ../vera/openmc_library.py thermal openmc-library.toml ${key} openmc-library/thermal/${key}.h5
      deps:
        - ../../python-ast/examples/vera/openmc_library.py.ast
        - ../../python-ast/examples/openmc_input.py.ast
        - references-shell.txt
        - ${item.neutron}
        - ${item.thermal}
      params:
        - openmc-library.toml:
            - thermal.${key}
      outs:
        - openmc-library/thermal/${key}.h5
  openmc-index:
    cmd: nix develop ../..#references -c python3 ../vera/openmc_library.py index openmc-library.toml openmc-library
    deps:
      - ../../python-ast/examples/vera/openmc_library.py.ast
      - ../../python-ast/examples/openmc_input.py.ast
      - references-shell.txt
      - ../../toml-values/examples/depletion/openmc-library.toml.json
      - openmc-library/neutron
      - openmc-library/thermal
    outs:
      - openmc-library/cross_sections.xml
  openmc-1C:
    # OpenMC の燃焼（ADR-0173）。燃料のリングの数ごと。ライブラリはディレクトリ全体を deps にする（ADR-0130）
    foreach: [rings1, rings4]
    do:
      cmd: nix develop ../..#references -c python3 openmc_depletion.py run openmc-1C-${item}.toml openmc-1C-${item}
      deps:
        - ../../python-ast/examples/depletion/openmc_depletion.py.ast
        - ../../python-ast/examples/vera/openmc_model.py.ast
        - ../../python-ast/examples/openmc_common.py.ast
        - ../../python-ast/examples/openmc_input.py.ast
        - references-shell.txt
        - openmc-library
        - openmc-chain.xml
        - ../../toml-values/examples/depletion/openmc-1C-${item}.toml.json
      outs:
        - openmc-1C-${item}
  openmc-1C-extract:
    foreach: [rings1, rings4]
    do:
      cmd: nix develop ../..#references -c python3 openmc_depletion.py extract openmc-1C-${item}.toml openmc-1C-${item} openmc-1C-${item}.msgpack
      deps:
        - ../../python-ast/examples/depletion/openmc_depletion.py.ast
        - references-shell.txt
        - openmc-1C-${item}
        - ../../toml-values/examples/depletion/openmc-1C-${item}.toml.json
      outs:
        - openmc-1C-${item}.msgpack
  lattice-1C:
    # xlc の格子計算の燃焼（ADR-0173）。燃焼点ごとの k∞ は標準出力に出るので、ファイルに受ける。燃焼の時間の内訳はログ（標準エラー）
    foreach: [rings1, rings4]
    do:
      cmd: ../../bin/lattice lattice-1C-${item}.toml > lattice-1C-${item}.out 2> lattice-1C-${item}.log
      deps:
        - ../../toml-values/examples/depletion/lattice-1C-${item}.toml.json
        - depletion.msgpack
        - chain.msgpack
        - ../../binary-forms/lattice.md5
      outs:
        - lattice-1C-${item}.out
        - lattice-1C-${item}.msgpack
        - lattice-1C-${item}.log
  lattice-2A:
    # 集合体の燃焼の時間の内訳（ADR-0173）。1 ステップだけ
    cmd: ../../bin/lattice lattice-2A.toml > lattice-2A.out 2> lattice-2A.log
    deps:
      - ../../toml-values/examples/depletion/lattice-2A.toml.json
      - depletion.msgpack
      - chain.msgpack
      - ../../binary-forms/lattice.md5
    outs:
      - lattice-2A.out
      - lattice-2A.msgpack
      - lattice-2A.log
  compare-1C:
    # 比べた要約（記録の表は verification_tables.py がここから描く。ADR-0176）
    foreach: [rings1, rings4]
    do:
      cmd: python3 compare_depletion.py --json compare-1C-${item}.json lattice-1C-${item}.msgpack openmc-1C-${item}.msgpack
      deps:
        - ../../python-ast/examples/depletion/compare_depletion.py.ast
        - lattice-1C-${item}.msgpack
        - openmc-1C-${item}.msgpack
      outs:
        - compare-1C-${item}.json:
            cache: false
  openmc-mox1:
    # MOX-1 の OpenMC の燃焼（ADR-0206）。形状と組成は ../mox/openmc_model.py、演算子は openmc_depletion.py から読む
    cmd: nix develop ../..#references -c python3 openmc_depletion_mox.py run openmc-mox1-rings1.toml openmc-mox1-rings1
    deps:
      - ../../python-ast/examples/depletion/openmc_depletion_mox.py.ast
      - ../../python-ast/examples/depletion/openmc_depletion.py.ast
      - ../../python-ast/examples/mox/openmc_model.py.ast
      - ../../python-ast/examples/vera/openmc_model.py.ast
      - ../../python-ast/examples/vera/openmc_tallies.py.ast
      - ../../python-ast/examples/openmc_common.py.ast
      - ../../python-ast/examples/openmc_input.py.ast
      - ../../python-ast/examples/openmc_run.py.ast
      - references-shell.txt
      - openmc-library
      - openmc-chain.xml
      - ../../toml-values/examples/depletion/openmc-mox1-rings1.toml.json
    outs:
      - openmc-mox1-rings1
  openmc-mox1-extract:
    cmd: nix develop ../..#references -c python3 openmc_depletion_mox.py extract openmc-mox1-rings1.toml openmc-mox1-rings1 openmc-mox1-rings1.msgpack
    deps:
      - ../../python-ast/examples/depletion/openmc_depletion_mox.py.ast
      - ../../python-ast/examples/mox/openmc_model.py.ast
      - references-shell.txt
      - openmc-mox1-rings1
      - ../../toml-values/examples/depletion/openmc-mox1-rings1.toml.json
    outs:
      - openmc-mox1-rings1.msgpack
  lattice-mox1:
    # xlc の MOX-1 の燃焼（ADR-0206）。k∞ は標準出力、時間の内訳はログ（標準エラー）に出る
    cmd: ../../bin/lattice lattice-mox1-rings1.toml > lattice-mox1-rings1.out 2> lattice-mox1-rings1.log
    deps:
      - ../../toml-values/examples/depletion/lattice-mox1-rings1.toml.json
      - depletion.msgpack
      - chain.msgpack
      - ../../binary-forms/lattice.md5
    outs:
      - lattice-mox1-rings1.out
      - lattice-mox1-rings1.msgpack
      - lattice-mox1-rings1.log
  compare-mox1:
    cmd: python3 compare_depletion.py --json compare-mox1-rings1.json lattice-mox1-rings1.msgpack openmc-mox1-rings1.msgpack
    deps:
      - ../../python-ast/examples/depletion/compare_depletion.py.ast
      - lattice-mox1-rings1.msgpack
      - openmc-mox1-rings1.msgpack
    outs:
      - compare-mox1-rings1.json:
          cache: false
