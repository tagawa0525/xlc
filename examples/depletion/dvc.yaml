# 燃焼チェーンのステージ: ENDF/B-VIII.0 の decay、nfy、neutrons → xlc の全核種のチェーン（ADR-0164。bin/chain、ADR-0166）と、比べる
# OpenMC のチェーン（Chain.from_endf）。実行するのは default の devShell の `dvc repro`（ADR-0159）。OpenMC を使うステージは cmd を
# references の devShell でラッパー、その devShell の store のパス（references-shell.txt）をツールの deps にする（ADR-0130）。
# チェーンと範囲のステージは ENDF をディレクトリごと deps にする（sha256 で固定した。ADR-0124）。燃焼の検証の多群ライブラリ（ADR-0169）は、
# examples/vera と同じ核種ごとのステージ（範囲 xs-range → 核種ごと xs-nuclide → 組み立て xs。ADR-0138）で作る
# 格子計算の燃焼の検証（ADR-0173）の OpenMC のライブラリ（openmc-library.toml、核種ごとのステージは examples/vera と同じ
# ../vera/openmc_library.py）と、OpenMC と xlc の燃焼、その比較のステージを持つ。MOX のピンセル MOX-1 の燃焼（ADR-0206）も、同じ
# ライブラリとチェーンを使うのでここに置く
vars:
  - xs.toml
  - openmc-library.toml
stages:
  references-shell:
    # ツール（OpenMC とその Python API）の版、パッチ、依存のどれが変わっても store のパスが変わる。評価だけでビルドしない
    cmd: nix eval --raw ../..#devShells.x86_64-linux.references.outPath > references-shell.txt
    always_changed: true
    outs:
      - references-shell.txt:
          cache: false
  chain:
    cmd: ../../bin/chain chain.toml
    deps:
      - chain.toml
      - ../../references/endf/ENDF-B-VIII.0_decay
      - ../../references/endf/ENDF-B-VIII.0_nfy
      - ../../references/endf/ENDF-B-VIII.0_neutrons
      - ../../bin/chain
    outs:
      - chain.msgpack
  openmc-chain:
    cmd: nix develop ../..#references -c python3 openmc_chain.py ../../references/endf openmc-chain.xml
    deps:
      - openmc_chain.py
      - references-shell.txt
      - ../../references/endf/ENDF-B-VIII.0_decay
      - ../../references/endf/ENDF-B-VIII.0_nfy
      - ../../references/endf/ENDF-B-VIII.0_neutrons
    outs:
      - openmc-chain.xml
  xs-range:
    # ポイントワイズの範囲は、すべての核種の分離共鳴の上端で決まる。核種ごとのステージの入力にするため、先に求める（ADR-0138）
    cmd: ../../bin/xs range xs.toml xs-range.toml
    deps:
      - xs.toml
      - ../../references/endf/ENDF-B-VIII.0_neutrons
      - ../../bin/xs
    outs:
      - xs-range.toml:
          cache: false
  xs-nuclide:
    # 入力のうちその核種の項目と、全核種に共通の項目だけを params で deps にする（ADR-0138）
    foreach: ${nuclide}
    do:
      cmd: ../../bin/xs nuclide xs.toml xs-range.toml ${key} xs-nuclides/${key}.msgpack
      deps:
        - xs-range.toml
        - ${endf-directory}/${item.endf}
        - ${thermal-directory}
        - ../../bin/xs
      params:
        - xs.toml:
            - sigma0
            - scattering-order
            - nuclide.${key}
      outs:
        - xs-nuclides/${key}.msgpack
  xs:
    cmd: ../../bin/xs assemble xs.toml xs-range.toml xs-nuclides
    deps:
      - xs.toml
      - xs-range.toml
      - xs-nuclides
      - ../../bin/xs
    outs:
      - depletion.msgpack
  openmc-neutron:
    # 核種ごとのステージは、入力のうちその核種の項目だけを params で deps にする（ADR-0130）
    foreach: ${neutron}
    do:
      cmd: nix develop ../..#references -c python3 ../vera/openmc_library.py neutron openmc-library.toml ${key} openmc-library/neutron/${key}.h5
      deps:
        - ../vera/openmc_library.py
        - ../openmc_input.py
        - references-shell.txt
        - ${item.endf}
      params:
        - openmc-library.toml:
            - neutron.${key}
      outs:
        - openmc-library/neutron/${key}.h5
  openmc-thermal:
    foreach: ${thermal}
    do:
      cmd: nix develop ../..#references -c python3 ../vera/openmc_library.py thermal openmc-library.toml ${key} openmc-library/thermal/${key}.h5
      deps:
        - ../vera/openmc_library.py
        - ../openmc_input.py
        - references-shell.txt
        - ${item.neutron}
        - ${item.thermal}
      params:
        - openmc-library.toml:
            - thermal.${key}
      outs:
        - openmc-library/thermal/${key}.h5
  openmc-index:
    cmd: nix develop ../..#references -c python3 ../vera/openmc_library.py index openmc-library.toml openmc-library
    deps:
      - ../vera/openmc_library.py
      - ../openmc_input.py
      - references-shell.txt
      - openmc-library.toml
      - openmc-library/neutron
      - openmc-library/thermal
    outs:
      - openmc-library/cross_sections.xml
  openmc-1C:
    # OpenMC の燃焼（ADR-0173）。燃料のリングの数ごと。ライブラリはディレクトリ全体を deps にする（ADR-0130）
    foreach: [rings1, rings4]
    do:
      cmd: nix develop ../..#references -c python3 openmc_depletion.py run openmc-1C-${item}.toml openmc-1C-${item}
      deps:
        - openmc_depletion.py
        - ../vera/openmc_model.py
        - ../openmc_common.py
        - ../openmc_input.py
        - references-shell.txt
        - openmc-library
        - openmc-chain.xml
        - openmc-1C-${item}.toml
      outs:
        - openmc-1C-${item}
  openmc-1C-extract:
    foreach: [rings1, rings4]
    do:
      cmd: nix develop ../..#references -c python3 openmc_depletion.py extract openmc-1C-${item}.toml openmc-1C-${item} openmc-1C-${item}.msgpack
      deps:
        - openmc_depletion.py
        - references-shell.txt
        - openmc-1C-${item}
        - openmc-1C-${item}.toml
      outs:
        - openmc-1C-${item}.msgpack
  lattice-1C:
    # xlc の格子計算の燃焼（ADR-0173）。燃焼点ごとの k∞ は標準出力に出るので、ファイルに受ける。燃焼の時間の内訳はログ（標準エラー）
    foreach: [rings1, rings4]
    do:
      cmd: ../../bin/lattice lattice-1C-${item}.toml > lattice-1C-${item}.out 2> lattice-1C-${item}.log
      deps:
        - lattice-1C-${item}.toml
        - depletion.msgpack
        - chain.msgpack
        - ../../bin/lattice
      outs:
        - lattice-1C-${item}.out
        - lattice-1C-${item}.msgpack
        - lattice-1C-${item}.log
  lattice-2A:
    # 集合体の燃焼の時間の内訳（ADR-0173）。1 ステップだけ
    cmd: ../../bin/lattice lattice-2A.toml > lattice-2A.out 2> lattice-2A.log
    deps:
      - lattice-2A.toml
      - depletion.msgpack
      - chain.msgpack
      - ../../bin/lattice
    outs:
      - lattice-2A.out
      - lattice-2A.msgpack
      - lattice-2A.log
  compare-1C:
    # 比べた要約（記録の表は verification_tables.py がここから描く。ADR-0176）
    foreach: [rings1, rings4]
    do:
      cmd: python3 compare_depletion.py --json compare-1C-${item}.json lattice-1C-${item}.msgpack openmc-1C-${item}.msgpack
      deps:
        - compare_depletion.py
        - lattice-1C-${item}.msgpack
        - openmc-1C-${item}.msgpack
      outs:
        - compare-1C-${item}.json:
            cache: false
  openmc-mox1:
    # MOX-1 の OpenMC の燃焼（ADR-0206）。形状と組成は ../mox/openmc_model.py、演算子は openmc_depletion.py から読む
    cmd: nix develop ../..#references -c python3 openmc_depletion_mox.py run openmc-mox1-rings1.toml openmc-mox1-rings1
    deps:
      - openmc_depletion_mox.py
      - openmc_depletion.py
      - ../mox/openmc_model.py
      - ../vera/openmc_model.py
      - ../vera/openmc_tallies.py
      - ../openmc_common.py
      - ../openmc_input.py
      - ../openmc_run.py
      - references-shell.txt
      - openmc-library
      - openmc-chain.xml
      - openmc-mox1-rings1.toml
    outs:
      - openmc-mox1-rings1
  openmc-mox1-extract:
    cmd: nix develop ../..#references -c python3 openmc_depletion_mox.py extract openmc-mox1-rings1.toml openmc-mox1-rings1 openmc-mox1-rings1.msgpack
    deps:
      - openmc_depletion_mox.py
      - ../mox/openmc_model.py
      - references-shell.txt
      - openmc-mox1-rings1
      - openmc-mox1-rings1.toml
    outs:
      - openmc-mox1-rings1.msgpack
  lattice-mox1:
    # xlc の MOX-1 の燃焼（ADR-0206）。k∞ は標準出力、時間の内訳はログ（標準エラー）に出る
    cmd: ../../bin/lattice lattice-mox1-rings1.toml > lattice-mox1-rings1.out 2> lattice-mox1-rings1.log
    deps:
      - lattice-mox1-rings1.toml
      - depletion.msgpack
      - chain.msgpack
      - ../../bin/lattice
    outs:
      - lattice-mox1-rings1.out
      - lattice-mox1-rings1.msgpack
      - lattice-mox1-rings1.log
  compare-mox1:
    cmd: python3 compare_depletion.py --json compare-mox1-rings1.json lattice-mox1-rings1.msgpack openmc-mox1-rings1.msgpack
    deps:
      - compare_depletion.py
      - lattice-mox1-rings1.msgpack
      - openmc-mox1-rings1.msgpack
    outs:
      - compare-mox1-rings1.json:
          cache: false
