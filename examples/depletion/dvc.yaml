# 燃焼鎖の段階: ENDF/B-VIII.0 の decay、nfy、neutrons → xlc の全核種の鎖（ADR-0164。bin/chain、ADR-0166）と、比べる
# OpenMC の鎖（Chain.from_endf）。走らせるのは default の devShell の `dvc repro`（ADR-0159）。OpenMC を使う段階は cmd を
# references の devShell で包み、その devShell の store のパス（references-shell.txt）を道具の deps にする（ADR-0130）。
# ENDF はディレクトリごと deps にする（sha256 で固定した。ADR-0124）。燃焼の検証の多群ライブラリ（ADR-0169）は、
# examples/vera と同じ核種ごとの段階（範囲 xs-range → 核種ごと xs-nuclide → 組み立て xs。ADR-0138）で作る
vars:
  - xs.toml
stages:
  references-shell:
    # 道具（OpenMC とその Python API）の版、パッチ、依存のどれが変わっても store のパスが変わる。評価だけでビルドしない
    cmd: nix eval --raw ../..#devShells.x86_64-linux.references.outPath > references-shell.txt
    always_changed: true
    outs:
      - references-shell.txt:
          cache: false
  chain:
    cmd: ../../bin/chain chain.toml
    deps:
      - chain.toml
      - ../../references/endf/ENDF-B-VIII.0_decay
      - ../../references/endf/ENDF-B-VIII.0_nfy
      - ../../references/endf/ENDF-B-VIII.0_neutrons
      - ../../bin/chain
    outs:
      - chain.msgpack
  openmc-chain:
    cmd: nix develop ../..#references -c python3 openmc_chain.py ../../references/endf openmc-chain.xml
    deps:
      - openmc_chain.py
      - references-shell.txt
      - ../../references/endf/ENDF-B-VIII.0_decay
      - ../../references/endf/ENDF-B-VIII.0_nfy
      - ../../references/endf/ENDF-B-VIII.0_neutrons
    outs:
      - openmc-chain.xml
  xs-range:
    # ポイントワイズの範囲は、すべての核種の分離共鳴の上端で決まる。核種ごとの段階の入力にするため、先に求める（ADR-0138）
    cmd: ../../bin/xs range xs.toml xs-range.toml
    deps:
      - xs.toml
      - ../../references/endf/ENDF-B-VIII.0_neutrons
      - ../../bin/xs
    outs:
      - xs-range.toml:
          cache: false
  xs-nuclide:
    # 入力のうちその核種の項目と、全核種に共通の項目だけを params で deps にする（ADR-0138）
    foreach: ${nuclide}
    do:
      cmd: ../../bin/xs nuclide xs.toml xs-range.toml ${key} xs-nuclides/${key}.msgpack
      deps:
        - xs-range.toml
        - ${endf-directory}/${item.endf}
        - ${thermal-directory}
        - ../../bin/xs
      params:
        - xs.toml:
            - sigma0
            - scattering-order
            - nuclide.${key}
      outs:
        - xs-nuclides/${key}.msgpack
  xs:
    cmd: ../../bin/xs assemble xs.toml xs-range.toml xs-nuclides
    deps:
      - xs.toml
      - xs-range.toml
      - xs-nuclides
      - ../../bin/xs
    outs:
      - depletion.msgpack
