# #0305 の変更の前後で、既存の形の核種の xs nuclide の出力がバイトで同じことを確かめる試行（ENDF/B-VIII.0、温度 1 点の 600 K）。
# σ0 と散乱の次数は本番の xs.toml と同じ。U-235 と Zr-90 は本番の核種
output = "unused.msgpack"
endf-directory = "../../../references/endf/ENDF-B-VIII.0_neutrons"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
scattering-order = 3

[nuclide]
U-235 = { endf = "n-092_U_235.endf", temperatures = [600] }
Zr-90 = { endf = "n-040_Zr_090.endf", temperatures = [600] }
