# xs check が見逃す種類（後の処理で初めて止まるもの）を、温度 1 点で xs nuclide に最後まで通して探す標本（ENDF/B-VIII.1）
output = "unused.msgpack"
endf-directory = "../../../references/endf/ENDF-B-VIII.1_neutrons"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
scattering-order = 3

[nuclide]
Sr-88 = { endf = "n-038_Sr_088.endf", temperatures = [600] }
Cu-63 = { endf = "n-029_Cu_063.endf", temperatures = [600] }
Li-7 = { endf = "n-003_Li_007.endf", temperatures = [600] }
Ni-58 = { endf = "n-028_Ni_058.endf", temperatures = [600] }
# MF3 の弾性散乱は、分離共鳴の上端 800 keV の段差の右の値が −1.058e-12 b（左の値は 0、次の 800.021 keV の点は 4.47 b）。分離共鳴の
# 範囲の中の負の和は宣言なしで 0 にする（ADR-0267）が、範囲の外のこの値は宣言して 0 にする
Ni-60 = { endf = "n-028_Ni_060.endf", temperatures = [600], negative-to-zero = [
  { mt = 2, from = 8.0e5, to = 8.0e5 },
] }
