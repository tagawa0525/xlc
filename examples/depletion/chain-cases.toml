# xlc の全核種の鎖と OpenMC の鎖（どちらも ENDF/B-VIII.0 から。ADR-0164）に同じ 1 群の反応率を与え、1 ステップを
# 次数 48 の CRAM で解いて比べる入力。compare_chain_depletion.py が読む。数密度は 1/(barn cm)、反応率は 1/s。
#
# 反応率は、中性子束 3e14 1/(cm2 s) と PWR の燃料に似せた 1 群の断面積（U-238 の捕獲 0.9 b、U-235 の核分裂 40 b と
# 捕獲 10 b、Xe-135 の吸収 2.6e6 b、Sm-149 の吸収 4e4 b、Pu-239 の核分裂 100 b と捕獲 55 b）を掛けた例示の値で、
# 評価済みデータから作ったものではない。核分裂の収率は 0.0253 eV の点を使う（OpenMC の ConstantFissionYieldHelper の既定）。

# U-238 → U-239 → Np-239 → Pu-239
[[case]]
name = "u238-capture"
t = 2.592e6 # 30 日
n0 = { "U-238" = 2.2e-2 }
reaction = [["U-238", 102, 2.7e-10]]

# I-135 → Xe-135、Pm-149 → Sm-149 と、Xe-135 と Sm-149 の吸収
[[case]]
name = "u235-fission-10h"
t = 3.6e4
n0 = { "U-235" = 7e-4 }
reaction = [["U-235", 102, 3e-9], ["Xe-135", 102, 7.8e-4], ["Sm-149", 102, 1.2e-5]]
fission = [["U-235", 1.2e-8]]

[[case]]
name = "u235-fission-30d"
t = 2.592e6
n0 = { "U-235" = 7e-4 }
reaction = [["U-235", 102, 3e-9], ["Xe-135", 102, 7.8e-4], ["Sm-149", 102, 1.2e-5]]
fission = [["U-235", 1.2e-8]]

[[case]]
name = "pu239-fission-30d"
t = 2.592e6
n0 = { "Pu-239" = 1e-4 }
reaction = [["Pu-239", 102, 1.65e-8], ["Xe-135", 102, 7.8e-4], ["Sm-149", 102, 1.2e-5]]
fission = [["Pu-239", 3e-8]]
