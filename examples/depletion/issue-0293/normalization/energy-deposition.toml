# #0293 の項目 3: 出力の規格化だけを変えた、VERA Problem 1C のピンセル（燃料 1 リング）の OpenMC の燃焼（../../openmc_depletion.py）。
# fission-q.toml と energy-deposition.toml は normalization のほかは同じ。燃焼度の点は 40 MWd/kg までの 14 点（CE/CM で輸送 29 回）、
# 粒子は 1 世代 5 万・130 世代（最初の 30 を捨てる）で、k の統計誤差は 40〜60 pcm の見込み（../../openmc-1C-rings1.toml の 20 万粒子で
