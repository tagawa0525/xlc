# #0292 の試行: 燃焼チェーンにあって ENDF/B-VIII.0 の中性子のファイルがある核種を、すべて輸送する核種にしたライブラリ。
# all_nuclides.py が ../../trial/library/xs.toml と ../../../read-survey-endfb80.toml から書く。手で直さない。
# 温度は試行のセルの 565 K の 1 点（H-1 は S(α, β) の内挿に使う 4 点）。理由は all_nuclides.py の TEMPERATURE。
# xs が止まる評価は外す（外した核種と issue）:
#   Th-232: 核分裂の中性子の分布が MF6 MT18 で、輸送する核種として処理できない（#0312）。放射化の核種として残す
#   Pa-231: 核分裂の中性子の分布が MF6 MT18 で、輸送する核種として処理できない（#0312）。放射化の核種として残す
#   Pa-233: 核分裂の中性子の分布が MF6 MT18 で、輸送する核種として処理できない（#0312）。放射化の核種として残す
#   Cl-35: 分離共鳴（R 行列の制限形）の荷電粒子の対を読めない（#0264）
#   Ca-40: 分離共鳴（R 行列の制限形）の荷電粒子の対を読めない（#0264）
output = "depletion.msgpack"
endf-directory = "../../../../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../../../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
# 省略すると 3（ADR-0076）。核種ごとのステージの params にするため、書いておく（ADR-0138）
scattering-order = 3

