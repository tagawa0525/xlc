# #0283: 2A の格子計算の燃焼の履歴（../p2/lattice-2A.msgpack、md5 c028d773）と、同じ組成を分岐で解いたテーブルの k∞ の差の切り分け。
# 自由ガスの上限を前の既定（400 kT）にし、ライブラリを履歴の dvc.lock の deps（md5 a96f4f23。ADR-0239 の温度の点を足す前）にしたもの。
# 格子、離散化、組成と公称の 1 状態は issue-0279/core-micro/table-d0.toml と同じで、燃焼度の点を 0、20、60 MWd/kg に、追う核種をなしにした。
# ライブラリは同じ置き場の depletion-a96f4f23.msgpack（`dvc add`。scripts/worktree-restore-outputs.sh で戻る）。
library = "depletion-a96f4f23.msgpack"
few-group = { output = "caps-400-library-a96f4f23.msgpack", bounds = [1e7, 0.625, 1e-5] }
ufg-tolerance = 1e-4
ufg-free-gas = { upper = 400, heavy = 400 }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

