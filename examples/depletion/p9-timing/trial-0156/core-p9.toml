# trial-0231/core-p9.toml（../core-p9.toml の cycle と chain のパスをこの置き場から引く形）の、場合 3 を出力のあるステップにした試行の入力
# （ADR-0219 の Xe とホウ素の同時の反復、#0156）。ステップ 1（表 P9-2 の場合 2）はホウ素 1200 ppm を与えたまま（燃焼点 0 は Xe のない解で
# 範囲 1100〜1300 ppm に入らず、ステップ 1 の中点は燃焼点 0 と同じ状態 case-2 で解く）。ステップ 1 の終わりの点（場合 3 の状態と出力で解く。
# ADR-0218）、ステップ 2 の中点と終わりの点は、平衡 Xe で臨界ホウ素を探す。目標の k は、ステップ 1 の終わりの点のホウ素が範囲の上の
# 1250 ppm ほどに来る 1.1236（p9_timing_inputs.py の `TARGET_K` の注の試行で、この点の 1200 ppm の k が 1.12945、BOC のホウ素の効きが
# 11.8 pcm/ppm）。ステップ 2 の燃焼でホウ素が下がる幅を範囲に残すため
cycle = "../core-p9-cycle.toml"
axial-mesh = [0.0, 50.0, 55.0, 61.053, 66.951, 68.221, 70.817, 79.0281, 87.2393, 95.4504, 103.6616, 111.8727, 120.0839, 128.295, 132.105, 140.17, 148.235, 156.3, 164.365, 172.43, 180.495, 184.305, 192.37, 200.435, 208.5, 216.565, 224.63, 232.695, 236.505, 244.57, 252.635, 260.7, 268.765, 276.83, 284.895, 288.705, 296.77, 304.835, 312.9, 320.965, 329.03, 337.095, 340.905, 348.97, 357.035, 365.1, 373.165, 381.23, 389.295, 393.105, 401.0262, 408.9474, 416.8686, 424.7898, 431.441, 432.711, 448.711, 452.51, 461.337, 468.937, 518.937]
radial-nodes = 1
boundary = { x = ["vacuum", "vacuum"], y = ["vacuum", "vacuum"], z = ["vacuum", "vacuum"], outline = "vacuum" }

[state.case-2]
boron = 1200.0
b10 = 0.199
moderator = 565
fuel = 565
banks = { A = 230, B = 230, C = 230, D = 192, SA = 230, SB = 230, SC = 230, SD = 230 }

[state.case-3]
search = { boron = [1100.0, 1300.0], k = 1.1236, tolerance = 1.0e-6, max-solves = 20 }
b10 = 0.199
moderator = 565
fuel = 565
banks = { A = 230, B = 230, C = 230, D = 219, SA = 230, SB = 230, SC = 230, SD = 230 }

[depletion]
specific-power = 38.41
history = "core-p9.msgpack"
# 格子計算の燃焼（../p2/lattice-2A.toml）と同じチェーン
micro = { chain = "../../chain.msgpack", xenon = "equilibrium" }
steps = [
  { efpd = 9.0, power = 0.657, state = "case-2" },
  { efpd = 32.0, power = 0.997, state = "case-3" },
]
