# branch-2A-cross.toml の 12 状態を、案内管 24 本すべてに AIC の制御棒を入れた格子で解く（制御棒の分岐。ADR-0097 の形状の変更）。
# 制御棒、被覆管（SS304）、吸収体と被覆管の間の真空の形と組成は ../p2/lattice-2A-rods.toml と同じ。制御棒の物質は 565 K のまま。
library = "../p2/depletion.msgpack"
ufg-tolerance = 1e-4
few-group = { output = "table-2A-cross-rods.msgpack", bounds = [1e7, 0.625, 1e-5] }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin cr  pin pin cr  pin pin cr  pin pin pin pin pin",
  "pin pin pin cr  pin pin pin pin pin pin pin pin pin cr  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin cr  pin pin cr  pin pin it  pin pin cr  pin pin cr  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin cr  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin cr  pin pin pin pin pin pin pin pin pin cr  pin pin pin",
  "pin pin pin pin pin cr  pin pin cr  pin pin cr  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

[material.fuel]
temperature = 565
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.zircaloy]
temperature = 565

[material.zircaloy.nuclides]
Cr-50 = 3.30121e-06
Cr-52 = 6.36606e-05
Cr-53 = 7.21860e-06
Cr-54 = 1.79686e-06
Fe-54 = 8.68307e-06
Fe-56 = 1.36306e-04
Fe-57 = 3.14789e-06
Fe-58 = 4.18926e-07
Zr-90 = 2.18865e-02
Zr-91 = 4.77292e-03
Zr-92 = 7.29551e-03
Zr-94 = 7.39335e-03
Zr-96 = 1.19110e-03
Sn-112 = 4.68066e-06
Sn-114 = 3.18478e-06
Sn-115 = 1.64064e-06
Sn-116 = 7.01616e-05
Sn-117 = 3.70592e-05
Sn-118 = 1.16872e-04
Sn-119 = 4.14504e-05
Sn-120 = 1.57212e-04
Sn-122 = 2.23417e-05
Sn-124 = 2.79392e-05

[material.water]
temperature = 565
# 公称の 1300 ppm。B-10 の割合は履歴の入力の数密度の B-10 / (B-10 + B-11)
water = { density = 0.743, boron = 1300, b10 = 0.199 }

[material.ss304]
temperature = 565

[material.ss304.nuclides]
C-12 = 3.17461e-04
C-13 = 3.43358e-06
Si-28 = 1.58197e-03
Si-29 = 8.03653e-05
Si-30 = 5.30394e-05
P-31 = 6.99938e-05
Cr-50 = 7.64915e-04
Cr-52 = 1.47506e-02
Cr-53 = 1.67260e-03
Cr-54 = 4.16346e-04
Mn-55 = 1.75387e-03
Fe-54 = 3.44776e-03
Fe-56 = 5.41225e-02
Fe-57 = 1.24992e-03
Fe-58 = 1.66342e-04
Ni-58 = 5.30854e-03
Ni-60 = 2.04484e-03
Ni-61 = 8.88879e-05
Ni-62 = 2.83413e-04
Ni-64 = 7.21770e-05

[material.aic]
temperature = 565

[material.aic.nuclides]
Ag-107 = 2.36159e-02
Ag-109 = 2.19403e-02
Cd-106 = 3.41523e-05
Cd-108 = 2.43165e-05
Cd-110 = 3.41250e-04
Cd-111 = 3.49720e-04
Cd-112 = 6.59276e-04
Cd-113 = 3.33873e-04
Cd-114 = 7.84957e-04
Cd-116 = 2.04641e-04
In-113 = 3.44262e-04
In-115 = 7.68050e-03

# 燃料のピン（3.1%）
[cell.pin]
zones = [
  { material = "fuel", radius = 0.4096, rings = 5 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

# 計装管（中は減速材）
[cell.it]
zones = [
  { material = "water", radius = 0.559, rings = 3 },
  { material = "zircaloy", radius = 0.605, rings = 1 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

# AIC の制御棒を入れた案内管（吸収体と被覆管の間は真空）
[cell.cr]
zones = [
  { material = "aic", radius = 0.382, rings = 5 },
  { material = "void", radius = 0.386, rings = 1 },
  { material = "ss304", radius = 0.484, rings = 1 },
  { material = "water", radius = 0.561, rings = 1 },
  { material = "zircaloy", radius = 0.602, rings = 1 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

[branches]
boron = { ppm = [0, 650, 1300], materials = ["water"] }
# 600 K の密度は仕様書の 2B〜2D の 0.661 g/cc（表 P2-4）。565 K は履歴の 0.743 g/cc
moderator = { temperature = [565, 600], density = [0.743, 0.661], materials = ["water", "zircaloy"] }
fuel = { temperature = [565, 600], materials = ["fuel"] }
# 交差の項を落とす誤差を測る真値なので、直積で解く（燃焼度の軸を持つ分岐の既定は 2 軸の組の部分格子。ADR-0200）
subgrids = [["boron", "moderator", "fuel"]]

[history]
file = "../p2/lattice-2A.msgpack"
burnup = [40]
