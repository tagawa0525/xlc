# core の燃焼で、ステップの点と中点ごとに臨界ホウ素を探す（ADR-0191）確認: ホウ素の軸を 0〜1300 ppm に広げたテーブル
# （table-2A-boron.msgpack。branch-2A-boron.toml）の集合体 1 体（反射境界）を、38.41 W/g で core-2A-steps.toml の 9 MWd/kg までの
# 16 ステップで燃焼させる。集合体 1 体の k∞ は漏れを持たないので、目標の k は 1 でなく、初めの点（Xe のない新しい燃料、1300 ppm で
# k∞ 1.183。table-2A-fine の値）が範囲の上端の内側に入り、9 MWd/kg の中点と点で 0 ppm の k∞ が目標を上回る 1.19 にする。
cycle = "core-2A-boron-cycle.toml"
axial-mesh = [0.0, 21.5]
radial-nodes = 1
boundary = { x = ["reflective", "reflective"], y = ["reflective", "reflective"], z = ["reflective", "reflective"] }

[state.hfp]
b10 = 0.199
moderator = 565
fuel = 565
search = { boron = [0.0, 1300.0], k = 1.19, tolerance = 1.0e-6, max-solves = 20 }

