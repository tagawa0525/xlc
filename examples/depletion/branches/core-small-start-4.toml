# 小さな炉心の core の燃焼（ステップの大きさの誤差と中点の探索の効き）: core-small-plant.toml の 2A の 4 × 4 の 1/4 と反射体を、
# バンク D の出し入れ、出力の割合、18 日の停止を含むサイクルで、点と中点の臨界ホウ素を探して燃焼させる。基準のサイクル
# （core-small-search-1.toml）の出力のあるステップを等しい EFPD の 4 個に分ける（崩壊だけのステップは分けない）。
# 中点のホウ素は ステップの初めの点で探した濃度（ADR-0191 の案 S1）。
cycle = "core-small-cycle.toml"
axial-mesh = [0.0, 22.86, 45.72, 68.58, 91.44, 114.3, 137.16, 160.02, 182.88, 205.74, 228.6, 251.46, 274.32, 297.18, 320.04, 342.9, 365.76]
radial-nodes = 1
boundary = { x = ["reflective", "vacuum"], y = ["reflective", "vacuum"], z = ["marshak", "marshak"], outline = "marshak" }

# バンク D を抜いた状態（230 ステップで先端が炉心の上端）
[state.aro]
b10 = 0.199
moderator = 565
fuel = 565
search = { boron = [0.0, 1300.0], k = 1.075, tolerance = 1.0e-6, max-solves = 20 }
banks = { D = 230 }

# バンク D を 140 ステップ（先端 222.885 cm）まで入れた状態。下から 10 番目のノード（205.74〜228.6 cm）が部分挿入
[state.rodded]
b10 = 0.199
moderator = 565
fuel = 565
search = { boron = [0.0, 1300.0], k = 1.075, tolerance = 1.0e-6, max-solves = 20 }
banks = { D = 140 }

[depletion]
specific-power = 38.41
history = "core-small-start-4.msgpack"
# 格子計算の燃焼（../p2/lattice-2A.toml）と同じチェーン
micro = { chain = "../chain.msgpack" }
