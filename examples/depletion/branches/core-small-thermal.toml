# 熱水力のある core の燃焼（#0228。ADR-0229 の燃焼のステップ）の小さな炉心: core-small-isothermal.toml と同じサイクルを、状態の入口の
# 温度 565 K から集合体ごとの流路と燃料棒で求めたノードの減速材と燃料の温度で解く。
# サイクルは core-small-equilibrium-1.toml のステップを 3.75 MWd/kg までに縮めたもの（バンク D の出し入れ、出力の割合 0.7、18 日の停止を
# 同じ順に持つ）。テーブルの燃焼度の点は 10 MWd/kg までで、元のサイクルではノードの燃焼度が 4.5 MWd/kg の中点で 10 MWd/kg を超える
cycle = "core-small-thermal-cycle.toml"
axial-mesh = [0.0, 22.86, 45.72, 68.58, 91.44, 114.3, 137.16, 160.02, 182.88, 205.74, 228.6, 251.46, 274.32, 297.18, 320.04, 342.9, 365.76]
radial-nodes = 1
boundary = { x = ["reflective", "vacuum"], y = ["reflective", "vacuum"], z = ["marshak", "marshak"], outline = "marshak" }

# 熱水力（ADR-0229）。テーブルの燃料の温度の格子点の上限 600 K（燃焼の履歴が輸送する B-10 の温度の点）にノードの燃料の実効温度が
# 入るように、熱出力は定格（VERA の 3411 MW / 193 体の 4 体分）の 3 %。燃焼度と Xe の出力の水準は定格のまま（ステップの出力の割合）。
# 流量は表 P6-1 の集合体あたり 0.6823 Mlbs/hr の 4 体分、圧力は 2250 psia、燃料の発熱の割合は表 18 の 97.4 %。燃料棒、ギャップの
# コンダクタンス、流路は ../../vera/p6/core-6.toml と同じ
[thermal-hydraulics]
power = 2.12083
flow = 343.8736
pressure = 15.513204
fuel-heat-fraction = 0.974
effective-temperature = "volume-average"
rod = { pellet-radius = 0.4096, clad-inner-radius = 0.418, clad-outer-radius = 0.475, pellet-density = 10.257, gap-conductance = 1.0e+04, rods = 264 }
channel = { flow-area = 246.6465, wetted-perimeter = 882.4922 }

# バンク D を抜いた状態（230 ステップで先端が炉心の上端）
[state.aro]
b10 = 0.199
inlet = 565
search = { boron = [0.0, 1300.0], k = 1.071, tolerance = 1.0e-6, max-solves = 20 }
banks = { D = 230 }

# バンク D を 140 ステップ（先端 222.885 cm）まで入れた状態。下から 10 番目のノード（205.74〜228.6 cm）が部分挿入
[state.rodded]
b10 = 0.199
inlet = 565
search = { boron = [0.0, 1300.0], k = 1.071, tolerance = 1.0e-6, max-solves = 20 }
banks = { D = 140 }

[depletion]
specific-power = 38.41
history = "core-small-thermal.msgpack"
# 格子計算の燃焼（../p2/lattice-2A.toml）と同じチェーン
micro = { chain = "../chain.msgpack", xenon = "equilibrium" }
steps = [
  { efpd = 6.508721687060662, state = "aro" },  # 0.25 MWd/kg
  { efpd = 26.03488674824265 },  # 1 MWd/kg
  { efpd = 52.0697734964853 },  # 2 MWd/kg
  { efpd = 65.08721687060662, state = "rodded" },  # 2.5 MWd/kg
  { efpd = 78.10466024472794, power = 0.7, state = "aro" },  # 3 MWd/kg
  { efpd = 91.12210361884927, power = 0.7 },  # 3.5 MWd/kg
  { decay-days = 18.0 },  # 停止
  { efpd = 97.63082530590992 },  # 3.75 MWd/kg
]
