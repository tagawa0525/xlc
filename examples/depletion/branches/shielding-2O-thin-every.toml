# 分岐の自己遮蔽を、減速材と燃料の温度の点ごとに公称のホウ素で 1 度だけ解く既定（ADR-0201 の `shielding = "nominal-boron"`）の誤差を、
# 状態ごとに解き直す方式（`"every-state"`）と比べる入力（examples/depletion/verification.md の「分岐の自己遮蔽（ADR-0201）」）。VERA Problem 2 の 2O（Gd 燃料 12 本）の燃焼の履歴（../p2/lattice-2O.msgpack）の
# 燃焼度 4 MWd/kg（Gd の燃え尽きの前）で、ホウ素 3 点（900、公称の 1300、1700 ppm）× 減速材 1 点（600 K と 0.71190 g/cc）× 燃料 1 点（公称の 600 K）。
# 減速材の温度は、ライブラリ（../p2/depletion.msgpack）が水と被覆管の核種に持つ 565 K と 600 K から選ぶ（ADR-0097 の M3 の 550、580 K は
# ない）。密度は ADR-0097 の M3 の点（VERA の仕様書の表 G-2 の 550 K と 580 K の値）。格子、離散化、組成は履歴の入力
# （../p2/lattice-2O.toml）と同じ（減速材はホウ酸水で書き、履歴の入力の数密度と相対で約 1e-6 違う）。`-every` と `-boron` は
# `[branches]` の `shielding` だけが違う。
library = "../p2/depletion.msgpack"
few-group = { output = "table-shielding-2O-thin-every.msgpack", bounds = [1e7, 0.625, 1e-5] }
ufg-tolerance = 1e-4
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

