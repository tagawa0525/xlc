# 分岐の自己遮蔽の既定（ADR-0201 の nominal-boron）の比較: shielding-<集合体>-every.toml と shielding-<集合体>-boron.toml が書くテーブルを
# 比べる（../compare_branch_shielding.py）
[[case]]
name = "2A"
every = "table-shielding-2A-every.msgpack"
nominal = "table-shielding-2A-boron.msgpack"

[[case]]
name = "2A-dense"
every = "table-shielding-2A-dense-every.msgpack"
nominal = "table-shielding-2A-dense-boron.msgpack"

[[case]]
name = "2O"
every = "table-shielding-2O-every.msgpack"
nominal = "table-shielding-2O-boron.msgpack"

[[case]]
name = "2O-thin"
every = "table-shielding-2O-thin-every.msgpack"
nominal = "table-shielding-2O-thin-boron.msgpack"
