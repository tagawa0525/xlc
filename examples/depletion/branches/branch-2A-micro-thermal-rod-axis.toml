# 熱水力のある core の燃焼（#0228。ADR-0229 の燃焼のステップ）の小さな炉心と全炉心に使う 2A のテーブル: branch-2A-micro-boron-rod-axis.toml
# と同じ格子、制御棒の組、追う核種を、熱水力のノードの温度の範囲に分岐の格子点を広げて解く。減速材は 565、600 K（ライブラリの
# 減速材と被覆管の核種の温度の点。../xs.toml）で、密度は熱水力の圧力 15.513204 MPa（2250 psia）の IF97 の密度を小数 6 桁に丸めた値
# （core はテーブルの格子点の密度が IF97 と 5e-6 g/cc より違えば止める。ADR-0229 の案 T1。値は ../../vera/p6/lattice-6-fuel.toml と同じ）。
# 燃料は 565、600 K（燃焼の領域が輸送する B-10 の温度の点。900 K は B-10 のデータが無く、格子計算が止まる）、ホウ素は小さな炉心の
# 探索の範囲 0〜1300 ppm を 3 点。状態は 2 軸の組の部分格子
# （燃焼度の軸を持つテーブルの既定。ADR-0200）。公称の状態は入力の物質（565 K、0.742713 g/cc、1300 ppm）。燃焼度の点は、小さな
# 炉心（7.5 MWd/kg まで）と全炉心の試行（約 1.2 MWd/kg まで）を覆う 10 MWd/kg まで
library = "../p2/depletion.msgpack"
few-group = { output = "table-2A-micro-thermal-rod-axis.msgpack", bounds = [1e7, 0.625, 1e-5] }
ufg-tolerance = 1e-4
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

