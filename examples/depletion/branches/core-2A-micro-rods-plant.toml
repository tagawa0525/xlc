# 集合体 1 体の炉心の形（core-plant.toml と同じ）に、ノード 1 つ（0〜21.5 cm）を部分挿入にする制御棒のバンク D を足したもの
# （#0192、ADR-0217）。先端の高さは 0.125 × ステップ (cm) で、挿入の割合 0、0.25、0.5、0.75、1 は 172、129、86、43、0 ステップ（どれも
# 2 進で割り切れる高さ）。棒は先端から上がすべて AIC（制御棒の軸の値 aic）。
pitch = 21.5
height = 21.5
map = ["*"]

[rods]
step = 0.125
bottom = 0.0
steps = 172
top = 21.5
map = ["D"]

[rods.bank.D]
type = "rcca"

[rods.type.rcca]
segments = [{ value = "aic", length = 21.5 }]
