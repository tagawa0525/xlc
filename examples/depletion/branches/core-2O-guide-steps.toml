# 燃焼度の内挿の点の選び方（ADR-0192、ADR-0199）の確認: 2O の全点のテーブルから指針の 27 点を選んだテーブル（table-2O-guide.msgpack）の
# 集合体 1 体（反射境界）を、2O の燃焼の履歴（テーブルを作った履歴のコピー lattice-2O-3d006d36.msgpack）と同じ出力密度 38.41 W/g で、履歴の 0 より後の 70 の燃焼点を
# ステップの終わりにして燃焼させる。EFPD は履歴の各点の時間 (s) / 86400。状態は履歴の公称（1300 ppm、600 K）。
