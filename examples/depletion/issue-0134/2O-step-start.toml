# #0134 の測定（ADR-0197）: ../p2/lattice-2O.toml（p2_inputs.py が書く）の自己遮蔽を、ステップの始まりの輸送だけで解く
# （`shielding = "step-start"`。案 F2）。ほかは library の置き場所と output の名前だけが違う。輸送のたびに解く本番の履歴
# （../p2/lattice-2O.msgpack）と compare.py で比べる。
library = "../p2/depletion.msgpack"
ufg-tolerance = 1e-4
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
