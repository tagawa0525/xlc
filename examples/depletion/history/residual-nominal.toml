# 履歴の残り R（ADR-0215、#0190）の公称のテーブル: VERA Problem 2 の 2A の今の既定の燃焼の履歴（../p2/lattice-2A.msgpack、md5 7efea664）の
# 17 の燃焼点（../branches/branch-2A-micro.toml と同じ）を、公称の状態（ホウ素 1300 ppm、減速材 565 K と 0.743 g/cc、燃料 565 K）と、
# 減速材の軸の公称でない格子点（600 K と 0.661 g/cc。密度の履歴の分岐 residual-density-history.toml の条件）の 2 状態で解く。追う 31 核種と
# Pu-240 の数密度の微分は ../micro/nominal.toml と同じ。格子、離散化、燃料と被覆管の組成は履歴の入力（../p2/lattice-2A.toml）と同じで、
# 減速材は分岐の軸のためホウ酸水で書く（履歴の入力の数密度と相対で約 1e-6 違う）。
library = "../p2/depletion.msgpack"
few-group = { output = "table-residual-nominal.msgpack", bounds = [1e7, 0.625, 1e-5] }
ufg-tolerance = 1e-4
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

[material.fuel]
temperature = 565
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.zircaloy]
temperature = 565

[material.zircaloy.nuclides]
Cr-50 = 3.30121e-06
Cr-52 = 6.36606e-05
Cr-53 = 7.21860e-06
Cr-54 = 1.79686e-06
Fe-54 = 8.68307e-06
Fe-56 = 1.36306e-04
Fe-57 = 3.14789e-06
Fe-58 = 4.18926e-07
Zr-90 = 2.18865e-02
Zr-91 = 4.77292e-03
Zr-92 = 7.29551e-03
Zr-94 = 7.39335e-03
Zr-96 = 1.19110e-03
Sn-112 = 4.68066e-06
Sn-114 = 3.18478e-06
Sn-115 = 1.64064e-06
Sn-116 = 7.01616e-05
Sn-117 = 3.70592e-05
Sn-118 = 1.16872e-04
Sn-119 = 4.14504e-05
Sn-120 = 1.57212e-04
Sn-122 = 2.23417e-05
Sn-124 = 2.79392e-05

[material.water]
temperature = 565
water = { density = 0.743, boron = 1300, b10 = 0.199 }

# 燃料のピン（3.1%）
[cell.pin]
zones = [
  { material = "fuel", radius = 0.4096, rings = 5 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

# 案内管（中は減速材）
[cell.gt]
zones = [
  { material = "water", radius = 0.561, rings = 3 },
  { material = "zircaloy", radius = 0.602, rings = 1 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

# 計装管（中は減速材）
[cell.it]
zones = [
  { material = "water", radius = 0.559, rings = 3 },
  { material = "zircaloy", radius = 0.605, rings = 1 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

[branches]
boron = { ppm = [1300], materials = ["water"] }
# 公称（入力の物質）の 565 K、0.743 g/cc と、密度の履歴の分岐の条件 600 K、0.661 g/cc
moderator = { temperature = [565, 600], density = [0.743, 0.661], materials = ["water", "zircaloy"] }
fuel = { temperature = [565], materials = ["fuel"] }

[history]
file = "../p2/lattice-2A.msgpack"
burnup = [0, 0.1, 0.5, 1, 2, 4, 6, 8, 10, 14, 20, 26, 32, 40, 48, 56, 60]
# ADR-0035 の元素の輸送する核種 26 と、その輸送する先行核 5（ADR-0216）
micro = [
  "U-234", "U-235", "U-236", "U-238", "Np-237", "Np-239", "Pu-238", "Pu-239", "Pu-240", "Pu-241", "Pu-242",
  "Am-241", "Am-243", "Xe-135", "Sm-147", "Sm-149", "Sm-150", "Sm-151", "Sm-152",
  "Gd-152", "Gd-154", "Gd-155", "Gd-156", "Gd-157", "Gd-158", "Gd-160",
  "Cm-242", "Cm-244", "Eu-153", "I-135", "Pm-148m",
]
# 線形の補正の係数を σᵢ から数密度の微分にする核種（ADR-0221。core の補正と R の第 3 項の係数）
derivative = ["Pu-240"]
