# 集合体 1 体の炉心の形（../branches/core-plant.toml と同じ）に、集合体の高さのすべてに入る制御棒のバンク D を足したもの。先端の高さは
# 21.5 × ステップ (cm) で、0 ステップで全部入り、1 ステップで抜ける。棒はすべて AIC（制御棒の軸の値 aic）。
pitch = 21.5
height = 21.5
map = ["*"]

[rods]
step = 21.5
bottom = 0.0
steps = 1
top = 21.5
map = ["D"]

[rods.bank.D]
type = "rcca"

[rods.type.rcca]
segments = [{ value = "aic", length = 21.5 }]
