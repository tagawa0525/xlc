# 2A-60.toml の燃焼点を 0.5、32、60 MWd/kg の 3 点にしたもの（自由ガスの核の評価の格子点が、ピンの間、状態と摂動の間、燃焼点の
# 間でどれだけ重なるかを、DEBUG のログで数える。#0180）。以下は 2A-60.toml のコメント
#
# #0180 の自己遮蔽の時間の内訳の最小の入力: ブランチ feat/0278-p9-2a-production-table の
# examples/depletion/p9-2A/short-check/branch-2A-short.toml（Problem 9 の本番の形の 2A の分岐のテーブルの短い確認。同じブランチの docs/issues/0278）を、
# 公称の 1 状態（ホウ素 650 ppm、減速材 580 K、燃料 900 K）と 60 MWd/kg の 1 燃焼点にしたもの。輸送は状態の 1 回と Pu-240 の数密度の
# 微分の摂動の 1 回（ADR-0221）で、自己遮蔽も 2 回。格子、離散化、組成、物質、ミクロ燃焼の核種は元の入力と同じ。燃焼の履歴は
# ../../p9-product/lattice-2A.msgpack（ADR-0239 の公称の状態、5 つの燃焼の領域。ADR-0245）。パスはこのディレクトリから見たもの。
#
# 2A-60-light-400.toml は、軽い核種の自由ガスの上限を ADR-0246 の前の既定（400 kT）に戻したもの（掃き直す範囲の広がりの分を測る）。
library = "../../p2/depletion.msgpack"
ufg-tolerance = 1e-4
few-group = { output = "table-2A-multi.msgpack", bounds = [1e7, 0.625, 1e-5] }
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin gt  pin pin gt  pin pin gt  pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

[material.fuel-0]
temperature = 900
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.fuel-1]
temperature = 900
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.fuel-2]
temperature = 900
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.fuel-3]
temperature = 900
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.fuel-4]
temperature = 900
