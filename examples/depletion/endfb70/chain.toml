# 全核種の燃焼チェーン（ADR-0164）を ENDF/B-VII.0 から作る入力。版ごとの燃焼の比較（#0303）に使う
output = "chain.msgpack"
decay-directory = "../../../references/endf/ENDF-B-VII.0_decay"
nfy-directory = "../../../references/endf/ENDF-B-VII.0_nfy"
neutron-directory = "../../../references/endf/ENDF-B-VII.0_neutrons"
# 天然の C、V、Zn の評価（A = 0）を、天然に存在する同位体に当てる（ADR-0262）
natural-isotopes = ["C-12", "C-13", "V-50", "V-51", "Zn-64", "Zn-66", "Zn-67", "Zn-68", "Zn-70"]
# Nb-88m の ELIS -1000 eV は励起エネルギーの分からない準位（ADR-0263）
unknown-excitations = ["Nb-88m"]
