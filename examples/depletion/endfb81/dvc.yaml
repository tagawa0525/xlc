# 版ごとのピンセルの燃焼の比較（#0303、ADR-0264 の「確認」）の ENDF/B-VIII.1 のステージ。多群ライブラリ（xs.toml）は ../dvc.yaml の
# xs-range、xs-nuclide、xs と同じ形（ADR-0138）で、出力は depletion.msgpack。燃焼チェーン chain.msgpack は ../dvc.yaml の
# chain-version@endfb81 の出力。ピンセルの燃焼 lattice-1C-60.toml を解く。
# 実行するのは default の devShell の `dvc repro`（ADR-0159）
vars:
  - xs.toml
stages:
  xs-range:
    cmd: ../../../bin/xs range xs.toml xs-range.toml
    deps:
      - ../../../toml-values/examples/depletion/endfb81/xs.toml.json
      - ../../../references/endf/ENDF-B-VIII.1_neutrons
      - ../../../binary-forms/xs.md5
    outs:
      - xs-range.toml:
          cache: false
  xs-nuclide:
    foreach: ${nuclide}
    do:
      cmd: ../../../bin/xs nuclide xs.toml xs-range.toml ${key} xs-nuclides/${key}.msgpack
      deps:
        - xs-range.toml
        - ${endf-directory}/${item.endf}
        - ${thermal-directory}
        - ../../../binary-forms/xs.md5
      params:
        - xs.toml:
            - sigma0
            - scattering-order
            - nuclide.${key}
      outs:
        - xs-nuclides/${key}.msgpack
  xs:
    cmd: ../../../bin/xs assemble xs.toml xs-range.toml xs-nuclides
    deps:
      - ../../../toml-values/examples/depletion/endfb81/xs.toml.json
      - xs-range.toml
      - xs-nuclides
      - ../../../binary-forms/xs.md5
    outs:
      - depletion.msgpack
  lattice-1C:
    # 燃焼点ごとの k∞ は標準出力に出るので、ファイルに受ける。燃焼の時間の内訳はログ（標準エラー）
    cmd: ../../../bin/lattice lattice-1C-60.toml > lattice-1C-60.out 2> lattice-1C-60.log
    deps:
      - ../../../toml-values/examples/depletion/endfb81/lattice-1C-60.toml.json
      - depletion.msgpack
      - chain.msgpack
      - ../../../binary-forms/lattice.md5
    outs:
      - lattice-1C-60.out
      - lattice-1C-60.msgpack
      - lattice-1C-60.log
