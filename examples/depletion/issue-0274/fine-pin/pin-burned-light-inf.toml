# 燃料の温度を細かく取った燃えた燃料のピンセル（pin-burned.toml）の切り分け: 分離共鳴を持たない核種の自由ガスの上限（ufg-free-gas.upper。既定は 400 kT）をなくしたもの。
# 燃料の温度の軸で 2 群の定数と k∞ を細かく見る（#0274 の「燃料の温度を細かく取ったピンセル」）: ../pin-energy-31.toml と同じピンセル
# （2A の燃料のピン 1 本、重い核種の自由ガスの上限 31 eV。ADR-0243）で、燃料の温度を 560 K と 600〜1350 K の 50 K おきの 17 点にした。
# テーブルの 7 点（ADR-0239）はこの中にあり、残りの 10 点はライブラリ（xs.toml）に足した温度。比べ方は fine_pin.py。
# 燃料は 2A の燃焼の 60 MWd/kg（../../p9-product/lattice-2A.msgpack の燃焼点。5 つの燃焼の領域を含む燃料の全領域を体積で平均）の
# 組成のうち、O-16 と U、Np-237、Pu、Am の 13 核種と Xe-135、Sm-149（burned_composition.py の出力）。ほかの核分裂生成物は、
# ライブラリに 17 点の温度を足す時間を抑えるために外した（#0274 の同じ節）。Pu の共鳴の効きを入れるための組成で、2A の 60 MWd/kg の
# 燃料そのものではない
library = "fine-pin.msgpack"
ufg-tolerance = 1e-4
ufg-free-gas = { upper = inf, heavy = { energy = 31 } }
few-group = { output = "pin-burned-light-inf.msgpack", bounds = [1e7, 0.625, 1e-5] }
pitch = 1.26
azimuthal = 30
spacing = 0.03
rows = ["pin"]

[material.fuel]
temperature = 900
nuclides = { "O-16" = 4.57543821e-02, "U-234" = 1.94259669e-06, "U-235" = 3.37919125e-05, "U-236" = 9.95984375e-05, "U-238" = 2.09304453e-02, "Np-237" = 1.76933000e-05, "Pu-238" = 1.33585801e-05, "Pu-239" = 1.18816905e-04, "Pu-240" = 7.50378091e-05, "Pu-241" = 4.10489648e-05, "Pu-242" = 3.88150019e-05, "Am-241" = 9.95250394e-07, "Am-243" = 1.07267623e-05, "Xe-135" = 5.96157347e-09, "Sm-149" = 4.23846132e-08 }

[material.zircaloy]
temperature = 580

[material.zircaloy.nuclides]
Cr-50 = 3.30121e-06
Cr-52 = 6.36606e-05
Cr-53 = 7.21860e-06
Cr-54 = 1.79686e-06
Fe-54 = 8.68307e-06
Fe-56 = 1.36306e-04
Fe-57 = 3.14789e-06
Fe-58 = 4.18926e-07
Zr-90 = 2.18865e-02
Zr-91 = 4.77292e-03
Zr-92 = 7.29551e-03
Zr-94 = 7.39335e-03
Zr-96 = 1.19110e-03
Sn-112 = 4.68066e-06
Sn-114 = 3.18478e-06
Sn-115 = 1.64064e-06
Sn-116 = 7.01616e-05
Sn-117 = 3.70592e-05
Sn-118 = 1.16872e-04
Sn-119 = 4.14504e-05
Sn-120 = 1.57212e-04
Sn-122 = 2.23417e-05
Sn-124 = 2.79392e-05

[material.water]
temperature = 580
# 減速材の格子点 580 K の密度（IF97 の 15.5132 MPa を小数 6 桁に丸めた値。ADR-0239、ADR-0230）、公称のホウ素 650 ppm。B-10 の割合は
# p2 の 2A の入力の数密度の B-10 / (B-10 + B-11)
water = { density = 0.711901, boron = 650, b10 = 0.199 }

[cell.pin]
zones = [
  { material = "fuel", radius = 0.4096, rings = 5 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", rings = 1 },
]
sectors = 8

[branches]
boron = { ppm = [650], materials = ["water"] }
moderator = { temperature = [580], density = [0.711901], materials = ["water", "zircaloy"] }
fuel = { temperature = [560, 600, 650, 700, 750, 800, 850, 900, 950, 1000, 1050, 1100, 1150, 1200, 1250, 1300, 1350], materials = ["fuel"] }
