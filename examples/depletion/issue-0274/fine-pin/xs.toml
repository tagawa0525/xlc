# #0274 の燃料の温度を細かく取ったピンセル（pin-fresh.toml、pin-burned.toml）のライブラリ。核種の評価と処理の設定（sigma0、
# scattering-order、H-1 の S(α,β)）は ../../p2/xs.toml と同じで、核種はピンセルが輸送するものだけにした。燃料の核種は、テーブルの
# 燃料の温度の 7 点（560、600、750、900、1050、1200、1350 K。ADR-0239）を含む 560 K と 600〜1350 K の 50 K おきの 17 点（O-16 は
# 減速材の 580 K も）、被覆管と減速材の核種は 580 K だけ（H-1 は ../../p2/xs.toml と同じ S(α,β) の 4 点で、580 K は lattice が
# 内挿する。ADR-0080）。xs は温度ごとに独立に処理するので（crates/xs/src/process.rs の `process_nuclide`）、7 点の値は p2 の
# ライブラリと同じになるはずで、pin-energy-31 と比較して確かめる。
# 実行: ../../../../bin/xs xs.toml（このディレクトリで。ポイントワイズの範囲は核種から求め、../../p2/xs-range.toml と同じ
# 4 eV〜1.353 MeV になることを出力で確かめる）
output = "fine-pin.msgpack"
endf-directory = "../../../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
scattering-order = 3

[nuclide.U-234]
endf = "n-092_U_234.endf"
temperatures = [560, 600, 650, 700, 750, 800, 850, 900, 950, 1000, 1050, 1100, 1150, 1200, 1250, 1300, 1350]

