# ADR-0246 の候補（#0274）: ../pin-<状態>-energy-31.toml（#0133 のピンセル、重い核種の上限 31 eV）の、分離共鳴を持たない核種の
# 自由ガスの上限を名前の値（400 は kT の倍数、inf は上限なし、e<eV> は温度によらない入射エネルギー）にしたもの。ring は移行を
# 既定のリングの中性子束（ADR-0207、ADR-0209）にしたもの（ほかは元の入力のとおり無限希釈）。以下はもとの入力の注釈
# #0274 の精度の比べ: ../issue-0133/ufg-sab/pin-1C-0-sab-fast3.toml（ADR-0205 の速い方法。ADR-0209 の既定と同じ散乱核）をライブラリ ../p2/depletion.msgpack で解き、分離共鳴を持つ核種の自由ガスの上限を、温度によらない 31 eV にしたもの。
# #0133 の試行: VERA 1C のピンセル（../../../vera/p1/pincell-1C.toml と同じ形状、温度、離散化。燃料は 1 リング）に、1C の燃焼の 0 MWd/kg（新しい燃料）
# の燃料の組成を置いた 1 つの状態。OpenMC の反応率（openmc_pin_rates*.py）と移行（openmc_pin_transfer.py）と同じ組成。
library = "../../p2/depletion.msgpack"
ufg-scattering = "free-gas"
ufg-free-gas = { upper = { energy = 1000 }, cells = 2, sweeps = 3, heavy = { energy = 31 }, sab = true }
ufg-transfer = "infinite-dilution"
pitch = 1.26
azimuthal = 64
spacing = 0.02
rows = ["pin"]

[material.fuel]
temperature = 900
nuclides = { "O-16" = 4.57642000e-02, "U-234" = 6.11864000e-06, "U-235" = 7.18132000e-04, "U-236" = 3.29861000e-06, "U-238" = 2.21546000e-02 }

[material.zircaloy]
temperature = 600

[material.zircaloy.nuclides]
Cr-50 = 3.30121e-06
Cr-52 = 6.36606e-05
Cr-53 = 7.21860e-06
Cr-54 = 1.79686e-06
Fe-54 = 8.68307e-06
Fe-56 = 1.36306e-04
Fe-57 = 3.14789e-06
Fe-58 = 4.18926e-07
Zr-90 = 2.18865e-02
Zr-91 = 4.77292e-03
Zr-92 = 7.29551e-03
Zr-94 = 7.39335e-03
Zr-96 = 1.19110e-03
Sn-112 = 4.68066e-06
Sn-114 = 3.18478e-06
Sn-115 = 1.64064e-06
Sn-116 = 7.01616e-05
Sn-117 = 3.70592e-05
Sn-118 = 1.16872e-04
Sn-119 = 4.14504e-05
Sn-120 = 1.57212e-04
Sn-122 = 2.23417e-05
Sn-124 = 2.79392e-05

[material.water]
temperature = 600
nuclides = { H-1 = 4.41459e-02, O-16 = 2.20729e-02, B-10 = 9.52537e-06, B-11 = 3.83408e-05 }

[cell.pin]
zones = [
  { material = "fuel", radius = 0.4096, rings = 5 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

