# 燃焼の検証（docs/plans/m4-depletion.md の「進め方」5）の最初の多群ライブラリ（ENDF/B-VIII.0、WIMS 69群。ADR-0169）。
# VERA のピンセル（Problem 1）の物質の核種は examples/vera/xs.toml と同じ評価と温度（燃料の核種と O は 565, 600, 900, 1200 K、
# 冷却材の H は S(α,β) の 550, 573.6, 600 K、被覆管と冷却材のほかの核種は 565, 600 K）。片方を変えたら他方も直す。ただし Zr と Sn は
# 核分裂生成物として燃料の中にもできるので、燃料の温度 565, 600, 900, 1200 K で作る
# 燃焼鎖の核種は、燃料の核種と同じ 565, 600, 900, 1200 K で作る。組は、NUREG/CR-7108 の燃焼度クレジットの 28 核種（本文は手元で確かめていない）
# （U-234〜238 のほかのアクチニド 8 と核分裂生成物 16）に、Xe-135 と Sm-149 の経路（I-135、Xe-135、Pm-147、Pm-148m、Pm-149）と、
# Pu-239 と Cm の経路（Np-239、Am-242m、Cm-242、Cm-244）を足したもの。Pm-148 は非分離共鳴の自己遮蔽が NaN になるので外す（#0127）
output = "depletion.msgpack"
endf-directory = "../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
# 省略すると 3（ADR-0076）。核種ごとの段階の params にするため、書いておく（ADR-0138）
scattering-order = 3

[nuclide.U-234]
endf = "n-092_U_234.endf"
temperatures = [565, 600, 900, 1200]

[nuclide.U-235]
endf = "n-092_U_235.endf"
temperatures = [565, 600, 900, 1200]

[nuclide.U-236]
endf = "n-092_U_236.endf"
temperatures = [565, 600, 900, 1200]

[nuclide.U-238]
endf = "n-092_U_238.endf"
temperatures = [565, 600, 900, 1200]

[nuclide.O-16]
endf = "n-008_O_016.endf"
temperatures = [565, 600, 900, 1200]

[nuclide.H-1]
endf = "n-001_H_001.endf"
temperatures = [550, 573.6, 600]
thermal = "tsl-HinH2O.endf"
# S(α,β) は評価済みデータの上限まで、表の外は THERMR と同じ短時間衝突近似、その上 9118 eV まで自由ガス（ADR-0133）
sab-upper = "evaluated"
sab-outside = "sct"
free-gas-upper = 9118

