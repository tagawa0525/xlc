# 格子点の間の内挿の誤差（ADR-0239 の確認）を、core の今の式（軸の内挿の変数について隣の 2 点の線形）と、内挿の変数と方式の候補で
# 測る（compare_grid_interpolation.py の入力。#0176）。候補ごとに、内側の格子点を、その点を除いたその軸の格子点から内挿して比べる。
# 変数の候補: ホウ素は値（ppm）、減速材は温度と格子点の密度（ADR-0229 の案 T2）、燃料は √T（今の式）、温度、ln T。方式の候補は
# ADR-0192 が燃焼度の軸で比べたもののうち、値が格子点の値の線形結合のもの（PCHIP と Akima は傾きが値に依るので除く）

