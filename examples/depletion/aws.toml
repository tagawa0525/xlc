# VERA Problem 1 のピンセルの OpenMC の燃焼の参照解（openmc_depletion.py）の AWS の実行の定義（ADR-0174）。燃焼はステップごとの
# 区間に分けて流し（openmc_depletion_resume.py）、区間の境界から再開する（progress = "steps"）。tools は VM の src/ に置くツールで、
# 入口（entry）と定義自身は含めない。chain とライブラリは DVC の出力で、手元で作って S3 に置く。
tools = [
  "examples/openmc_common.py",
  "examples/openmc_input.py",
  "examples/openmc_run.py",
  "examples/vera/openmc_tallies.py",
  "examples/vera/openmc_model.py",
  "examples/depletion/openmc_depletion.py",
  "examples/depletion/openmc_depletion_resume.py",
]
entry = "examples/depletion/run_remote.sh"
progress = "steps"
library = "examples/depletion/openmc-library"
data = ["examples/depletion/openmc-chain.xml"]
jobs = '^openmc-1C-[a-z0-9]+$'
