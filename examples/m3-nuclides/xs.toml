# M3 で加える核種（C、Si、P、Ti、Mn、Ni、Ag、Cd、In）の多群ライブラリ（ENDF/B-VIII.0、WIMS 69群）。
# 核種は VERA の仕様書の表 P2-4, P3-3, P4-3, P5-4 の Pyrex、AIC、B4C、SS304、Inconel、ノズル、炉心板のもの。
# 天然の C は C-12 と C-13 に分ける（ADR-0079）。温度は、S(α,β) を持たない核種として計算する温度そのもの
# （HZP の 565 K と、等温温度係数の 560 K と 570 K。ADR-0080）と、仕様書が 600 K とする 2E〜2K と 3A の 600 K。
output = "m3-nuclides.msgpack"
endf-directory = "../../references/endf/ENDF-B-VIII.0_neutrons"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]

[nuclide.C-12]
endf = "n-006_C_012.endf"
temperatures = [560, 565, 570, 600]

[nuclide.C-13]
endf = "n-006_C_013.endf"
temperatures = [560, 565, 570, 600]

