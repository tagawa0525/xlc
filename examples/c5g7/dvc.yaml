# C5G7（2D）の段階: 格子計算（lattice-coarse、lattice-fine）、OpenMC の多群モードの参照解（openmc、openmc-extract）、
# MCNP の参照解と OpenMC との比較（compare-coarse、compare-fine）。断面積は c5g7-xs.toml で、xs の段階はない。
# OpenMC の道具は examples/vera/dvc.yaml の references-shell の出力なので、先に `dvc checkout examples/vera/dvc.yaml` で戻す。
stages:
  lattice-coarse:
    # 結果の k∞ は標準出力に出るので、ファイルに受ける
    cmd: cargo run --release -p xlc-lattice -- c5g7.toml > lattice-coarse.out
    deps:
      - c5g7.toml
      - c5g7-xs.toml
      - ../../crates/lattice/src
      - ../../crates/lattice/Cargo.toml
      - ../../crates/numeric/src
      - ../../crates/numeric/Cargo.toml
      - ../../crates/format/src
      - ../../crates/format/Cargo.toml
      - ../../Cargo.toml
      - ../../Cargo.lock
      - ../../rust-toolchain.toml
      - ../../.cargo/config.toml
      - ../../flake.lock
    outs:
      - pins.msgpack
      - lattice-coarse.out
  lattice-fine:
    # 結果の k∞ は標準出力に出るので、ファイルに受ける
    cmd: cargo run --release -p xlc-lattice -- c5g7-fine.toml > lattice-fine.out
    deps:
      - c5g7-fine.toml
      - c5g7-xs.toml
      - ../../crates/lattice/src
      - ../../crates/lattice/Cargo.toml
      - ../../crates/numeric/src
      - ../../crates/numeric/Cargo.toml
      - ../../crates/format/src
      - ../../crates/format/Cargo.toml
      - ../../Cargo.toml
      - ../../Cargo.lock
      - ../../rust-toolchain.toml
      - ../../.cargo/config.toml
      - ../../flake.lock
    outs:
      - fine-pins.msgpack
      - lattice-fine.out
  openmc:
    # 多群モードなので cross_sections.xml は要らない。断面積は lattice と同じ c5g7-xs.toml
    cmd: nix develop ../..#references -c python3 openmc_model.py run openmc-c5g7.toml openmc
    deps:
      - openmc_model.py
      - ../openmc_common.py
      - ../openmc_run.py
      - ../vera/references-shell.txt
      - openmc-c5g7.toml
      - c5g7-xs.toml
    outs:
      - openmc
  openmc-extract:
    cmd: nix develop ../..#references -c python3 openmc_model.py extract openmc-c5g7.toml openmc openmc-results
    deps:
      - openmc_model.py
      - ../openmc_common.py
      - ../openmc_run.py
      - ../vera/references-shell.txt
      - openmc-c5g7.toml
      - c5g7-xs.toml
      - openmc
    outs:
      - openmc-results
  compare-coarse:
    cmd: python3 compare.py lattice-coarse.out pins.msgpack openmc-results/pins.msgpack > compare-coarse.out
    deps:
      - compare.py
      - lattice-coarse.out
      - pins.msgpack
      - openmc-results/pins.msgpack
    outs:
      - compare-coarse.out
  compare-fine:
    cmd: python3 compare.py lattice-fine.out fine-pins.msgpack openmc-results/pins.msgpack > compare-fine.out
    deps:
      - compare.py
      - lattice-fine.out
      - fine-pins.msgpack
      - openmc-results/pins.msgpack
    outs:
      - compare-fine.out
