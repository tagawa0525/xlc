# c5g7.toml を細かく分けた入力。ピンは燃料を等体積の 5 リング、燃料の外から内接円（0.63 cm）までを
# 3 リング、四隅を含む 0.75 cm までを 2 リング（セルの外周で切り取る）と残り、どれも 45° の扇形 8 つに
