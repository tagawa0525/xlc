# LWR MOX ピンセル（NEA）の多群ライブラリ（ENDF/B-VIII.0、WIMS 69群）。OpenMC の参照解と同じ核種で、
# 温度はすべて 600 K。
output = "mox.msgpack"
endf-directory = "../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]

[nuclide.U-235]
endf = "n-092_U_235.endf"
temperatures = [600]

[nuclide.U-238]
endf = "n-092_U_238.endf"
temperatures = [600]

[nuclide.Pu-238]
endf = "n-094_Pu_238.endf"
temperatures = [600]

[nuclide.Pu-239]
endf = "n-094_Pu_239.endf"
temperatures = [600]

[nuclide.Pu-240]
endf = "n-094_Pu_240.endf"
temperatures = [600]

[nuclide.Pu-241]
endf = "n-094_Pu_241.endf"
temperatures = [600]

[nuclide.Pu-242]
endf = "n-094_Pu_242.endf"
temperatures = [600]

[nuclide.Am-241]
endf = "n-095_Am_241.endf"
temperatures = [600]

[nuclide.O-16]
endf = "n-008_O_016.endf"
temperatures = [600]

[nuclide.H-1]
endf = "n-001_H_001.endf"
temperatures = [600]
thermal = "tsl-HinH2O.endf"

[nuclide.Zr-90]
endf = "n-040_Zr_090.endf"
