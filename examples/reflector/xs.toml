# 径方向の反射体の格子（燃料の集合体 + ギャップ + SS304 のバッフル + 水。ADR-0095）の多群ライブラリ（ENDF/B-VIII.0、
# WIMS 69群）。examples/vera/xs.toml の核種に、SS304（VERA の仕様書の表 P2-4）の C、Si、P、Mn、Ni を足し、すべて
# 600 K だけにしたもの（VERA REF1-2D は 600 K の等温。仕様書の Table M2-1）。軸方向の反射体の平板（ADR-0128）の
# Inconel-718 の Ti も足す。核種の入力は examples/vera/xs.toml と examples/m3-nuclides/xs.toml と同じ。
output = "reflector.msgpack"
endf-directory = "../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]

[nuclide.U-234]
endf = "n-092_U_234.endf"
temperatures = [600]

