# 角型の格子（reflector-corner.toml）を core-corner.toml と同じ境界で解くケース。反射体 3 つも集合体の位置に置く
# （#0029）。反射体どうしの面は、core-corner.toml と同じく各側の ADF を使う（ADR-0132）。
cycle = "core-corner-get-cycle.toml"
axial-mesh = [0.0, 21.5]
radial-nodes = 1
pin-powers = "core-pins-corner-get.msgpack"
boundary = { x = ["reflective", "vacuum"], y = ["reflective", "vacuum"], z = ["reflective", "reflective"] }
