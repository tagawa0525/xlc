# 角型の格子（reflector-corner.toml）を core-corner.toml と同じ境界で解くケース。反射体 3 つも集合体の位置に置き、
# 反射体の位置どうしの面の ADF を 1 とせず、格子の GET の ADF を使う（#0029）。
cycle = "core-corner-get-cycle.toml"
axial-mesh = [0.0, 21.5]
radial-nodes = 1
pin-powers = "core-pins-corner-get.msgpack"
boundary = { x = ["reflective", "vacuum"], y = ["reflective", "vacuum"], z = ["reflective", "reflective"] }
