# M1 のピンセル（M0 と同じ組成、燃料 900 K・減速材 293.6 K、無限希釈）: 3.1 wt% の UO2（10.4 g/cm3）と水（0.74 g/cm3）。被覆管は含めない。
# 個数密度は 1/(barn cm)。
library = "m1.msgpack"
self-shielding = false
few-group = { output = "pincell-fg-f900-m293.6.msgpack", bounds = [1e7, 0.625, 1e-5] }
pitch = 1.26
azimuthal = 32
spacing = 0.05
rows = ["pin"]

[material.fuel]
temperature = 900
nuclides = { U-235 = 7.281430e-04, U-238 = 2.247284e-02, O-16 = 4.640196e-02 }

[material.water]
temperature = 293.6
nuclides = { H-1 = 4.947415e-02, O-16 = 2.473708e-02 }

[cell.pin]
zones = [{ material = "fuel", radius = 0.4096, rings = 3 }, { material = "water", rings = 2 }]
