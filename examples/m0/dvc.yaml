# M0 の段階: ENDF → 多群ライブラリ（xs）→ ピンセルの2群定数（lattice）→ 炉心の k_eff（core）。
# 走らせるのは `dvc repro`（ADR-0159）。deps には、段階の入力と、段階が呼ぶ実行ファイル（リポジトリの直下の dvc.yaml の
# build が bin/ に作る）を並べる。コードを変えても実行ファイルのバイトが変わらなければ、段階は走らない（ADR-0159）。
stages:
  xs:
    cmd: ../../bin/xs xs.toml
    deps:
      - xs.toml
      - ../../references/endf/ENDF-B-VIII.0_neutrons/n-001_H_001.endf
      - ../../references/endf/ENDF-B-VIII.0_neutrons/n-008_O_016.endf
      - ../../references/endf/ENDF-B-VIII.0_neutrons/n-092_U_235.endf
      - ../../references/endf/ENDF-B-VIII.0_neutrons/n-092_U_238.endf
      - ../../bin/xs
    outs:
      - wims69.msgpack
  lattice:
    # 結果の k∞ は標準出力に出るので、ファイルに受ける
    cmd: ../../bin/lattice pincell.toml > lattice.out
    deps:
      - pincell.toml
      - wims69.msgpack
      - ../../bin/lattice
    outs:
      - pincell-fg.msgpack
      - lattice.out
  core:
    # 結果（k_eff、漏れ、集合体ごとの核分裂率）は標準出力に出るので、ファイルに受ける
    cmd: ../../bin/core core.toml > core.out
    deps:
      - core.toml
      - cycle.toml
      - plant.toml
      - assemblies.toml
      - pincell-fg.msgpack
      - ../../bin/core
    outs:
      - core.out
