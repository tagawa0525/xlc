        - ../../Cargo.toml
        - ../../Cargo.lock
        - ../../rust-toolchain.toml
        - ../../.cargo/config.toml
        - ../../flake.lock
      outs:
        - fg-${item}.msgpack
        - lattice-${item}.out
  table:
    cmd: python3 rod_table.py table-rods.msgpack out=fg-out.msgpack aic=fg-aic.msgpack b4c=fg-b4c.msgpack
    deps:
      - rod_table.py
      - fg-out.msgpack
      - fg-aic.msgpack
      - fg-b4c.msgpack
    outs:
      - table-rods.msgpack
  core:
    foreach: ${cases}
    do:
      # DVC は出力の親のディレクトリを作らないので、作ってから走らせる
      cmd: mkdir -p out && cargo run --release -p xlc-core -- cases/${item}.toml > out/${item}.out
      deps:
        - cases/${item}.toml
        - plant.toml
        - assemblies.toml
        - cycle.toml
        - table-rods.msgpack
        - ../../crates/core/src
        - ../../crates/core/Cargo.toml
        - ../../crates/numeric/src
        - ../../crates/numeric/Cargo.toml
        - ../../crates/format/src
        - ../../crates/format/Cargo.toml
        - ../../Cargo.toml
        - ../../Cargo.lock
        - ../../rust-toolchain.toml
        - ../../.cargo/config.toml
        - ../../flake.lock
      outs:
        - out/${item}.out
