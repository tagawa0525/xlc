  lattice:
    foreach: [out, aic, b4c]
    do:
      # 結果の k∞ は標準出力に出るので、ファイルに受ける
      cmd: cargo run --release -p xlc-lattice -- assembly-${item}.toml > lattice-${item}.out
      deps:
        - assembly-${item}.toml
        - rods.msgpack
        - ../../crates/lattice/src
        - ../../crates/lattice/Cargo.toml
        - ../../crates/numeric/src
        - ../../crates/numeric/Cargo.toml
        - ../../crates/format/src
