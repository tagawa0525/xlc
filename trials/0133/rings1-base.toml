# 格子計算の燃焼の検証（ADR-0173）: VERA Problem 1C のピンセル（燃料 900 K、被覆管と減速材 600 K、ホウ素 1300 ppm。
# ../vera/p1/pincell-1C.toml と同じ形状、組成、離散化）を、燃料 1 リングの燃焼の領域で、分岐なしの 1 つの状態で燃焼させる。
# OpenMC の参照解は openmc-1C-rings1.toml。出力密度 38.41 W/g は VERA Problem 9 のサイクル 1 の平均（16.939 GWd/MT / 441 EFPD）。
library = "../../examples/depletion/depletion.msgpack"
pitch = 1.26
azimuthal = 64
spacing = 0.02
rows = ["pin"]

[material.fuel]
temperature = 900
nuclides = { U-234 = 6.11864e-06, U-235 = 7.18132e-04, U-236 = 3.29861e-06, U-238 = 2.21546e-02, O-16 = 4.57642e-02 }

[material.zircaloy]
temperature = 600

[material.zircaloy.nuclides]
Cr-50 = 3.30121e-06
Cr-52 = 6.36606e-05
Cr-53 = 7.21860e-06
Cr-54 = 1.79686e-06
Fe-54 = 8.68307e-06
Fe-56 = 1.36306e-04
Fe-57 = 3.14789e-06
Fe-58 = 4.18926e-07
Zr-90 = 2.18865e-02
Zr-91 = 4.77292e-03
Zr-92 = 7.29551e-03
Zr-94 = 7.39335e-03
Zr-96 = 1.19110e-03
Sn-112 = 4.68066e-06
Sn-114 = 3.18478e-06
Sn-115 = 1.64064e-06
Sn-116 = 7.01616e-05
Sn-117 = 3.70592e-05
Sn-118 = 1.16872e-04
Sn-119 = 4.14504e-05
Sn-120 = 1.57212e-04
Sn-122 = 2.23417e-05
Sn-124 = 2.79392e-05

[material.water]
temperature = 600
nuclides = { H-1 = 4.41459e-02, O-16 = 2.20729e-02, B-10 = 9.52537e-06, B-11 = 3.83408e-05 }

[cell.pin]
zones = [
  { material = "fuel", radius = 0.4096, rings = 5 },
  { material = "void", radius = 0.418, rings = 1 },
  { material = "zircaloy", radius = 0.475, rings = 1 },
  { material = "water", radius = 0.63, rings = 3 },
  { material = "water", radius = 0.75, rings = 2 },
  { material = "water", rings = 1 },
]
sectors = 8

[depletion]
chain = "../../examples/depletion/chain.msgpack"
power = 38.41
burnup = [0.1, 0.5, 1.0, 2.0, 3.0, 5.0]
materials = ["fuel"]
output = "rings1-base.msgpack"
few-group = { bounds = [1e7, 0.625, 1e-5] }
