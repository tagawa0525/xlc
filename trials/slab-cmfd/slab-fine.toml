# このファイルは axial_slab.py が書く（版 fine）。手で直さない。
# VERA Problem 3A の軸方向の反射体の平板（ADR-0128）: 集合体の高さ全体（下の水の外端から上の水の外端まで 518.937 cm）を
# 格子の x（左が炉心の −z）に並べた1行の平板。左右は真空、上下は鏡面反射。燃料は単一集合体の格子計算
# （assembly-3A.toml）が書いた媒質。層の物質は、層の断面（ピッチ 21.50 cm の正方形）の中で体積で混ぜる。自己遮蔽は
# しない（真空の辺のある格子の Dancoff 係数は #0008 で未決）。燃料の中の支持格子は入れない（#0011）。
# 物理的な層（−z から。仕様書の 1.1 節の表 1、1.3 節の表 3、1.4 節の表 4、表 5）:
#   lower water: 50.0 cm
#   lower core plate: 5.0 cm
#   bottom nozzle: 6.053 cm
#   lower gap: 4.228 cm
#   lower end plug: 1.67 cm
#   fuel: 365.76 cm
#   plenum: 8.556 cm
#   plenum with the top end grid: 3.866 cm
#   plenum: 3.578 cm
#   upper end plug: 1.67 cm
#   shoulder gap: 2.129 cm
#   top nozzle: 8.827 cm
#   upper core plate: 7.6 cm
#   upper water: 50.0 cm
# 燃料は 16 ノード。列の幅は層ごとに 1.0 cm の半分 程度。
