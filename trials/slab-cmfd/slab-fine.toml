# 炉心板: SS304 と冷却材を 50% ずつ（仕様書の表 5）
[material.plate]
mix = [{ material = "ss304", volume = 0.5 }, { material = "water", volume = 0.5 }]

# ボトムノズル: 水の割合は仕様書の表 P3-3 の H-1 の比 0.72077（6.25 kg / 8.00 g/cm³ / (21.5² × 6.053 cm) の鋼の割合からは 0.72078）
[material.bnozzle]
mix = [{ material = "ss304", volume = 0.27923 }, { material = "water", volume = 0.72077 }]

# トップノズル: 水の割合は仕様書の表 P3-3 の H-1 の比 0.80853（6.25 kg / 8.00 g/cm³ / (21.5² × 8.827 cm) の鋼の割合からも 0.80853）
[material.tnozzle]
mix = [{ material = "ss304", volume = 0.19147 }, { material = "water", volume = 0.80853 }]

# 下のギャップと肩のギャップ: 案内管 24 本と計装管の Zircaloy（3.76343 cm²）と水
[material.gap]
mix = [{ material = "zircaloy", volume = 0.00814154 }, { material = "water", volume = 0.99185846 }]

# 端栓: 半径 0.475 cm の Zircaloy の棒 264 本（187.12897 cm²）、管と水
[material.plug]
mix = [{ material = "zircaloy", volume = 0.41296353 }, { material = "water", volume = 0.58703647 }]

# プレナム: 被覆管（42.21629 cm²）、He を真空（144.91267 cm²）、管と水
[material.plenum]
mix = [{ material = "zircaloy", volume = 0.09946938 }, { material = "void", volume = 0.31349415 }, { material = "water", volume = 0.58703647 }]

# 上の端の支持格子の高さのプレナム: プレナムに Inconel-718（32.11998 cm²）を足し、水を減らす
[material.pgrid]
mix = [{ material = "zircaloy", volume = 0.09946938 }, { material = "void", volume = 0.31349415 }, { material = "inconel", volume = 0.06948616 }, { material = "water", volume = 0.51755031 }]

