cycle = "5A-C-cycle.toml"
axial-mesh = [0.0, 21.5]
radial-nodes = 1
pin-powers = "5A-C-pins.msgpack"
boundary = { x = ["vacuum", "vacuum"], y = ["vacuum", "vacuum"], z = ["reflective", "reflective"], outline = "vacuum" }
