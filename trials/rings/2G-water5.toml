# VERA Problem 2G: 2B の集合体の 24 本の案内管すべてに AIC の制御棒を入れたもの（燃料、被覆管、減速材 600 K、減速材 0.743 g/cc、
# ホウ素 1300 ppm。仕様書の表 P2-1）。制御棒の寸法は表 8（吸収体の半径 0.382 cm、SS304 の被覆管 0.386〜0.484 cm）、
