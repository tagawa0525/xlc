# VERA Problem 2K: 2F（24 本の案内管すべてに Pyrex の棒）の燃料を、濃縮度 3.6% と 3.1% の 2 種に分けたもの（燃料、被覆管、
# 減速材 600 K、減速材 0.743 g/cc、ホウ素 1300 ppm。仕様書の表 P2-1、P2-2）。3.1%（`pin`）は他の問題と同じ燃料で、計装管の
# 上下左右の隣の 4 本と、集合体の四隅のまわりの 6 本ずつの計 28 本。残りの 236 本が 3.6%（`pin36`。組成は表 P2-4）。配置は
# 図 P2-2 の 1/8 の図を 17×17 に広げたもの。Pyrex の棒の寸法は表 6、配置は図 5 の 24 本、Pyrex と SS304 の組成は表 P2-4
# （天然の C は C-12 と C-13 に分ける。ADR-0079）。ギャップの He は除いて真空にし（ADR-0054）、Pyrex の棒の中の He も同じ（ADR-0120）。
# 配置と組成は OpenMC のモデル（openmc_model.py）と同じ。集合体の周りに水のギャップ 0.04 cm（両側で 0.08 cm）。
