# 履歴の補正の core（ADR-0215）の確認 4: R を持つ公称のテーブルの集合体 1 体を、20 MWd/kg までは公称の状態（減速材 565 K）で、
# その後を条件 j（600 K、0.661 g/cc）で燃焼させる。ノードの減速材の密度の履歴 H_m は、20 MWd/kg から燃焼度で重みを付けた平均で
# 0.743 から 0.661 g/cc へ向かい、w = (H_m − 0.743) / (0.661 − 0.743) が 0 から 2/3 まで増える。
# ステップは ../branches/core-2A-micro.toml と同じ 40（0.1〜60 MWd/kg）、出力密度は 2A の燃焼の履歴と同じ 38.41 W/g。
cycle = "cycle.toml"
axial-mesh = [0.0, 21.5]
radial-nodes = 1
boundary = { x = ["reflective", "reflective"], y = ["reflective", "reflective"], z = ["reflective", "reflective"] }

[state.nominal]
boron = 1300
b10 = 0.199
moderator = 565
fuel = 565

[state.branch]
boron = 1300
b10 = 0.199
moderator = 600
fuel = 565

[depletion]
specific-power = 38.41
history = "core-rate-index.msgpack"
# 格子計算の燃焼（../p2/lattice-2A.toml）と同じチェーン
micro = { chain = "../../examples/depletion/chain.msgpack", xenon = "tracked" }
