# #0129 の試行（make_inputs.py が書く）
# 格子計算の燃焼の検証（ADR-0178）: VERA Problem 2 の Gd 燃料（1.8% 濃縮、5% Gd2O3）12 本（図 P2-2。リングごとに燃焼する。600 K、0.743 g/cc）を、分岐なしの 1 つの状態で、
# 70 点（最後は 60 MWd/kg）まで燃焼させる。OpenMC の参照解は openmc-2O.toml。
# 出力密度 38.41 W/g は VERA Problem 9 のサイクル 1 の平均（16.939 GWd/MT / 441 EFPD）。形状、組成と燃焼度の点は
# OpenMC の入力と同じ表（openmc_depletion_assembly.py）から p2_inputs.py が書く。手で直さない。集合体の周りに水のギャップ 0.04 cm。
# 燃焼させる物質は fuel, gd0, gd1, gd2, gd3, gd4, gd5, gd6, gd7（対称操作の組ごとに 1 つの領域。ADR-0173）。
track-table = false
library = "../../examples/depletion/p2/depletion.msgpack"
pitch = 1.26
azimuthal = 30
spacing = 0.03
gap = { width = 0.04, material = "water" }
rows = [
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin it  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin gd  pin pin pin pin pin pin pin gd  pin pin pin pin",
  "pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin gt  pin pin",
  "pin pin pin pin pin pin gd  pin pin pin gd  pin pin pin pin pin pin",
  "pin pin pin gt  pin pin pin pin pin pin pin pin pin gt  pin pin pin",
  "pin pin gd  pin pin gt  pin pin gt  pin pin gt  pin pin gd  pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
  "pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin pin",
]

