# #0131 の試行: VERA の 1B の核種だけの ENDF/B-VIII.0 のライブラリ（../../../examples/vera/xs.toml の核種の節）のうち、
# U-235を ENDF/B-VII.0（../../../examples/vera/endfb70/xs.toml）の核種の節と核種ごとの出力に入れ替えたもの。
# nuclides/ は各版の核種ごとの出力（xs-nuclides）への symlink。assemble は ENDF を読まない。
output = "vera.msgpack"
endf-directory = "../../../references/endf/ENDF-B-VIII.0_neutrons"
thermal-directory = "../../../references/endf/ENDF-B-VIII.0_thermal_scatt"
sigma0 = [1e10, 1e5, 1e4, 1e3, 300, 100, 30, 10, 1]
scattering-order = 3

[nuclide.B-10]
endf = "n-005_B_010.endf"
temperatures = [560, 565, 570, 580, 590, 600, 610]

